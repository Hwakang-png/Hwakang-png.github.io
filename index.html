<style>
/* 레이아웃: 기존 진단 사이트 형식 그대로 — 어두운 상단 바, 900px 본문 한 단, 카드형 선택지 */

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#efeee9;--ink2:#c3c2bc;--ink3:#8e8d88;--line:#33322f;--bg:#141413;--card:#1d1c1b;
--ac:#e07a43;--ac2:#3a2519;--dk:#0d0d0e;--ok:#7cc29c;--oks:#17261e;--ng:#f0a0a0;--ngs:#2c1717;--ngb:#4a2626;--warn:#e6c66e;--warns:#2a2414;color-scheme:dark}}

--ac:#e07a43;--ac2:#3a2519;--dk:#0d0d0e;--ok:#7cc29c;--oks:#17261e;--ng:#f0a0a0;--ngs:#2c1717;--ngb:#4a2626;--warn:#e6c66e;--warns:#2a2414;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.75;font-size:16px;letter-spacing:-.01em;font-family:var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--dk)}
a{color:var(--ac)}

.banner{background:var(--warns);color:var(--warn);font-size:13px;padding-block:9px;text-align:center}

.wrap{max-width:900px;margin:0 auto;padding-block:36px 80px}

h3{font-size:17px;margin:30px 0 10px;letter-spacing:-.02em}
h4{font-size:15px;margin:20px 0 6px}
p{margin:0 0 12px;color:var(--ink2)}strong{color:var(--ink);font-weight:650}
ul,ol{margin:0 0 14px;padding-left:20px;color:var(--ink2)}li{margin-bottom:6px}li::marker{color:var(--ink3)}

.meta b{display:block;font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:.06em;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}

.body{margin-top:8px}

.pick .nm a{text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.pick .sm{font-size:13px;color:var(--ink3)}
.avoid{background:var(--ngs);border:1px solid var(--ngb);border-radius:6px;padding:16px 18px;margin:16px 0}

.avoid a{display:inline-block;background:var(--card);border:1px solid var(--ngb);border-radius:99px;padding:4px 12px;font-size:13.5px;margin:0 6px 6px 0;color:var(--ink);text-decoration:none}

<script>
const DATA={"S": [{"id": "3d9a453d2b29813f9f3bfa02ea155e67", "n": "삭발", "p": {"검수": "검수 대기", "계열": "클래식", "적합": ["계란형", "M자 이마", "넓은 이마", "가는 모발", "탈모 초기"], "재방문 기간": "1~2주", "분류": "커트", "기장": "숏", "비적합": [], "손질 난이도": "쉬움"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded"], "쓰는 시술": ["3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e"], "쓰는 제품": []}, "h": "<h3>어떤 느낌을 추구하는가</h3><p>힙하거나, 미련이 없거나</p><p>일반적으로 삭발을 하는 경우는 잘 없다. 무한도전의 길처럼, 절의 승려처럼 완전히 머리를 미는 걸 말한다.</p><p>어중간하게 짧은 머리들과 달리 타협점을 맞출 수 없는 머리다. 패션으로 한다면 두상과 얼굴형을 잘 고려해야 한다.</p><h3>변형</h3><p>삭발은 형태를 바꿀 자리가 없다. 의미도 없다.</p><p>혹여 탈모라서 삭발을 하는데 기장을 살짝 살려 버린다면 탈모라인이 드러날 수 있으니 하지 말 것.</p><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>헤어라인이 뒤로 물러났거나 정수리 숱이 줄어든 분</strong> — 헤어라인이 안 보이기 때문에 패션인지 유전인지 알 수 없다.</li><li><strong>몸이 좋은 분</strong> — 대머리에 몸 좋은 사람은 클리셰이자 클래식이다. 과도한 테스토스테론으로 인해 머리가 빠졌다면 좋은 몸을 살리는 것도 방법이다.</li><li><strong>곱슬이 아주 심한 분</strong> — 감당이 안 되는 곱슬이라면 밀어버리는 것도 방법이다.</li><li><strong>얼굴이 계란형에 가까운 분</strong> — 계란형인데 뭔들 안 어울릴까.</li><li><strong>머리에 손대는 시간을 아예 없애고 싶은 분</strong> — 감고 닦으면 끝이다.</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>마른 분</strong> — 말랐는데 머리도 없으면 굉장히 없어 보인다.</li><li><strong>두피가 예민하거나 햇빛에 잘 붉어지는 분</strong> — 가려주는 게 없어 두피가 그대로 탄다. 모발의 멜라닌은 자외선 차단의 기능이 있다.</li></ul><h3>스타일링</h3><ol><li>감고 수건으로 닦아준다. 스타일링할 게 없다.</li></ol><h3>유지·관리</h3><p>짧을수록 자란 티가 빨리 난다. 전체를 밀어놨기 때문에 며칠만 지나도 자란 머리가 보이기 시작한다. 면도한다는 생각으로 관리해줘야 한다.</p><p>해가 강한 날이면 모자를 쓰는 게 좋다.</p><p>두피에 뭐가 일어난다면 로션이나, 두피 토닉 같은 걸로 관리해 줘야 한다.</p>"}, {"id": "3d9a453d2b2981c68d23ef30596346bd", "n": "반삭(스포츠컷)", "p": {"검수": "검수 대기", "계열": "클래식", "적합": ["직모", "강곱슬", "굵은 모발", "숱 많음"], "재방문 기간": "2~3주", "분류": "커트", "기장": "숏", "비적합": ["역삼각형", "M자 이마", "넓은 이마", "가는 모발", "숱 적음", "탈모 초기"], "손질 난이도": "쉬움"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded", "3fba453d2b29812cab4afb0f0ccc3931"], "쓰는 시술": ["3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e"], "쓰는 제품": ["3f1a453d2b29810a9246efec4876fc83", "3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b29813e96afdd83d89b2950", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>짧은 머리다. 짧은 머리에서 모양을 만들어 그나마의 디자인을 만드는 것이 이 머리의 중요 포인트다.</strong></p><p>옆과 뒤는 바리깡으로 밀어붙이고 윗머리만 형태가 남을 만큼 남기기 때문에, 두상이 위로 서 보이고 얼굴이 더 드러난다.</p><p>삭발처럼 세지 않으면서 손질은 거의 하지 않아도 되는 자리에 있다. 손질이 귀찮고, 머리가 억세서 어떤 머리도 잘 안 어울린다면 충분히 고려할 만한 머리다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>반삭(버즈컷)</td><td>옆머리도 살짝 길게 간다. 윗머리와 비슷한 기장으로 자르고 질감을 더 살린다.</td><td>힙한 느낌을 살리고 싶은 분, 탈색이나 염색을 하신 분.</td></tr><tr><td>페이드를 넣은 스포츠컷</td><td>옆과 뒤를 페이드를 넣어줘 재미를 더해준다.</td><td>구레나룻이 짧아도 상관없으신 분, 좀 더 클래식하게 머리에 재미를 더하고 싶으신 분.(생각보다 과한 느낌을 준다)</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>턱선이 각진 분</strong> — 짧은 옆머리가 그 선을 가리지 않고 살려준다</li><li><strong>모발이 뻣뻣한 직모인 분</strong> — 짧게 깎을 때 기장이 고르게 나온다. 형태도 잘 보인다.</li><li><strong>숱이 많아 머리가 옆으로 부푸는 분</strong> — 옆을 밀어버리면 부피가 사라진다.</li><li><strong>아침에 손댈 시간이 없는 분</strong> — 손볼 게 없다.</li><li>곱슬이 심한 분 — 곱슬기가 형태를 더 완성해 준다.</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>머리를 기르는 중인 분</strong> — 한 번 넣으면 원래 기장으로 돌아오는 데 오래 걸린다</li><li>인상이 강하신 분 — 강한 인상이 험악한 분위기를 만들 수 있다.</li></ul><h3>스타일링</h3><ol><li>손질하고 말고 할 게 없다. 윗머리가 너무 뜬다면 윗머리만 손으로 눌러줘서 말린다.</li></ol><h3>유지·관리</h3><p>옆을 짧게 밀어놓은 만큼, 자라면 제일 먼저 옆이 두꺼워지면서 머리통이 옆으로 퍼져 보인다. 금방 머리가 자란다고 느낄 수 있기 때문에 미용실을 자주 들르면 좋다.</p><p>목선은 기장과 상관없이 가장 먼저 지저분해지는 자리다.</p><p>아침 손질이 거의 없다는 게 이 머리의 값이라, 손질을 하기 시작하면 굳이 이 기장일 이유가 줄어든다.</p>"}, {"id": "3d9a453d2b29817bb873ec64bfde21e7", "n": "모히칸", "p": {"검수": "검수 대기", "계열": "클래식", "적합": ["좁은 이마", "정수리 납작", "옆머리 뜸"], "재방문 기간": "2~3주", "분류": "커트", "기장": "숏", "비적합": ["긴 얼굴", "가는 모발", "탈모 초기", "강곱슬"], "손질 난이도": "쉬움"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded", "3fba453d2b29812cab4afb0f0ccc3931"], "쓰는 시술": ["3e5a453d2b29806b9811e9ce804373ab", "3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e"], "쓰는 제품": ["3f1a453d2b29810a9246efec4876fc83", "3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b29813e96afdd83d89b2950", "3f1a453d2b298142a158e3793eb948a3", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b298103a960f9250cf86318", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<p>(이 글에서 말하는 ‘띠’란, 양옆을 밀고 남은 윗머리를 말한다.)</p><h3>어떤 느낌을 추구하는가</h3><p><strong>가운데로 시선이 모이는 머리다.</strong></p><p>옆을 짧게 눌러놓고 가운데만 남기기 때문에 얼굴이 좁고 길어 보이고, 위로 뻗는 선이 생겨 키와 인상이 같이 서 보인다.</p><p>보통 한국에선 잘 안 하긴 한다. 10년 전엔 좀 했었지만 애기들 아니면 잘 안하는 머리.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>소프트 모히칸</td><td>옆을 완전히 밀지 않고 짧게만 가져간다.</td><td>직장이 있는 분, 처음 시도하는 분</td></tr><tr><td>윗머리를 길게 한 모히칸</td><td>앞머리 부분을 훨씬 길게해준다.</td><td>훨씬 더 강렬한 느낌을 원하면 앞머리를 더 길게 가져가는 것도 좋다.</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>턱선이 각진 분</strong> — 가운데로 모이는 선이 각을 눌러준다</li><li><strong>얼굴이 둥근 분</strong> — 위로 서는 선이 생겨 세로로 길어 보인다</li><li><strong>숱이 많은 분</strong> — 가운데에 모아 세울 머리가 넉넉하다</li><li><strong>살짝 곱슬기가 있는 분</strong> — 눕지 않고 잘 서고, 움직임이 자연스럽게 나온다</li><li><strong>키가 작은 편이라 위로 높이를 주고 싶은 분</strong></li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>얼굴이 긴 분</strong> — 위로 더 늘어나 보인다</li><li><strong>숱이 적거나 모발이 가는 분</strong> — 가운데가 서지 않고 주저앉아 오히려 빈약해 보인다.</li><li><strong>정수리 쪽 숱이 줄기 시작한 분</strong> — 머리가 가장 많이 필요한 자리가 비어 있다</li><li><strong>아침에 손댈 시간이 없는 분</strong> — 최소한 제품은 발라 줘야 한다. 손이 많이 가는 스타일은 아니지만 손질은 해 줘야 한다.</li></ul><h3>스타일링</h3><ol><li>머리를 앞으로 모아주는 식으로 말려준다.</li><li>아래에서 위로 바람을 넣어 말린다</li><li>매트 왁스를 손에 얇게 펴서 가운데 머리만 손끝으로 집어 세운다. 옆은 건드리지 않는다</li><li>광택을 내고 싶으면 매트 왁스 대신 포마드를 쓴다</li><li>멀리서 스프레이를 얇게 뿌려 고정한다</li></ol><p><strong>제품</strong> 매트 왁스 · 포마드 · 스프레이</p><h3>유지·관리</h3><p>형태가 옆과 가운데의 길이 <strong>차이</strong>에서 나오는 머리라, 옆이 자라 차이가 좁혀지면 모히칸으로 안 보이고 그냥 덥수룩한 머리가 된다. 가운데는 좀 자라도 잘 서니, 옆이 너무 길어지면 잘라준다.</p><p>매일 세우는 손질이 전제인 머리라는 점은 미리 말해두는 편이 낫다. 손질을 멈추면 형태가 바로 사라진다.</p>"}, {"id": "3d9a453d2b2981f98da5dabb4369df5d", "n": "아이비리그", "p": {"검수": "초안", "계열": "클래식", "적합": ["둥근 얼굴", "좁은 이마", "직모", "굵은 모발"], "재방문 기간": "2~3주", "분류": "커트", "기장": "숏", "비적합": ["M자 이마", "넓은 이마", "긴 얼굴", "정수리 납작", "뒤통수 납작", "가는 모발", "강곱슬"], "손질 난이도": "어려움"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded", "3fba453d2b29812cab4afb0f0ccc3931"], "쓰는 시술": ["3e5a453d2b298105bf24f26c05ec1a1e", "3e5a453d2b29806b9811e9ce804373ab", "3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e"], "쓰는 제품": ["3f1a453d2b29810a9246efec4876fc83", "3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b29813e96afdd83d89b2950", "3f1a453d2b298142a158e3793eb948a3", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b298103a960f9250cf86318", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29813cab36fa8be6ec6d95"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>이마를 전부 드러내는, 가장 단정한 쪽의 머리.</strong></p><p>앞머리를 내리지 않고 위로 세워 올리기 때문에 이마가 그대로 보인다. 옆과 뒤는 짧게 올려치고 윗머리만 남겨서, 실루엣이 위로는 서고 옆으로는 붙는다. 옆에서 보면 앞머리 라인이 둥글지 않고 사각에 가깝게 떨어져 짧은데도 밋밋해 보이지 않는다.</p><p>남자 커트 중 <strong>가장 남성적이고 깔끔한 인상</strong>을 만든다. 단정함이 필요한 자리에서 가장 확실한 답이다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>클래식 아이비리그</td><td>옆머리를 테이퍼로 정리하고 윗머리는 5cm</td><td>직장인, 무난하게 가고 싶은 분</td></tr><tr><td>페이드 아이비리그</td><td>옆머리를 페이드로 처리한다</td><td>바버 스타일을 좋아하는 20~30대</td></tr><tr><td>롱 아이비리그</td><td>윗머리를 7~9cm로 길게 남긴다</td><td>볼륨을 원하는 분</td></tr><tr><td>텍스처 아이비리그</td><td>윗머리에 질감을 강조한다</td><td>캐주얼하게 가고 싶은 분</td></tr><tr><td>아이비리그 + 볼륨펌</td><td>세워 놓은 상태가 쉽게 유지된다</td><td>직모거나 모발이 가는 분</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>두상 모양이 예쁜 분</strong> — 머리가 짧아 두상이 그대로 드러난다</li><li><strong>이마가 넓지 않고 헤어라인이 깔끔한 분</strong> — 이마를 다 드러내는 스타일이라 그 부분이 제일 먼저 보인다</li><li><strong>얼굴이 둥글거나 짧은 분</strong> — 위로 세운 높이가 얼굴을 길어 보이게 한다</li><li><strong>턱선이 뚜렷한 분</strong></li><li><strong>모발이 굵고 힘이 있는 직모인 분</strong> — 왁스만 발라도 선다</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>M자 이마 · 이마가 넓은 분</strong> — 가려주는 부분이 없어 그대로 드러난다. 드롭컷을 권해드린다</li><li><strong>뒤통수나 정수리가 납작한 분</strong> — 짧게 자르는 커트라 머리 모양을 보완할 여지가 적다</li><li><strong>모발이 가늘고 힘이 없는 분</strong> — 앞머리가 서지 않아 그냥 눌린 짧은 머리가 된다</li><li><strong>얼굴이 긴 분</strong> — 위로 세운 높이가 더해져 더 길어 보인다</li><li><strong>곱슬이 아주 심한 분</strong> — 각진 라인이 나오지 않는다</li></ul><h3>스타일링</h3><ol><li>젖은 상태에서 뿌리를 <strong>앞에서 뒤 방향</strong>으로 강하게 말린다</li><li>앞머리는 손으로 들어올린 채 뜨거운 바람을 준 뒤 찬바람으로 굳힌다</li><li>하드 왁스를 손에 완전히 편다</li><li>뒤에서 앞으로 발라 올리며 세운다</li><li>앞머리는 마지막에 손끝으로 살짝 앞으로 눌러 각진 라인을 유지한다</li><li>스프레이로 고정한다 — 이 스타일은 고정이 관건이다</li></ol><p><strong>제품</strong> 하드 왁스 · 강한 스프레이</p><h3>유지·관리</h3><p>짧은 머리는 조금만 자라도 티가 난다. 옆머리가 자라 부풀기 시작하면 실루엣이 무너지면서 머리가 커 보인다.</p><p>두피가 그대로 드러나는 스타일이라 자외선을 조심해야 하고, 매일 왁스를 쓴다면 두피 세정을 철저히 해야 한다.</p>"}, {"id": "3d9a453d2b29816da0aff35e0393c2f7", "n": "리젠트컷", "p": {"검수": "초안", "계열": "클래식", "적합": ["둥근 얼굴", "각진 얼굴", "직모", "굵은 모발", "정수리 납작"], "재방문 기간": "4~5주", "분류": "커트", "기장": "숏", "비적합": ["긴 얼굴", "M자 이마", "넓은 이마", "가는 모발", "강곱슬"], "손질 난이도": "어려움"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded", "3fba453d2b29812cab4afb0f0ccc3931"], "쓰는 시술": ["3e5a453d2b29806b9811e9ce804373ab", "3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e", "3e5a453d2b2981d0879ff1b388e7e034", "3e5a453d2b2981e692d5caf41ddf9ddc", "3e5a453d2b2981388dfacbef18f6eec0"], "쓰는 제품": ["3f1a453d2b29810a9246efec4876fc83", "3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b29813e96afdd83d89b2950", "3f1a453d2b298142a158e3793eb948a3", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b298103a960f9250cf86318", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>앞머리를 크게 부풀려 위로 세우고 뒤로 넘기는 머리.</strong></p><p>인상이 매우 강하고 남성적이다. 앞머리 볼륨이 세로 길이를 만들어 얼굴이 갸름해 보이고, 키도 커 보이는 효과가 있다.</p><p>볼륨의 정점이 어디 있느냐로 인상이 갈린다. 앞쪽이면 강렬하고 뒤쪽이면 부드럽다.</p><p>다만 볼륨이 과하면 촌스러워지기 때문에 요즘은 <strong>볼륨을 낮춘 쪽</strong>이 주류다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>클래식 리젠트</td><td>볼륨 크게, 광택 있게</td><td>개성이 강한 분</td></tr><tr><td>소프트 리젠트</td><td>볼륨 낮게, 광 없이</td><td>일상에서 편하게 쓰고 싶은 분</td></tr><tr><td>리젠트 + 페이드</td><td>옆머리를 페이드로</td><td>바버샵 느낌을 원하는 분</td></tr><tr><td>사이드파트 리젠트</td><td>가르마를 넣고 볼륨을 얹는다</td><td>비즈니스 자리가 많은 분</td></tr><tr><td>리젠트펌</td><td>펌으로 볼륨을 고정한다</td><td>직모라 볼륨이 금방 죽는 분, 아침 시간이 없는 분</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>얼굴이 둥글거나 짧은 분</strong> — 위쪽 볼륨이 세로 길이를 만들어 갸름해 보인다</li><li><strong>키가 작은 분</strong> — 시각적으로 키가 커 보인다</li><li><strong>이목구비가 뚜렷하고 턱선이 강한 분</strong> — 강한 인상과 잘 붙는다</li><li><strong>모발이 굵고 힘 있는 직모인 분</strong> — 볼륨이 가장 잘 서는 모질이다</li><li><strong>정수리가 납작한 분</strong> — 볼륨의 정점을 뒤로 옮기면 정수리까지 덮인다</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>얼굴이 긴 분</strong> — 세로가 극단적으로 더 길어진다. 가장 안 맞는 조합이다</li><li><strong>M자 이마 · 넓은 이마인 분</strong> — 앞머리를 전부 넘기기 때문에 이마가 그대로 드러난다</li><li><strong>키가 큰 분</strong> — 과하게 커 보일 수 있다</li><li><strong>모발이 가는 분</strong> — 볼륨이 만들어지지 않는다. 펌을 같이 해야 한다</li><li><strong>곱슬이 심한 분</strong> — 볼륨은 쉽게 나오지만 방향이 제멋대로라 정돈이 안 된다</li><li><strong>인상이 강한 게 부담스러운 분</strong> — 보수적인 직장에서는 부담스러울 수 있다</li></ul><h3>스타일링</h3><ol><li>젖은 상태에서 앞머리를 <strong>위로 들어올리며</strong> 뿌리에 뜨거운 바람</li><li>롤브러시로 앞머리를 말아 올려 볼륨을 만든다</li><li><strong>찬바람으로 볼륨 고정</strong> — 이 단계를 생략하면 무조건 무너진다</li><li>매트 왁스 또는 포마드를 뒤에서 앞으로 바른다</li><li>앞머리는 손으로 들어올려 볼륨을 유지한 채 뒤로 넘긴다</li><li>스프레이로 앞머리 뿌리를 고정한다</li></ol><p><strong>제품</strong> 매트 왁스 · 포마드 · 스프레이 · 롤브러시</p><h3>유지·관리</h3><p>볼륨이 무너지면 스타일이 통째로 죽는다. 그래서 스프레이가 사실상 필수고, 습한 날씨나 비 오는 날에 특히 취약하다.</p><p>손질 난이도가 남자 커트 중 최상위다. 매일 롤브러시로 볼륨을 만들어야 한다.</p><p>리젠트펌을 얹으면 이 부담이 크게 줄어든다.</p>"}, {"id": "3d7a453d2b2981af9728ee0ab8d6c934", "n": "크롭컷", "p": {"검수": "초안", "계열": "클래식", "적합": ["M자 이마", "넓은 이마", "숱 적음", "반곱슬", "긴 얼굴", "탈모 초기"], "재방문 기간": "2~3주", "분류": "커트", "기장": "숏", "비적합": ["좁은 이마", "굵은 모발", "강곱슬"], "손질 난이도": "쉬움"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded", "3fba453d2b29812cab4afb0f0ccc3931"], "쓰는 시술": ["3e5a453d2b298105bf24f26c05ec1a1e", "3e5a453d2b29800bb541cc73573fe355", "3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e", "3e5a453d2b2981acb102c624d765abf0", "3e5a453d2b2981d0879ff1b388e7e034"], "쓰는 제품": ["3f1a453d2b29810a9246efec4876fc83", "3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b29813e96afdd83d89b2950", "3f1a453d2b298142a158e3793eb948a3", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29816f9e35e77056dba514", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>손댄 티는 안 나는데 정리는 되어 있는 머리.</strong></p><p>앞머리를 이마 위로 내려 떨어뜨리기 때문에 이마가 드러나지 않는다. 윗머리는 매끈하게 다듬지 않고 끝을 불규칙하게 만들어 질감을 남긴다. 그래서 가만히 둬도 헝클어진 게 아니라 자연스러운 쪽으로 읽힌다.</p><p>남자 커트 중 <strong>맞는 사람의 폭이 가장 넓은 축</strong>이다. 숱이 적어도 소화되고, 곱슬은 펴는 게 아니라 그대로 질감으로 쓴다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>숏가일</td><td>자르는 건 같고 스타일링만 바꾸면 된다</td><td>이마 라인이 예쁘거나, 곱슬기가 좀 있어서 잘 넘어가는 분</td></tr><tr><td>드롭컷</td><td>자르는 건 같고 스타일링만 바꾸면 된다</td><td>이마 쪽 머리가 정갈하게 자라는 분</td></tr><tr><td>텍스처 크롭컷</td><td>질감을 더 강하게 낸다</td><td>제품을 쓸 줄 알고 손질을 하는데, 심심한 건 싫은 분</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>M자 이마 · 넓은 이마 · 헤어라인이 뒤로 물러난 분</strong> — 앞머리가 그 라인을 덮는다</li><li><strong>숱이 적은 분</strong> — 짧은 기장에서 볼륨이 생겨 숱이 있어 보인다</li><li><strong>곱슬이 있는 분</strong> — 펴지 않고 그대로 질감으로 쓴다</li><li><strong>얼굴이 긴 분</strong> — 앞머리가 세로 길이를 줄여준다</li><li><strong>손질에 시간을 안 쓰고 싶은 분</strong> — 왁스 30초면 끝난다</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>두상이 옆으로 퍼진 분</strong> — 윗머리와 옆머리가 만나는 부분에서 길이 차이가 너무 도드라진다</li><li><strong>이마가 좁은 분</strong> — 앞머리까지 내려오면 더 답답해 보인다</li><li><strong>모발이 굵고 뻣뻣한 분</strong> — 머리가 눕지 않고 떠오른다. 다운펌을 같이 해야 한다</li><li><strong>곱슬이 아주 심한 분</strong> — 질감으로 살리기 어려워진다</li></ul><h3>스타일링</h3><ol><li>물기를 털어낸 뒤 머리를 흔들어가며 말린다. <strong>위에서 아래로 내려가며</strong> 말려야 옆이 뜨지 않는다</li><li>매트 왁스를 손에 충분히 편 뒤, 앞머리 쪽을 털듯이 발라 질감과 볼륨을 만든다</li><li>쓸어내리지 말고 질감을 살린 채로 마무리한다</li></ol><p><strong>제품</strong> 매트 왁스 · 텍스처 스프레이</p><h3>유지·관리</h3><p>짧은 만큼 자란 티가 빨리 난다. 옆을 아주 짧게 넣었으면 더 빠르다.</p><p>대신 아침 손질은 남자 커트 중 가장 짧다. 왁스 30초.</p>"}, {"id": "3d9a453d2b29811f85b7e06a7efc9b30", "n": "드롭컷", "p": {"검수": "검수 대기", "계열": "트랜드", "적합": ["M자 이마", "옆머리 뜸", "큰 두상", "반곱슬", "굵은 모발", "숱 많음"], "재방문 기간": "3~4주", "분류": "커트", "기장": "숏", "비적합": ["둥근 얼굴", "넓은 이마", "강곱슬", "가는 모발", "숱 적음", "탈모 초기"], "손질 난이도": "쉬움"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded"], "쓰는 시술": ["3e5a453d2b29806b9811e9ce804373ab", "3e5a453d2b29800bb541cc73573fe355", "3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e", "3e5a453d2b2981acb102c624d765abf0"], "쓰는 제품": ["3f1a453d2b29810a9246efec4876fc83", "3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b29813e96afdd83d89b2950", "3f1a453d2b298142a158e3793eb948a3", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29816f9e35e77056dba514", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>짧고 깔끔하지만 심심하지만은 않은 머리.</strong></p><p>이마 가운데는 열어두고 좌우 앞머리만 내려 관자놀이 위쪽을 덮는다. 그래서 M자를 좀 가려줄 수 있다. 가운데가 열려 있어 답답해 보이지 않는다.</p><p>정면에서 보면 세로로 긴 타원이 된다. 짧게 친 남성적인 느낌은 유지하면서 좀 더 부드럽고 캐주얼하게 푼 쪽이다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>숏 드롭</td><td>전체를 짧게 가서 관리가 편하다</td><td>직장인, 여름에 시원하게 가고 싶은 분</td></tr><tr><td>롱 드롭(필러스)</td><td>눈썹을 덮는 기장</td><td>시니컬한 느낌을 선호하는 분, 이마가 많이 좁은 분.</td></tr><tr><td>텍스처 드롭</td><td>드롭컷에서 텍스처를 많이 살려준다.</td><td>드롭도 심심해서 뭔가 더하고 싶은 분, 힙한걸 좋아하는 분.</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>광대가 발달한 분</strong> — 관자놀이 위를 덮어 폭을 줄여준다</li><li><strong>이마가 넓지 않은 분</strong> — 가운데를 열어도 부담이 없다. 좁은 이마 특유의 답답함을 줄여준다.</li><li><strong>직모거나 반곱슬이고 숱이 보통 이상인 분</strong> — 덮을 머리카락이 충분하다</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>이마가 아주 넓은 분</strong> — 가운데가 열려 있어 넓이가 더 강조된다. 아주 살짝만 열어주는 느낌으로 바꾼다.</li><li><strong>얼굴이 긴 분</strong> — 세로로 긴 실루엣이라 더 길어 보인다</li><li><strong>숱이 적은 분</strong> — 관자놀이 위를 덮을 머리카락이 부족하다. 탑을 길게 가져가 덮기엔 머리가 처져 보인다.</li><li><strong>곱슬이 아주 심한 분</strong> — 앞머리 방향이 제멋대로 나온다. 부분 매직이 필요하다.</li><li><strong>모발이 얇은 분 </strong>— 덮는 앞머리가 부족해 보인다.</li></ul><h3>스타일링</h3><ol><li>일단 내리며 전체적으로 말려준다.</li><li>앞머리는 좌우로 벌리며 내려 방향을 잡는다</li><li>왁스(포마드)를 손에 편 뒤 앞에서부터 바른다.</li><li>앞머리 좌우를 손끝으로 잡아 벌리며 내려준다.</li><li>가운데는 살짝 들어 열어준다.</li></ol><p><strong>제품</strong> 왁스 · 포마드 · 가벼운 스프레이</p><h3>유지·관리</h3><p>관자놀이 위를 덮는 부분이 자라 손질이 어려워지면 올때가 된것이다.</p><p>보통 윗머리보다 옆머리가 먼저 뜨기 시작하면서 많이 부해진다. 옆머리가 많이 부해지면 미용실을 갈 타이밍.</p>"}, {"id": "3d9a453d2b29817195d6f35744c8c8d0", "n": "숏가일컷", "p": {"검수": "초안", "계열": "클래식", "적합": ["둥근 얼굴", "각진 얼굴", "직모", "굵은 모발", "반곱슬"], "재방문 기간": "3주", "분류": "커트", "기장": "숏", "비적합": ["긴 얼굴", "M자 이마", "넓은 이마", "가는 모발", "강곱슬"], "손질 난이도": "보통"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded", "3fba453d2b29812cab4afb0f0ccc3931", "3fba453d2b2981e4b783cad65072b611"], "쓰는 시술": ["3e5a453d2b29806b9811e9ce804373ab", "3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e", "3e5a453d2b2981388dfacbef18f6eec0", "3e5a453d2b2981e692d5caf41ddf9ddc"], "쓰는 제품": ["3f1a453d2b29810a9246efec4876fc83", "3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b29813e96afdd83d89b2950", "3f1a453d2b298142a158e3793eb948a3", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b298103a960f9250cf86318", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29816f9e35e77056dba514", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>앞머리를 위로 세워 뒤로 젖히는 머리.</strong></p><p>이마를 완전히 드러내고 앞쪽에 각진 볼륨을 만들기 때문에 <strong>가장 활동적이고 시원한 인상</strong>이 된다.</p><p>옆에서 보면 앞이 각지게 솟았다가 뒤로 흐른다. 둥글게 넘어가는 리젠트와 달리 직선적으로 서기 때문에 인상이 더 캐주얼하고 짧다.</p><p>짧은 기장에서도 볼륨을 만들 수 있어 진입 장벽이 낮은 편이다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>기본 가일컷</td><td>앞머리를 세우고 옆을 짧게</td><td>활동적인 인상을 원하는 분</td></tr><tr><td>소프트 가일컷</td><td>볼륨을 낮게 간다</td><td>직장인, 부담이 적었으면 하는 분</td></tr><tr><td>가일 + 페이드</td><td>옆머리를 페이드로</td><td>바버샵 느낌을 원하는 분</td></tr><tr><td>스파이키 가일</td><td>끝을 뾰족하게 질감을 낸다</td><td>개성을 살리고 싶은 20대</td></tr><tr><td>가일 + 텍스처</td><td>질감 마감을 함께 한다</td><td>자연스러운 쪽이 좋은 분</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>얼굴이 둥글거나 짧은 분</strong> — 위쪽 볼륨이 세로 길이를 만들어 갸름해 보인다</li><li><strong>키가 작은 분</strong> — 시각적으로 커 보인다</li><li><strong>이목구비가 뚜렷하고 턱선이 강한 분</strong></li><li><strong>이마와 헤어라인이 깔끔한 분</strong> — 이마가 전부 드러나는 게 전제다</li><li><strong>모발이 굵고 힘 있는 직모인 분</strong> — 왁스만 발라도 선다</li><li><strong>운동을 하거나 활동량이 많은 분</strong></li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>M자 이마 · 넓은 이마인 분</strong> — 이마가 완전히 드러나 약점이 그대로 보인다. 앞머리를 내리는 쪽이 낫다</li><li><strong>얼굴이 긴 분</strong> — 세로가 더 길어진다</li><li><strong>모발이 가는 분</strong> — 볼륨이 서지 않고 금방 주저앉는다. 펌을 같이 하는 게 사실상 필수다</li><li><strong>키가 큰 분</strong> — 과하게 커 보인다</li><li><strong>인상이 강한 게 부담스러운 분</strong> — 보수적인 직장에서는 부담스러울 수 있다</li></ul><h3>스타일링</h3><ol><li>젖은 상태에서 앞머리를 <strong>위로 들어올리며</strong> 뿌리에 뜨거운 바람</li><li><strong>찬바람으로 고정</strong> — 이 단계를 생략하면 무조건 주저앉는다</li><li>매트 왁스를 손바닥에서 완전히 편다</li><li>뒤에서 앞으로 발라 올리며 세운다</li><li>앞머리 끝을 손끝으로 집어 방향을 잡는다</li><li>스프레이로 뿌리를 고정한다</li></ol><p><strong>제품</strong> 매트 왁스 · 스프레이</p><h3>유지·관리</h3><p>옆머리가 자라면 위아래 대비가 사라져 볼륨이 죽어 보인다. 그래서 옆만 정리하는 리터치로도 컨디션이 돌아온다.</p><p>앞머리가 길어지면 무게에 눌려 처지므로 앞머리부터 관리한다.</p><p>습한 날씨와 비 오는 날에 취약해 스프레이가 필요하고, 매일 왁스를 쓰는 만큼 두피 세정을 철저히 한다.</p>"}, {"id": "3d9a453d2b2981159f91eea784e4305a", "n": "텍스처컷", "p": {"검수": "초안", "계열": "트랜드", "적합": ["숱 많음", "굵은 모발", "반곱슬", "정수리 납작"], "재방문 기간": "4~5주", "분류": "커트", "기장": "미디움", "비적합": ["숱 적음", "강곱슬"], "손질 난이도": "쉬움"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded", "3fba453d2b29812cab4afb0f0ccc3931"], "쓰는 시술": ["3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e"], "쓰는 제품": ["3f1a453d2b29810a9246efec4876fc83", "3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b29813e96afdd83d89b2950", "3f1a453d2b298142a158e3793eb948a3", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b298103a960f9250cf86318", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29816f9e35e77056dba514", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>무겁지 않고 결이 보이는 머리.</strong></p><p>끝을 일자로 뭉툭하게 자르면 머리가 덩어리로 떨어진다. 텍스처컷은 그 끝을 가늘고 불규칙하게 만들어 머리카락이 한 올씩 따로 움직이게 한다.</p><p>그래서 손질을 거의 안 해도 자연스러워 보이고, 왁스를 조금만 발라도 결이 산다. 윤곽선이 또렷하지 않고 흐릿한 것이 이 머리의 정상 상태다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>텍스처 크롭</td><td>짧게 가면서 앞머리를 내린다</td><td>손질을 최소화하고 싶은 분, M자 이마</td></tr><tr><td>텍스처 댄디</td><td>댄디컷에 질감 마감을 얻는다</td><td>무난하게 가고 싶은 직장인</td></tr><tr><td>텍스처 필러스</td><td>곧게 떨어지는 흐름에 질감을 더한다</td><td>숱이 많은 분</td></tr><tr><td>롱 텍스처</td><td>10cm 이상으로 흐름을 강조한다</td><td>20대, 캐주얼하게 가고 싶은 분</td></tr><tr><td>텍스처 + 펌</td><td>텍스처펌을 같이 한다</td><td>직모인 분</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>숱이 많고 모발이 굵어 머리가 무겁게 떨어지는 분</strong> — 이 커트의 1순위다</li><li><strong>자른 티가 나는 게 싫은 분</strong> — 자란 뒤에도 자연스럽다</li><li><strong>반곱슬이거나 자연 웨이브가 있는 분</strong> — 결이 저절로 산다</li><li><strong>아침에 손질할 시간이 없는 분</strong> — 20~40대 전 연령</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>숱이 적은 분</strong> — 끝을 가늘게 빼면 더 휑해 보인다. 질감을 최소한만 넣는다</li><li><strong>모발이 심하게 상한 분</strong> — 끝이 갈라져 지저분해 보인다</li><li><strong>각 잡힌 단정함이 필요한 일을 하시는 분</strong> — 윤곽이 흐려 정돈된 느낌이 약하다</li><li><strong>곱슬이 아주 심한 분</strong> — 결이 아니라 부스스함이 된다</li></ul><h3>스타일링</h3><ol><li>물기를 70% 정도 없앤 뒤 뿌리를 세우며 말린다</li><li>빗은 거의 쓰지 말고 손가락으로 헝클어뜨리며 말린다</li><li>매트 왁스를 손에 완전히 편 뒤 손끝으로만 만진다</li><li>머리를 집어 비틀듯 잡으면 결이 확실히 산다</li><li>텍스처 스프레이를 뿌리면 결이 한층 강해진다</li><li><strong>광이 나는 제품은 쓰지 않는다</strong> — 텍스처컷은 매트가 생명이다</li></ol><p><strong>제품</strong> 매트 왁스 · 텍스처 스프레이 · 매트 밤</p><h3>유지·관리</h3><p>자라도 형태가 무너지지 않는 것이 이 커트의 최대 장점이라 여유가 있다. 자란 뒤에도 \"덜 자른 것처럼\" 보인다.</p><p>다만 끝이 갈라지면 결이 지저분해지므로 손상 관리가 필요하다. 모자를 썼다 벗어도 손으로 헝클면 바로 돌아온다.</p>"}, {"id": "3d9a453d2b2981c6bc74e69273772aae", "n": "슬릭백(포마드)", "p": {"검수": "초안", "계열": "클래식", "적합": ["얼굴 큼", "큰 두상", "숱 많음", "옆머리 뜸", "직모", "굵은 모발", "뒤통수 납작"], "재방문 기간": "2~3주", "분류": "커트", "기장": "미디움", "비적합": ["M자 이마", "넓은 이마", "숱 적음", "긴 얼굴", "강곱슬", "탈모 초기"], "손질 난이도": "어려움"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded"], "쓰는 시술": ["3e5a453d2b298105bf24f26c05ec1a1e", "3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e", "3e5a453d2b2981acb102c624d765abf0", "3e5a453d2b2981d0879ff1b388e7e034"], "쓰는 제품": ["3f1a453d2b29810a9246efec4876fc83", "3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b29813e96afdd83d89b2950", "3f1a453d2b298142a158e3793eb948a3", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b298103a960f9250cf86318", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29816f9e35e77056dba514", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>옆과 뒤를 아주 짧게 밀고 윗머리를 길게 남겨 뒤로 넘기는 머리.</strong></p><p>위아래 대비를 극단적으로 벌리는 게 핵심이다. 옆이 짧아 얼굴 폭이 확 좁아 보이고, 위쪽 볼륨이 세로 길이를 만들어 인상이 날렵해진다.</p><p>슬릭컷이 자연스러운 정돈이라면, 이쪽은 <strong>의도적으로 만든 대비와 강한 실루엣</strong>이다.</p><p>대신 어울리는 사람이 명확히 갈리고 관리 주기도 짧다. 남성 헤어 중 <strong>가장 완성도가 높아 보이지만 가장 까다로운</strong> 축에 속한다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>디스커넥티드 언더컷</td><td>단차(디스커넥션)가 확연하고 연결부가 없다</td><td>개성이 강한 분</td></tr><tr><td>페이드 언더컷</td><td>경계를 흐리게 한다</td><td>무난하게 가고 싶은 분</td></tr><tr><td>사이드 온리 언더컷</td><td>옆만 밀고 뒤는 자연스럽게 둔다</td><td>부담이 적었으면 하는 분</td></tr><tr><td>볼륨 슬릭백</td><td>앞머리 볼륨을 크게 가져간다</td><td>리젠트 쪽 느낌을 원하는 분</td></tr><tr><td>매트 슬릭백</td><td>광택 없이 마무리한다</td><td>일상에서 자연스러운 게 좋은 분</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>얼굴이 크거나 넓은 분</strong> — 옆을 밀어내면 폭이 확 줄어든다</li><li><strong>숱이 아주 많고 옆이 부푸는 분</strong> — 근본적인 해결책이다</li><li><strong>이마와 헤어라인이 깔끔한 분</strong></li><li><strong>이목구비가 뚜렷하고 턱선이 강한 분</strong></li><li><strong>강한 인상을 원하는 20~30대</strong></li><li><strong>모발이 굵고 힘 있는 직모인 분</strong> — 무게가 넘김을 유지해준다</li><li><strong>뒤통수가 납작한 분</strong> — 넘긴 머리가 뒤통수에 볼륨을 만들어 오히려 유리하다</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>M자 이마 · 넓은 이마 · 헤어라인이 뒤로 물러난 분</strong> — 이마가 완전히 드러나 약점이 극대화된다</li><li><strong>숱이 적은 분</strong> — 넘기면 두피가 훤히 보이고 옆머리 경계도 그대로 드러난다</li><li><strong>두상이 작은 분</strong> — 옆을 밀면 머리가 더 작아 보여 밸런스가 깨진다</li><li><strong>얼굴이 긴 분</strong> — 세로가 극단적으로 길어진다</li><li><strong>곱슬이 심한 분</strong> — 옆은 밀어서 해결되지만 윗머리가 넘어가지 않는다</li><li><strong>인상이 강한 게 부담스러운 분</strong> — 대비가 강해 보수적인 직장에서는 부담이 크다. 옆만 하고 페이드로 푸는 방법이 있다</li><li><strong>자주 못 오시는 분</strong> — 옆이 자라면 실루엣이 금방 무너진다</li></ul><h3>스타일링</h3><ol><li>젖은 상태에서 뿌리를 앞쪽으로 먼저 말려 볼륨을 확보한다</li><li>뒤로 넘기면서 롤브러시로 텐션을 준다</li><li>옆머리는 손바닥으로 눌러 밀착시킨다</li><li>제품을 손바닥에서 완전히 녹인 뒤 뒤통수 → 앞머리 순으로 <strong>얇게 여러 번</strong> 바른다</li><li>빗으로 결을 정리한다</li><li>스프레이로 고정한다 — 대비가 강한 스타일일수록 무너지면 티가 크다</li></ol><p><strong>제품</strong> 포마드 · 매트 왁스 · 스프레이 · 롤브러시</p><h3>유지·관리</h3><p>옆머리가 자라면 대비가 사라져 스타일 자체가 성립하지 않는다. 그래서 남자 커트 중 재방문이 가장 잦은 쪽이고, 옆만 정리하러 오는 리터치 수요가 가장 크다.</p><p>제품을 쓴 날은 두 번 감아야 한다. 잔여물이 두피에 남으면 모낭염으로 이어진다.</p><p>윗머리는 계속 길러도 되므로 기장 조절은 자유롭다.</p>"}, {"id": "3d9a453d2b29812f9255d09fdce26f23", "n": "필러스컷", "p": {"검수": "초안", "계열": "트랜드", "적합": ["큰 두상", "숱 많음", "굵은 모발", "직모", "둥근 얼굴"], "재방문 기간": "4~5주", "분류": "커트", "기장": "미디움", "비적합": ["숱 적음", "가는 모발", "긴 얼굴", "정수리 납작", "강곱슬"], "손질 난이도": "보통"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded", "3fba453d2b2981e4b783cad65072b611"], "쓰는 시술": ["3e5a453d2b29806b9811e9ce804373ab", "3e5a453d2b29800bb541cc73573fe355", "3e5a453d2b2981428a7ed03d8e8083db", "3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e", "3e5a453d2b2981acb102c624d765abf0"], "쓰는 제품": ["3f1a453d2b29810a9246efec4876fc83", "3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b29813e96afdd83d89b2950", "3f1a453d2b298142a158e3793eb948a3", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29816f9e35e77056dba514", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>머리를 작게 만들어 이목구비를 살리는 머리.</strong></p><p>볼륨을 일부러 죽여 모발이 아래로 곧게 떨어지게 만든다. 볼륨이 사라지면 두상이 작아 보이고, 머리가 작아 보이면 얼굴의 이목구비가 상대적으로 또렷해진다.</p><p>질감은 느슨하고 비치게, 흐름은 곧게 — 이 두 가지가 동시에 간다. 남성적이고 카리스마 있는 인상이 되고, 가르마 흐름과 붙이는 경우가 많다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>롱 필러스</td><td>눈을 덮는 기장, 중성적인 느낌</td><td>20대, 개성을 원하는 분</td></tr><tr><td>숏 필러스</td><td>눈썹 위 기장, 스포티한 느낌</td><td>직장인, 활동적인 분</td></tr><tr><td>가르마 필러스</td><td>사선 흐름을 결합한다</td><td>성숙한 인상을 원하는 분</td></tr><tr><td>시스루 필러스</td><td>앞머리를 대폭으로 비치게 한다</td><td>얼굴이 큰 분</td></tr><tr><td>필러스 + 다운펌</td><td>옆머리를 완전히 눌러 붙인다</td><td>옆머리가 뜨는 분</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>이목구비가 뚜렷한 분</strong> — 이목구비를 강조하는 커트라 여기서 효과가 가장 크다</li><li><strong>두상이 크거나 머리가 커 보이는 분</strong> — 볼륨을 없애 작아 보인다</li><li><strong>숱이 많고 모발이 굵은 분</strong> — 속머리 숱을 덜어내는 효과가 크다</li><li><strong>얼굴이 짧거나 둥근 분</strong> — 곧게 떨어지는 흐름이 길어 보이게 한다</li><li><strong>남성적이고 시크한 인상을 원하는 20~30대</strong></li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>이목구비가 부드럽고 흐릿한 분</strong> — 볼륨이 사라지면 얼굴이 밋밋해 보인다. 이 커트에서 가장 많이 실패하는 경우다</li><li><strong>숱이 적은 분</strong> — 볼륨을 죽이면 두피가 그대로 보인다</li><li><strong>얼굴이 아주 긴 분</strong> — 곧은 흐름이 세로를 더 늘린다</li><li><strong>정수리가 납작한 분</strong> — 볼륨까지 죽이면 뒷모습이 완전히 평평해진다</li><li><strong>모발이 아주 가는 분</strong> — 힘이 없어 축 처진다</li></ul><h3>스타일링</h3><ol><li>드라이는 <strong>뿌리를 누르는 방향</strong>으로. 위에서 아래로 바람을 준다</li><li>옆머리는 손바닥으로 눌러가며 말린다</li><li>왁스보다 <strong>에센스 · 오일 · 크림 왁스</strong>가 맞다. 무게를 줘야 곧은 흐름이 산다</li><li>매트 왁스를 쓸 경우 아주 소량으로 끝 갈래만</li><li>앞머리는 손끝으로 세로 갈래를 나누어 비치게 유지한다</li><li>스프레이는 거의 쓰지 않는다 — 뻣뻣해지면 이 머리의 느낌이 죽는다. 하드 왁스와 강한 스프레이는 맞지 않는다</li></ol><p><strong>제품</strong> 헤어 에센스 · 크림 왁스 · 라이트 오일 · 소량의 매트 밤</p><h3>유지·관리</h3><p>기장이 길어 여유가 있지만, 속머리 숱이 다시 차오르면 무거워진다. 자라면서 볼륨이 살아나 이 머리 특유의 느낌이 사라지므로, \"무거워졌다\" 싶으면 올 때가 된 것이다.</p><p>모발이 상하면 곧은 흐름이 안 나오고 부스스해져 트리트먼트를 같이 하는 게 좋다. 원래 눌린 스타일이라 모자에는 강한 편이다.</p>"}, {"id": "3d9a453d2b2981c79bbde3132f2f3b92", "n": "댄디컷", "p": {"검수": "초안", "계열": "클래식", "적합": ["넓은 이마", "M자 이마", "직모", "반곱슬"], "재방문 기간": "3~4주", "분류": "커트", "기장": "미디움", "비적합": ["숱 많음", "굵은 모발", "좁은 이마", "강곱슬", "긴 얼굴", "둥근 얼굴", "옆머리 뜸"], "손질 난이도": "쉬움"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded"], "쓰는 시술": ["3e5a453d2b29800bb541cc73573fe355", "3e5a453d2b2981428a7ed03d8e8083db", "3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e", "3e5a453d2b2981acb102c624d765abf0"], "쓰는 제품": ["3f1a453d2b29810a9246efec4876fc83", "3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b29813e96afdd83d89b2950", "3f1a453d2b298142a158e3793eb948a3", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29816f9e35e77056dba514", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>기교 없이 단정해 보이는, 가장 기본이 되는 머리.</strong></p><p>앞머리와 윗머리를 상대적으로 길게 남기고 옆과 뒤를 짧게 정리해, 앞머리가 자연스럽게 내려와 이마를 덮는다. 형태가 요란하지 않아 어떤 옷차림에도, 어떤 자리에도 붙는다.</p><p>반대로 말하면 <strong>감출 기교가 없는 만큼 자른 사람의 실력이 가장 적나라하게 드러나는 머리</strong>이기도 하다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>시스루 댄디</td><td>앞머리 숱을 40~60% 덜어낸다</td><td>20~30대</td></tr><tr><td>투블럭 댄디</td><td>옆머리를 밀어낸다(보통 12mm 이상)</td><td>머리숱이 너무 많으시고 곱슬이 좀 있으신 분</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>대부분 잘 어울립니다</strong> — 어디에 붙여도 무난한 쪽이다</li><li><strong>이마가 넓거나 M자 라인이 있는 분</strong> — 앞머리가 자연스럽게 덮어준다</li><li><strong>직모거나 곱슬기가 약한 분</strong></li><li><strong>회사원 · 취업 준비생 · 공무원</strong> — 20~40대 전 연령</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>숱이 아주 많고 모발이 굵은데 이마가 좁은 분</strong> — 앞머리가 붕 떠서 헬멧처럼 된다. 차분한 느낌을 내기 어렵다</li><li><strong>곱슬이 심한 분</strong> — 앞머리가 말려 올라가 짧아 보인다. 볼륨매직이나 아이롱펌이 필요하다</li><li><strong>얼굴이 긴 분</strong> — 정수리 볼륨을 죽이고 앞머리를 더 내려야 균형이 맞는다</li><li><strong>얼굴이 아주 둥근 분</strong> — 앞머리를 매끈하게 내려주지 않으면 더 동그래 보일 수 있다</li><li><strong>옆머리가 뜨는 두상인 분</strong> — 다운펌 없이는 이삼 일 만에 무너진다</li></ul><h3>스타일링</h3><ol><li>머리를 감고 수건으로 잘 턴다</li><li>드라이어로 뿌리부터 앞에서 뒤 방향으로 말려 차분하게 만든다. 옆머리가 많이 뜨면 옆머리를 살짝 올려 눌러준다</li><li>고정하고 싶으면 소량의 매트 왁스를 골고루 편 뒤 스프레이로 고정한다. 왁스는 반드시 손에 완전히 편 뒤에 바르고, 젖은 머리에 바르거나 앞머리부터 바르지 않는다</li></ol><p><strong>제품</strong> 매트 왁스(고정력 중간) · 에센스(모발이 굵은 분은 무게를 주는 용도)</p><h3>유지·관리</h3><p>옆머리가 자라 귀를 덮기 시작하면 실루엣이 무너진다. 그때가 올 때다.</p><p>앞머리가 눈을 찌르기 시작하면 앞머리만 소폭 정리하는 것으로도 버텨볼 수 있다.</p>"}, {"id": "3d9a453d2b2981c7adf0ee976743c673", "n": "쉐도우펌", "p": {"검수": "초안", "계열": "클래식", "적합": ["직모", "굵은 모발", "각진 얼굴", "긴 얼굴"], "재방문 기간": "3개월 전후", "분류": "펌", "기장": "미디움", "비적합": ["숱 많음", "얼굴 큼"], "손질 난이도": "보통"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded"], "쓰는 시술": ["3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e", "3e5a453d2b2981acb102c624d765abf0", "3e5a453d2b2981f6a6b6cad366013e36"], "쓰는 제품": ["3f1a453d2b29810a9246efec4876fc83", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b2981da84d1d5a08a0ed0f6", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29816f9e35e77056dba514", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>파마 티는 안 나는데 결은 살아 있는 머리.</strong></p><p>머리 전체에 완만한 S자 웨이브가 흐른다. 컬을 세게 말지 않기 때문에 파마를 했다기보다 머릿결이 좋아진 쪽으로 읽힌다.</p><p>S자 곡선이 인상을 부드럽게 만들어주고 대부분의 얼굴형에 무리 없이 붙어, <strong>남자 펌 중 맞는 사람의 폭이 가장 넓은 축</strong>이다. 직모라 머리가 밋밋하고 힘없이 떨어지던 분일수록 달라지는 폭이 크다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>기본 쉐도우</td><td>머리 전체에 완만한 S컬을 넣는다</td><td>전 연령</td></tr><tr><td>쉐도우 + 다운펌</td><td>윗머리는 컬, 옆머리는 눌러서 간다</td><td>숱이 많은 분</td></tr><tr><td>볼륨 쉐도우</td><td>뿌리 볼륨을 강조한다</td><td>정수리가 납작한 분</td></tr><tr><td>소프트 쉐도우</td><td>컬을 아주 약하게 넣는다</td><td>자연스러운 쪽을 원하는 분</td></tr><tr><td>쉐도우 + 가르마</td><td>웨이브에 옆으로 넘어가는 흐름을 더한다</td><td>성숙한 인상을 원하는 분</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>직모라 머리가 밋밋하고 힘이 없는 분</strong> — 쉐도우펌이 가장 잘 맞는 경우다</li><li><strong>턱선이 강하고 각진 분</strong> — S자 곡선이 인상을 부드럽게 만든다</li><li><strong>얼굴이 긴 분</strong> — 웨이브가 가로로 볼륨을 만들어 길이를 덜 느껴지게 한다</li><li><strong>아침에 손질이 잘 안 되는 분</strong> — 컬이 조금만 있어도 손으로 만지는 것만으로 모양이 잡힌다</li><li>20~40대 전 연령</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>숱이 아주 많은 분</strong> — 컬이 들어가면 부피가 크게 늘어난다. 자르면서 숱을 먼저 덜어내고, 옆머리는 컬 대신 눌러서 가야 한다</li><li><strong>얼굴이 큰 분</strong> — 옆머리가 부풀면 더 커 보인다</li><li><strong>머리가 많이 상한 분</strong> — 컬이 잘 안 나오거나 부스스해진다</li><li><strong>머리가 짧은 분</strong> — 7cm가 안 되면 컬 자체가 나오지 않는다</li></ul><h3>스타일링</h3><ol><li>수건으로 물기를 턴 뒤 <strong>컬 크림이나 에센스를 먼저</strong> 바른다</li><li>손으로 움켜쥐듯 말리며 컬을 살린다</li><li>드라이어는 약한 바람으로 쓴다</li><li>완전히 말리지 말고 90% 정도 마른 상태에서 멈추면 컬이 더 산다</li><li>매트 왁스를 아주 조금만 써서 겉 결만 정리한다</li><li><strong>빗질은 하지 않는다</strong> — 컬이 풀린다</li></ol><p><strong>제품</strong> 컬 크림 · 에센스 · 매트 왁스 · 텍스처 스프레이</p><h3>유지·관리</h3><p>컬은 끝부터 먼저 풀린다. 그래서 끝만 정리하는 커트로 모양을 조금 더 끌고 갈 수 있다.</p><p>시술 직후에는 컬이 아직 자리를 잡는 중이라 바로 감으면 풀려버린다.</p><p>트리트먼트를 같이 하면 컬이 버티는 기간이 눈에 띄게 올라간다.</p>"}, {"id": "3d9a453d2b298157abfbeed0777c0aa7", "n": "스왈로펌", "p": {"검수": "초안", "계열": "트랜드", "적합": ["정수리 납작", "뒤통수 납작", "가는 모발", "직모"], "재방문 기간": "3개월", "분류": "펌", "기장": "미디움", "비적합": ["숱 많음", "긴 얼굴", "큰 두상"], "손질 난이도": "보통"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded"], "쓰는 시술": ["3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e", "3e5a453d2b2981f6a6b6cad366013e36"], "쓰는 제품": ["3f1a453d2b29810a9246efec4876fc83", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b2981da84d1d5a08a0ed0f6", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29816f9e35e77056dba514", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>눌린 정수리가 살아나는 머리.</strong></p><p>모발을 꼬아서 말기 때문에 컬이 뿌리부터 들어간다. 그래서 정수리가 눌리지 않고 위쪽이 떠 있는 상태로 유지된다.</p><p>일반 펌은 중간부터 컬이 들어가 뿌리는 여전히 눌려 있는데, 이 머리는 그 부분이 다르다. <strong>숱이 없어 보인다는 인상이 가장 확실하게 바뀌는 펌</strong>이고, 컬에 방향이 있어 머리 전체가 한 흐름으로 움직인다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>기본 스왈로펌</td><td>머리 전체에 회전 컬을 넣는다</td><td>정수리 볼륨이 부족한 분</td></tr><tr><td>탑 스왈로펌</td><td>정수리만 시술한다</td><td>부분만 하고 싶고 부담을 줄이고 싶은 분</td></tr><tr><td>스왈로 + 다운펌</td><td>위는 볼륨을 살리고 옆은 눌러서 간다</td><td>숱이 많은 분</td></tr><tr><td>소프트 스왈로</td><td>꼬는 강도를 약하게 한다</td><td>자연스러운 쪽을 원하는 분</td></tr><tr><td>열펌 스왈로</td><td>열로 형태를 고정한다</td><td>직모라 잘 안 잡히거나 강한 고정을 원하는 분</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>정수리가 납작하거나 볼륨이 없는 분</strong> — 스왈로펌이 가장 잘 맞는 경우다</li><li><strong>뒤통수가 납작한 분</strong> — 뒤쪽에 입체감이 생긴다</li><li><strong>모발이 가늘어 힘이 없는 분</strong> — 볼륨 효과가 가장 극적으로 나온다</li><li><strong>직모라 뿌리가 눌리는 분</strong></li><li>볼륨으로 인상을 살리고 싶은 30~40대</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>숱이 아주 많은 분</strong> — 볼륨이 과해진다. 자르면서 숱을 크게 덜어내고 시작해야 한다</li><li><strong>얼굴이 긴 분</strong> — 위쪽 볼륨이 더해져 더 길어 보인다</li><li><strong>머리가 큰 분</strong> — 볼륨 때문에 더 커 보인다</li><li><strong>머리가 많이 상한 분</strong> — 꼬면서 마는 방식이라 모발이 끊어질 수 있다</li><li><strong>컬이 티 나는 게 싫은 분</strong> — 일반 펌보다 컬 느낌이 강하다</li></ul><h3>스타일링</h3><ol><li>뿌리를 세우면서 아래에서 위로 드라이한다</li><li>손으로 움켜쥐듯 말리며 컬을 살린다</li><li>컬 크림이나 무스를 쓴다</li><li>매트 왁스를 아주 조금만 써서 겉 결만 정리한다</li><li><strong>빗질은 하지 않는다</strong></li></ol><p><strong>제품</strong> 컬 크림 · 무스 · 매트 왁스</p><h3>유지·관리</h3><p>뿌리 볼륨이 먼저 죽고 컬은 그다음까지 남는다. 머리가 자라면 새로 나온 뿌리에는 회전이 들어가 있지 않기 때문이다.</p><p>볼륨이 빠졌다고 전체를 다시 할 필요는 없고, 부분 리터치로 살릴 수 있다.</p><p>시술 직후에는 컬이 자리를 잡는 중이라 바로 감으면 안 되고, 트리트먼트를 같이 하면 컬이 버티는 기간이 올라간다.</p>"}, {"id": "3d9a453d2b2981fa9f97f0e831edbd7b", "n": "슬릭컷", "p": {"검수": "초안", "계열": "트랜드", "적합": ["둥근 얼굴", "직모", "굵은 모발", "숱 많음"], "재방문 기간": "4주", "분류": "커트", "기장": "미디움", "비적합": ["M자 이마", "넓은 이마", "숱 적음", "긴 얼굴", "강곱슬"], "손질 난이도": "보통"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded", "3fba453d2b29812cab4afb0f0ccc3931"], "쓰는 시술": ["3e5a453d2b29800bb541cc73573fe355", "3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e", "3e5a453d2b2981b58504d7b1fc30480b"], "쓰는 제품": ["3f1a453d2b29810a9246efec4876fc83", "3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b29813e96afdd83d89b2950", "3f1a453d2b298142a158e3793eb948a3", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29816f9e35e77056dba514", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>모발을 매끈하게 정돈해 뒤 또는 옆으로 넘기는 머리.</strong></p><p>핵심은 군더더기 없는 정돈감이다. 잔머리가 튀지 않고 흐름이 하나로 모여 있어 단정하고 신뢰감 있는 인상을 준다.</p><p>질감을 살리는 머리와는 정확히 반대편에 있다. 비즈니스·영업·행사 자리에서 강하고, 30~40대 남성에게 특히 잘 붙는다.</p><p>매일 포마드를 바르는 부담 없이 슬릭한 인상만 가져가고 싶을 때 최적의 선택이다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>백 슬릭</td><td>완전히 뒤로 넘긴다</td><td>격식 있는 자리·행사가 많은 분</td></tr><tr><td>사이드 슬릭</td><td>사선으로 넘긴다</td><td>비즈니스, 무난한 걸 원하는 분</td></tr><tr><td>매트 슬릭</td><td>광 없는 제품으로 마감한다</td><td>일상에서 자연스러운 게 좋은 분</td></tr><tr><td>웨트 슬릭</td><td>광택을 강하게 낸다</td><td>행사, 사진 촬영이 있는 분</td></tr><tr><td>슬릭 + 다운펌</td><td>옆머리를 눌러 밀착시킨다</td><td>숱이 많은 분</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>이마와 헤어라인이 깔끔한 분</strong> — 이마를 드러내는 게 전제다</li><li><strong>이목구비가 뚜렷하고 얼굴 윤곽이 선명한 분</strong></li><li><strong>얼굴이 둥글거나 짧은 분</strong> — 뒤로 흐르는 선이 세로로 이어져 갸름해 보인다</li><li><strong>신뢰감 있는 인상이 필요한 30~40대</strong></li><li><strong>모발이 굵고 힘 있는 직모인 분</strong> — 무게가 있어 넘김이 유지된다</li><li><strong>숱이 많은 분</strong> — 다른 머리에선 부담이지만 이 머리에선 무게가 장점이 된다</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>M자 이마 · 넓은 이마 · 헤어라인이 뒤로 물러난 분</strong> — 가장 치명적인 조합이라 권해드리지 않는다</li><li><strong>숱이 적은 분</strong> — 넘기면 두피가 훤히 보인다</li><li><strong>얼굴이 긴 분</strong> — 세로가 더 길어진다</li><li><strong>곱슬이 심한 분</strong> — 매끈하게 넘어가지 않는다. 매직이나 포마드펌으로 방향을 먼저 정리해야 한다</li><li><strong>모발이 심하게 상한 분</strong> — 잔머리가 튀어서 매끈한 느낌이 안 난다</li></ul><h3>스타일링</h3><ol><li>젖은 상태에서 뿌리를 <strong>앞쪽으로 먼저</strong> 말려 볼륨을 확보한다</li><li>뒤로 넘기면서 롤브러시나 빗으로 텐션을 준다</li><li>제품을 손바닥에서 완전히 녹인 뒤 뒤통수 → 정수리 → 앞머리 순으로 바른다</li><li>빗으로 결을 정리한다 (슬릭컷은 빗질이 필수인 드문 스타일이다)</li><li>스프레이로 고정한다</li><li>광 조절: 매트 왁스면 자연스럽고, 포마드면 격식 있다</li></ol><p><strong>제품</strong> 포마드 · 매트 왁스 · 스프레이 · 롤브러시</p><h3>유지·관리</h3><p>기장이 길어 자란 티가 천천히 난다. 대신 옆머리가 자라면 정돈감이 깨지므로 옆만 리터치하는 것도 유효하다.</p><p>제품을 매일 쓰면 두피에 잔여물이 쌓인다. 세정력 있는 샴푸로 두 번 감는다.</p><p>광택 제품은 베개와 옷깃에 묻으므로 자기 전에 씻어낸다.</p>"}, {"id": "3d9a453d2b29813595e2cdacd100c75f", "n": "가르마펌", "p": {"검수": "초안", "계열": "클래식", "적합": ["직모", "반곱슬", "굵은 모발", "둥근 얼굴", "얼굴 큼"], "재방문 기간": "3개월 전후", "분류": "펌", "기장": "미디움", "비적합": ["넓은 이마", "M자 이마", "숱 적음", "긴 얼굴", "가는 모발"], "손질 난이도": "보통"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded", "3fba453d2b2981e4b783cad65072b611"], "쓰는 시술": ["3e5a453d2b29806b9811e9ce804373ab", "3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e", "3e5a453d2b2981acb102c624d765abf0", "3e5a453d2b2981b58504d7b1fc30480b", "3e5a453d2b2981d0879ff1b388e7e034", "3e5a453d2b2981f6a6b6cad366013e36"], "쓰는 제품": ["3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b2981da84d1d5a08a0ed0f6", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29816f9e35e77056dba514", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>손으로 넘기기만 해도 가지런히 정돈되는 머리.</strong></p><p>컬을 만드는 펌이 아니라 넘어가는 방향과 볼륨을 만드는 펌이다. 그래서 파마한 티보다는 머리가 정돈돼 보이는 쪽으로 읽힌다.</p><p>이마의 일부가 드러나면서 옆으로 흐름이 생겨 <strong>성숙하고 단정한 인상</strong>이 된다. 아침에 손으로 넘기고 왁스만 발라도 그 방향으로 자리를 잡기 때문에, 매일 드라이해야 하던 부담이 없어진다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>기본 가르마펌</td><td>방향을 잡고 완만한 C컬을 넣는다</td><td>30~40대 직장인</td></tr><tr><td>볼륨 가르마펌</td><td>뿌리 볼륨을 강조한다</td><td>정수리가 납작한 분</td></tr><tr><td>소프트 가르마펌</td><td>가르마 선을 흐리게 간다</td><td>20~30대</td></tr><tr><td>가르마펌 + 다운펌</td><td>옆머리를 눌러서 같이 간다</td><td>숱이 많은 분</td></tr><tr><td>열펌 가르마</td><td>열로 강하게 고정한다</td><td>직모라 방향 유지가 어려운 분</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>직모라 넘긴 게 유지되지 않는 분</strong> — 가르마펌이 가장 잘 맞는 경우다</li><li><strong>얼굴이 크거나 둥근 분</strong> — 옆으로 흐르는 선이 생겨 갸름해 보인다</li><li><strong>매일 드라이할 시간이 없는 분</strong> — 자르기만 하면 매일 말려야 하는데 그 부담이 사라진다</li><li><strong>성숙하고 단정한 인상을 원하는 분</strong> — 30~50대 직장인·영업직에게 선호도가 높다</li><li>모발에 적당한 힘이 있는 직모~반곱슬</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>정수리 숱이 적은 분</strong> — 가르마를 타는 자리에서 두피가 드러난다. 가르마 위치를 옮겨서 완화할 수 있다</li><li><strong>이마가 아주 넓거나 M자인 분</strong> — 가르마가 시작되는 지점에서 이마가 강조된다. 앞머리를 완전히 넘기지 않고 살짝 걸치게 남기는 방법이 있다</li><li><strong>얼굴이 긴 분</strong> — 세로 흐름이 더해져 더 길어 보인다. 볼륨을 옆으로 줘야 한다</li><li><strong>모발이 아주 가는 분</strong> — 볼륨이 금방 죽어 넘김이 풀린다</li><li><strong>가마가 정중앙인 분</strong> — 방향을 고정하기가 어렵다</li><li><strong>머리가 많이 상한 분</strong> — 볼륨이 안 서고 늘어진다</li></ul><h3>스타일링</h3><ol><li>가르마를 <strong>반대 방향으로 먼저</strong> 말려 뿌리 볼륨을 확보한다</li><li>원하는 방향으로 넘기면서 건조한다</li><li>매트 왁스 또는 포마드를 바른다</li><li>뒤에서 앞으로 발라 올린 뒤 가르마 선만 손가락으로 정리한다</li><li>스프레이로 가르마 선을 고정한다</li></ol><p>펌 덕분에 드라이 시간은 자르기만 했을 때의 절반 이하다.</p><p><strong>제품</strong> 매트 왁스 · 포마드 · 스프레이</p><h3>유지·관리</h3><p>뿌리가 자라면 볼륨이 먼저 죽고 방향은 그다음에 풀린다. 방향을 만든 것이 뿌리기 때문이다.</p><p>그래서 전체를 다시 하지 않고 뿌리 볼륨만 살리는 부분 리터치로 연장할 수도 있다.</p><p>시술 직후에는 형태가 아직 자리를 잡는 중이라 바로 감으면 안 된다.</p>"}, {"id": "3d9a453d2b2981779c34c585fe4f6fc6", "n": "애즈펌", "p": {"검수": "초안", "계열": "트랜드", "적합": ["긴 얼굴", "각진 얼굴", "M자 이마", "넓은 이마", "직모", "가는 모발", "숱 적음"], "재방문 기간": "1.5~2개월", "분류": "펌", "기장": "미디움", "비적합": ["좁은 이마", "강곱슬", "숱 많음"], "손질 난이도": "보통"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded", "3fba453d2b2981e4b783cad65072b611"], "쓰는 시술": ["3e5a453d2b29806b9811e9ce804373ab", "3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e", "3e5a453d2b2981f6a6b6cad366013e36"], "쓰는 제품": ["3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b2981da84d1d5a08a0ed0f6", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29816f9e35e77056dba514", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>이마를 다 드러내지 않으면서 정돈되어 보이는 머리.</strong></p><p>앞머리가 이마를 손가락 한두 개 폭만 남기고 덮기 때문에 헤어라인이 그대로 노출되지 않는다. 컬이 얼굴 쪽으로 흐르면서 옆선이 얼굴을 감싸 정면에서 세로로 긴 느낌이 줄어든다. 손댄 티가 크게 나지 않아 회사에 하고 가도 부담이 적은 쪽이다.</p><p><strong>가르마펌과의 차이</strong> — 가르마펌은 이마를 갈라 넓게 드러내고 머리 끝이 얼굴 바깥으로 빠지지만, 애즈펌은 이마를 덮고 머리 끝이 얼굴 쪽으로 모인다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>시스루 애즈펌</td><td>앞머리 숱을 덜어 이마가 비쳐 보이게 한다</td><td>이마를 완전히 가리면 답답해 보이는 분</td></tr><tr><td>반가르마 애즈펌</td><td>한쪽만 가르마를 살짝 넣어 이마를 조금 연다</td><td>단정해 보여야 하는데 이마는 다 내놓기 싫은 분</td></tr><tr><td>볼륨 애즈펌</td><td>뿌리 쪽 볼륨을 더 세게 준다</td><td>정수리가 납작하거나 숱이 적은 분</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>얼굴이 긴 분</strong> — 앞머리가 이마를 덮어 세로 길이를 줄여준다</li><li><strong>이마가 넓거나 M자인 분</strong> — 그 라인을 앞머리가 가려준다</li><li><strong>턱선이 각진 분</strong> — 얼굴 옆으로 흐르는 머리가 각을 눌러준다</li><li><strong>머리카락이 곧게 뻗어 모양이 안 잡히는 분</strong> — 곡선이 생기면서 방향이 잡힌다</li><li><strong>숱이 적거나 머리카락이 가는 분</strong> — 앞쪽에 부피가 생겨 허전함이 덜하다</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>이마가 좁은 분</strong> — 앞머리까지 내려오면 더 답답해 보인다</li><li><strong>곱슬이 아주 심한 분</strong> — 원래 곱슬기와 섞여 방향이 흐트러진다</li><li><strong>숱이 아주 많은 분</strong> — 앞쪽이 무거워져 눌린다</li><li><strong>아침에 손이 안 가는 분</strong> — 말리는 방향을 잡아줘야 모양이 산다. 감고 그냥 두면 처진다</li></ul><h3>스타일링</h3><ol><li>수건으로 눌러 물기를 뺀다. 비비지 않는다</li><li>빗질하지 말고 손으로 털면서 70% 정도 말린다</li><li>손가락으로 앞머리 흐르는 방향을 잡고, 뿌리 쪽에 약한 따뜻한 바람을 잠깐 준다</li><li>바람을 멈추고 그대로 식힌다. 식는 동안 모양이 고정된다</li><li>컬 크림이나 에센스를 아주 소량 손에 편 뒤 끝쪽만 훑어 마무리한다</li></ol><p><strong>제품</strong> 컬 크림 · 에센스 · 텍스처 스프레이</p><h3>유지·관리</h3><p>머리 끝이 얼굴 쪽으로 모이는 모양이라 뿌리가 자라 방향이 틀어지면 바로 티가 난다. 남자 펌 중에서도 재시술 주기가 짧게 잡히는 이유다.</p><p>컬 자체가 굵은 편이 아니어서 감고 그냥 말리면 금방 처진다. 말릴 때 방향만 잡아줘도 눈에 띄게 오래 간다.</p>"}, {"id": "3d9a453d2b298179892fe94794324a6a", "n": "리프컷", "p": {"검수": "초안", "계열": "트랜드", "적합": ["M자 이마", "넓은 이마", "각진 얼굴", "가는 모발", "반곱슬"], "재방문 기간": "4~5주", "분류": "커트", "기장": "롱", "비적합": ["숱 많음", "굵은 모발", "직모", "강곱슬", "긴 얼굴"], "손질 난이도": "어려움"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded"], "쓰는 시술": ["3e5a453d2b2981388dfacbef18f6eec0", "3e5a453d2b29806b9811e9ce804373ab", "3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e"], "쓰는 제품": ["3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b2981da84d1d5a08a0ed0f6", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29816f9e35e77056dba514", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>부드러운 곡선으로 얼굴을 감싸는 머리.</strong></p><p>앞머리 끝이 이마 라인에서 좌우로 자연스럽게 갈라지며 떨어진다. 딱 잘라 가리는 게 아니라 양옆에서 감싸는 형태라, 여성스러워지지 않으면서 인상만 부드러워진다.</p><p>직선이 하나도 없는 머리다. 모든 윤곽이 곡선으로 흐른다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>클래식 리프</td><td>정수리 볼륨을 높게 준다</td><td>두상이 납작한 분</td></tr><tr><td>소프트 리프</td><td>볼륨은 낮고 흐름은 길게</td><td>트렌디하게 가고 싶은 20대</td></tr><tr><td>시스루 리프</td><td>앞머리 숱을 덜어낸다</td><td>얼굴이 큰 분</td></tr><tr><td>리프 + 언더컷</td><td>옆머리를 짧게 간다</td><td>숱이 많은 분</td></tr><tr><td>롱 리프</td><td>귀를 덮는 기장</td><td>캐주얼하게 가고 싶은 대학생</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>M자 이마 · 이마가 넓은 분</strong> — 좌우 앞머리가 자연스럽게 감싸준다</li><li><strong>얼굴이 각지거나 턱선이 강한 분</strong> — 곡선이 인상을 부드럽게 만든다</li><li><strong>모발이 보통이거나 약간 가는 분</strong> — 무게가 가벼워 곡선이 잘 나온다</li><li><strong>부드럽고 트렌디한 인상을 원하는 20~30대</strong></li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>숱이 아주 많고 모발이 굵은 분</strong> — 곡선이 아니라 헬멧이 된다. 속머리 숱을 많이 덜어내야 한다</li><li><strong>곱슬이 있는 분</strong> — 컬이 제멋대로 나와 흐름이 깨진다. 매직이나 앞머리펌으로 컬 방향을 맞춰야 한다</li><li><strong>얼굴이 아주 긴 분</strong> — 앞머리로 세로 길이를 줄여줘야 한다</li><li><strong>복장이 보수적인 직장에 다니는 분</strong> — 다소 캐주얼해 보일 수 있다</li><li><strong>직모인 분</strong> — 손으로 말아도 사흘이면 원래대로 돌아간다. 앞머리펌을 권해드린다</li></ul><h3>스타일링</h3><ol><li>물기를 없앤 뒤 앞머리를 좌우로 갈라 방향을 잡고 뿌리를 말린다</li><li>손가락으로 앞머리를 비틀듯 말아 곡선을 만든다. 뜨거운 바람으로 곡선을 만들고 찬바람으로 굳히는 습관을 들인다</li><li><strong>에센스나 크림 왁스를 먼저</strong> 발라 결을 정리한다 — 이 머리는 부드러운 질감이 생명이다</li><li>그 위에 소량의 매트 왁스로 끝 갈래만 강조한다</li><li>컬을 유지해야 하면 가벼운 스프레이를 쓴다</li></ol><p><strong>제품</strong> 크림 왁스 · 헤어 에센스 · 소프트 매트 왁스 · 컬 크림(펌 시) · 컬 에센스</p><h3>유지·관리</h3><p>기장이 길어 여유가 있는 편이다. 앞머리만 따로 정리해주면 형태가 훨씬 오래 간다.</p><p>모발이 손상되면 흐름이 안 나오므로 트리트먼트를 같이 하는 게 좋고, 앞머리펌을 얹으면 손질 시간이 크게 줄고 형태도 오래 유지된다.</p>"}, {"id": "3d9a453d2b2981d1bb21f9d7f6da805b", "n": "울프컷", "p": {"검수": "초안", "계열": "트랜드", "적합": ["계란형", "긴 얼굴", "역삼각형", "직모", "굵은 모발", "숱 많음"], "재방문 기간": "6~8주 (앞머리는 3~4주)", "분류": "커트", "기장": "롱", "비적합": ["둥근 얼굴", "가는 모발", "강곱슬"], "손질 난이도": "보통"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded"], "쓰는 시술": ["3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e"], "쓰는 제품": ["3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29816f9e35e77056dba514", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>정리된 머리가 아니라, 일부러 흐트러뜨린 머리로 읽힌다.</strong></p><p>앞머리는 이마를 덮고 내려오는데 뒷머리는 목까지 떨어진다. 위아래 길이 차이가 그대로 드러나서 얌전한 인상은 나오지 않는다.</p><p>끝을 일자로 맞추지 않고 들쭉날쭉하게 남기기 때문에, 가만히 둬도 방금 손으로 털어놓은 것처럼 보인다. 단정함보다 분위기를 사는 머리다.</p><p>뒷머리가 목을 덮으면서 얼굴은 작아 보이고 목은 길어 보이는 효과도 따라온다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>투블럭형 울프컷</td><td>옆머리를 짧게 쳐내고 뒷머리 끝에만 길이를 남긴다. 위아래 대비가 가장 뚜렷하다</td><td>옆이 잘 뜨는 분, 인상을 세게 가고 싶은 분</td></tr><tr><td>장발형 울프컷</td><td>옆머리도 함께 길러 전체가 긴 상태에서 층만 낸다</td><td>이미 기장이 있는 분, 부드럽게 가고 싶은 분</td></tr><tr><td>멀릿</td><td>앞뒤 길이 차이를 더 극단적으로 벌린다. 울프컷은 원래 이 대비를 줄인 쪽이다</td><td>대비를 더 세게 가고 싶은 분</td></tr><tr><td>펌 병행 울프컷</td><td>층 위에 컬을 얹는다. 매일 손질하지 않아도 형태가 남는다</td><td>아침에 시간을 못 쓰는 분</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>머리카락이 굵고 곧게 뻗는 분</strong> — 이 머리는 잘린 끝이 눈에 보여야 살아난다. 굵은 직모가 그걸 가장 잘 보여준다</li><li><strong>숱이 많은 분</strong> — 많이 덜어내야 모양이 잡히는 머리라서, 덜어낼 숱이 있어야 한다</li><li><strong>얼굴이 긴 분</strong> — 정수리 쪽에 볼륨이 생겨 가로 폭이 넓어 보인다</li><li><strong>위쪽이 넓고 아래로 갈수록 좁아지는 얼굴</strong> — 얼굴 옆으로 내려오는 머리가 그 폭을 가려준다</li><li><strong>목이 짧아 보이는 분</strong> — 뒷머리가 목을 덮으면서 목선이 길어 보인다</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>얼굴이 둥근 분</strong> — 정수리에 볼륨이 더 생기면 얼굴이 더 동그랗게 보일 수 있다. 볼륨 위치를 따로 잡아야 한다</li><li><strong>머리카락이 가는 분</strong> — 덜어내면 끝이 힘없이 내려앉아서 이 머리의 특징이 사라진다</li><li><strong>곱슬이 아주 심한 분</strong> — 잘라놓은 자리가 말려 올라가서 의도한 길이가 안 나온다</li><li><strong>손질에 시간을 못 쓰는 분</strong> — 자고 일어난 모양 그대로는 안 된다. 제품을 한 번은 발라야 한다</li></ul><h3>스타일링</h3><ol><li>감은 뒤 수건으로 물기를 눌러 뺀다. 완전히 말리지 않는다</li><li>젖은 상태에서 텍스처 스프레이를 전체에 뿌리고, 손으로 아래에서 위로 쥐었다 놓는다</li><li>자연히 마르게 두거나, 바람을 약하게 해서 아래에서 위로 말린다</li><li>정수리 볼륨을 더 주고 싶으면 롤브러시로 그 부분만 위로 말아 올린다</li><li>마지막에 손가락으로 끝을 몇 가닥씩 갈라준다. <strong>빗으로 빗지 않는다</strong> — 빗으면 하나로 붙어버린다</li></ol><p><strong>제품</strong> 텍스처 스프레이 · 에센스 · 스프레이</p><h3>유지·관리</h3><p>층을 정확한 위치에 넣어 만든 머리다. 그 위치가 조금만 내려와도 모양이 무너진다. 다른 커트보다 자란 티가 빨리, 그리고 눈에 띄게 난다.</p><p>앞머리는 전체 커트보다 더 자주 봐야 한다. 앞머리 길이가 이 머리의 인상을 거의 다 결정하기 때문이다.</p><p>집에서는 빗질을 피한다. 손가락으로 푸는 게 이 머리의 질감을 유지하는 방법이다.</p>"}, {"id": "3d9a453d2b2981cda817e9986ec12b79", "n": "빈티지펌", "p": {"검수": "초안", "계열": "트랜드", "적합": ["긴 얼굴", "직모", "굵은 모발", "반곱슬", "숱 적음"], "재방문 기간": "2~3개월", "분류": "펌", "기장": "미디움", "비적합": ["둥근 얼굴", "얼굴 큼", "가는 모발", "강곱슬", "숱 많음"], "손질 난이도": "쉬움"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded"], "쓰는 시술": ["3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e", "3e5a453d2b2981f6a6b6cad366013e36"], "쓰는 제품": ["3f1a453d2b29810a9246efec4876fc83", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29816f9e35e77056dba514", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>정리 안 한 것처럼 보이는데 분위기는 있는 머리.</strong></p><p>굵은 컬이 불규칙하게 들어가서 방향이 딱 떨어지지 않고 제각각 흐른다. 그 흐트러짐 자체가 이 스타일의 인상이라, 아침에 매만져 모양을 만드는 게 아니라 제품 바르고 털어 말리는 것으로 끝난다. 단정함보다는 여유롭고 조금 낡은 듯한 느낌 쪽이다.</p><p><strong>히피펌과의 차이</strong> — 히피펌은 작은 컬을 뿌리부터 촘촘하게 넣어 컬 자체를 보여주지만, 빈티지펌은 굵은 컬을 듬성듬성 넣어 컬보다 질감과 흐름을 보여준다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>장발 빈티지펌</td><td>기장을 어깨 쪽까지 가져가 컬이 길게 늘어진다</td><td>머리를 기르는 중이고 확실히 티를 내고 싶은 분</td></tr><tr><td>숏 빈티지펌</td><td>귀가 보이는 짧은 기장에 컬만 얹는다</td><td>짧은 머리를 유지하면서 심심한 건 싫은 분</td></tr><tr><td>울프컷 빈티지펌</td><td>층을 크게 낸 커트에 컬을 얹어 형태를 만든다</td><td>샤프한 윤곽을 같이 가져가고 싶은 분</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>얼굴이 긴 분</strong> — 옆으로 퍼지는 부피가 세로 길이를 잡아준다</li><li><strong>머리카락이 곧고 굵은 분</strong> — 컬이 힘 있게 떨어져 모양이 오래 간다</li><li><strong>원래 곱슬기가 약간 있는 분</strong> — 넣은 컬과 자연스럽게 섞인다</li><li><strong>숱이 적은 분</strong> — 굵은 컬이 부피를 만들어준다</li><li><strong>아침에 손이 안 가는 분</strong> — 감고 제품 바르고 털어 말리면 끝난다</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>얼굴이 둥글거나 폭이 넓은 분</strong> — 얼굴 옆에 부피가 붙어 더 넓어 보인다</li><li><strong>얼굴이 큰 분</strong> — 같은 이유로 윤곽이 커 보인다</li><li><strong>머리카락이 가늘고 힘이 없는 분</strong> — 컬이 떨어지지 않고 부스스하게 뜬다</li><li><strong>곱슬이 심한 분</strong> — 원래 곱슬기와 겹쳐 정리가 안 된다</li><li><strong>숱이 아주 많은 분</strong> — 전체가 부풀어 덩어리처럼 보인다</li></ul><h3>스타일링</h3><ol><li>수건으로 눌러 물기를 뺀다. 비비면 컬이 흐트러진다</li><li>젖어 있는 상태에서 컬 크림을 손바닥에 얇게 펴 바른다</li><li>손으로 머리를 움켜쥐듯 쥐었다 놓으며 컬을 모은다</li><li>빗질하지 말고 위에서 아래로 툭툭 털며 약한 바람으로 말린다</li><li>다 마르면 끝쪽에만 에센스를 소량 더해 마무리한다</li></ol><p><strong>제품</strong> 컬 크림 · 에센스 · 무스</p><h3>유지·관리</h3><p>롯드에 말아 만드는 일반펌으로 들어가는 경우가 많아, 열로 고정하는 펌보다 컬이 먼저 처진다. 히피펌보다 재시술 주기가 짧게 잡히는 이유다.</p><p>다만 원래 흐트러진 모양이라 조금 풀려도 망가져 보이지 않는다. 풀린 상태가 그대로 다음 스타일이 되는 편이다.</p><p>물기가 있을 때 컬이 살아나는 구조라, 마른 상태에서 만지는 것보다 감고 말릴 때 잡아주는 쪽이 낫다.</p>"}, {"id": "3d9a453d2b298169b11ac764045624de", "n": "히피펌", "p": {"검수": "초안", "계열": "트랜드", "적합": ["가는 모발", "숱 적음", "반곱슬"], "재방문 기간": "4개월 전후", "분류": "펌", "기장": "롱", "비적합": ["숱 많음", "얼굴 큼"], "손질 난이도": "어려움"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded"], "쓰는 시술": ["3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e", "3e5a453d2b2981f6a6b6cad366013e36"], "쓰는 제품": ["3f1a453d2b29810a9246efec4876fc83", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b2981da84d1d5a08a0ed0f6", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29816f9e35e77056dba514", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>컬 자체를 스타일로 내세우는 머리.</strong></p><p>머리 전체에 작고 촘촘한 컬을 넣어 자연 곱슬머리처럼 보이게 만든다. 파마한 티를 숨기지 않기 때문에 인상이 확실하게 달라진다.</p><p>볼륨이 크고 개성이 강해 호불호가 뚜렷하지만, 잘 어울리면 스타일 완성도가 매우 높다. 기장이 어느 정도 있는 머리와 조합이 특히 좋다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>클래식 히피펌</td><td>머리 전체에 작고 촘촘한 컬을 넣는다</td><td>개성을 확실히 내고 싶은 20대</td></tr><tr><td>소프트 히피펌</td><td>로드를 크게 해서 컬을 약하게 넣는다</td><td>처음 해보거나 부담을 줄이고 싶은 분</td></tr><tr><td>부분 히피펌</td><td>윗머리와 끝에만 넣는다</td><td>자연스러운 쪽을 원하는 분</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>모발이 가늘고 숱이 적은 분</strong> — 컬로 부피가 늘어 풍성해 보인다</li><li><strong>얼굴이 작은 분</strong></li><li><strong>이목구비가 뚜렷한 분</strong></li><li><strong>원래 머리에 곱슬기가 있는 분</strong> — 자연 컬과 어우러져 가장 자연스럽게 나온다</li><li>개성 있는 스타일을 원하는 20대, 복장이 자유로운 직업</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>숱이 아주 많은 분</strong> — 부피가 폭발한다. 자르면서 숱을 절반 가까이 덜어내는 게 전제다</li><li><strong>얼굴이 큰 분</strong> — 옆머리 볼륨으로 더 커 보인다</li><li><strong>회사가 보수적인 분</strong> — 파마한 티가 확실히 난다</li><li><strong>머리가 많이 상한 분</strong> — 작은 로드는 부담이 커서 모발이 끊어질 수 있다</li><li><strong>관리가 귀찮은 분</strong> — 컬 제품과 말리는 방법을 지켜야 모양이 유지된다</li></ul><h3>스타일링</h3><ol><li>수건으로 <strong>누르듯</strong> 물기를 뺀다 (비비면 컬이 풀리고 부스스해진다)</li><li><strong>젖은 상태에서</strong> 컬 크림이나 무스를 충분히 바른다</li><li>손으로 움켜쥐듯 말린다</li><li>약한 바람으로 말리거나 열 없이 자연 방치로 말린다</li><li>완전히 마른 뒤에는 만지지 않는다</li><li><strong>빗질은 절대 하지 않는다</strong></li></ol><p><strong>제품</strong> 컬 크림 · 무스 · 에센스</p><h3>유지·관리</h3><p>컬이 작을수록 오래 간다. 대신 제품을 안 바르면 금방 부스스해져서 컬 제품이 사실상 필수다.</p><p>자고 일어나면 컬이 눌리는데, 물을 뿌리면 다시 살아난다.</p><p>손상이 큰 시술이라 트리트먼트를 같이 하는 게 좋고, 시술 직후에는 컬이 자리를 잡는 중이라 바로 감으면 안 된다.</p>"}, {"id": "3d9a453d2b2981eaacbbef7918b92bc4", "n": "남자 장발", "p": {"검수": "초안", "계열": "클래식", "적합": ["M자 이마", "얼굴 큼", "반곱슬"], "재방문 기간": "기르는 중에도 끝 정리는 계속 (주기 미확인)", "분류": "커트", "기장": "롱", "비적합": ["숱 적음", "탈모 초기", "굵은 모발"], "손질 난이도": "어려움"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded", "3fba453d2b2981e4b783cad65072b611"], "쓰는 시술": ["3e5a453d2b29815aaa25de269962a848", "3e5a453d2b298171b563db13b2911d9e"], "쓰는 제품": ["3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29816f9e35e77056dba514", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b29811e95c7c17e9352e7b7"]}, "h": "<h3>어떤 느낌을 추구하는가</h3><p><strong>머리 모양보다 분위기가 먼저 보이는 머리다.</strong></p><p>귀와 목을 덮고 내려오는 동안 얼굴 옆을 따라 머리가 흐르면서 윤곽이 부드러워진다. 짧은 머리가 주는 단정함 대신 느슨하고 중성적인 인상이 남는다.</p><p>손질을 했는지 안 했는지는 겉으로 잘 드러나지 않는다. 대신 머릿결이 그대로 보인다 — 이 머리는 모양보다 상태로 평가받는다.</p><h3>변형</h3><div class=\"tw\"><table><thead><tr><th>변형</th><th>어떻게 다른가</th><th>이런 분께</th></tr></thead><tbody><tr><td>귀 덮는 기장</td><td>옆머리가 귀를 덮고 뒷머리가 목선에 닿는다. 아직 넘길 수는 없다</td><td>장발을 막 시작한 분. 리프컷·울프컷으로 모양을 잡으면 기르는 중인 티가 덜 난다</td></tr><tr><td>목 덮는 기장</td><td>앞머리는 광대까지 내려오는데 귀 뒤로는 안 넘어간다. 가장 어색한 구간이다</td><td>여기서 펌을 넣거나 앞머리만 정리해서 넘기는 분</td></tr><tr><td>턱선 기장</td><td>얼굴 옆으로 머리가 떨어진다. 넘기거나 내리거나 고를 수 있다</td><td>레이어드컷·허쉬컷으로 디자인을 넣기 시작하는 분</td></tr><tr><td>어깨 기장</td><td>묶을 수 있다. 여기서부터는 기르는 게 아니라 유지하는 단계다</td><td>완성 기장을 목표로 하는 분</td></tr></tbody></table></div><h3>어울리는 사람 / 안 어울리는 사람</h3><p><strong>잘 어울립니다</strong></p><ul><li><strong>이마 양쪽 끝이 파여 들어간 분</strong> — 옆에서 내려온 머리가 그 부분을 자연스럽게 가린다</li><li><strong>얼굴이 커 보이는 게 고민인 분</strong> — 얼굴 옆을 머리가 감싸면서 윤곽이 줄어 보인다</li><li><strong>살짝 곱슬기가 있는 분</strong> — 기르는 동안 축 처지지 않고, 어색한 구간을 펌 없이도 넘기기 쉽다</li><li><strong>한 미용실에 꾸준히 다니는 분</strong> — 기르는 내내 같은 방향으로 다듬어야 하는 머리다</li></ul><p><strong>주의가 필요합니다</strong></p><ul><li><strong>정수리 쪽 숱이 부족한 분</strong> — 옆과 뒤가 길어질수록 정수리가 비어 보인다. 이 경우엔 권하지 않는다</li><li><strong>머리가 빠지기 시작한 분</strong> — 긴 머리는 두피를 씻고 말리기가 어려워져 상태가 더 나빠질 수 있다</li><li><strong>머리카락이 굵고 억센 분</strong> — 옆머리가 눕지 않고 벌어진다. 다운펌을 같이 해야 한다</li><li><strong>손질에 시간을 못 쓰는 분</strong> — 기르는 기간도 길지만, 완성한 뒤에도 매일 말리고 발라야 한다</li></ul><h3>스타일링</h3><ol><li>수건으로 두피를 눌러 물기를 뺀다. 비비지 않고, 수건으로 오래 감싸두지 않는다</li><li>뒤통수부터 말린다. 뿌리를 손가락으로 세워가며 말려야 정수리가 눌리지 않는다</li><li>앞머리는 물기가 남아 있을 때 뒤로 넘기는 방향으로 말린다. 그래야 그 방향으로 눕는다</li><li>바람은 미지근하거나 찬 바람으로 한다. 긴 머리에서는 뜨거운 바람의 손상이 바로 보인다</li><li>완전히 마르기 전에 에센스를 끝 쪽 위주로 바른다. 두피 쪽에는 바르지 않는다</li><li>곱슬기를 살릴 거면 젖은 상태에서 컬 크림이나 무스를 쥐어 바른 뒤 자연히 말린다</li></ol><p><strong>제품</strong> 에센스 · 컬 크림 · 무스 · 헤어토닉</p><h3>유지·관리</h3><p><strong>이 머리의 관건은 완성이 아니라 중간이다.</strong> 앞머리가 광대까지 내려왔는데 귀 뒤로는 안 넘어가는 구간이 반드시 온다. 대부분 여기서 포기하고 잘라버린다.</p><p>넘기는 방법은 세 가지다. 첫째, 뒷머리를 먼저 정리해서 위쪽이 아래를 덮게 만든다 — 그래야 뒤만 삐죽 긴 모양이 안 나온다. 둘째, 앞머리 숱만 가볍게 덜어 움직임을 준다. 셋째, 이 구간에서만 펌을 넣는다. 처지는 모발에 볼륨이 생기면서 어색한 길이가 의도한 모양으로 읽힌다.</p><p>기르는 중에도 커트를 멈추지 않는다. 안 자르는 게 아니라 끝 갈라짐만 정리하는 것이다. 그리고 미용실을 바꾸지 않는다 — 기르는 방향을 매번 다시 설명해야 하면 과정이 길어진다.</p><p>두피는 짧은 머리일 때보다 더 신경 써야 한다. 머리에 가려 잘 마르지 않고, 안 마른 채로 두면 두피가 먼저 상한다.</p>"}], "T": [{"id": "3e5a453d2b2981acb102c624d765abf0", "n": "다운펌", "p": {"검수": "검수 완료", "분류": "펌", "비적합": ["숱 적음"], "손상도": "보통", "시술 시간": "20~50분 (부위별)", "유지 기간": "6~10주 (새로 자란 뿌리가 뜨기까지)", "재방문 기간": "8주 전후", "적합": ["옆머리 뜸", "역삼각형", "큰 두상", "콘헤드", "숱 많음", "굵은 모발"], "시술명": "다운펌"}, "r": {"쓰는 스타일": ["3d9a453d2b29812f9255d09fdce26f23", "3d9a453d2b29811f85b7e06a7efc9b30", "3d9a453d2b2981c79bbde3132f2f3b92", "3d9a453d2b2981c6bc74e69273772aae", "3d7a453d2b2981af9728ee0ab8d6c934", "3d9a453d2b2981c7adf0ee976743c673", "3d9a453d2b29813595e2cdacd100c75f"]}, "h": "<h3>뭘 해결하는 시술인가</h3><ul><li>뜨는 머리를 눌러 차분하게 만든다. 컬을 넣는 펌이 아니다.</li><li>모발을 꺾어서 차분하게 만드는 것이지, 머리가 자라는 방향을 바꾸는 게 아니다.</li><li>옆머리 · 앞머리 · 정수리 · 뒷머리 · 전체로 나눠 할 수 있다. 옆머리가 가장 흔하다.</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><p><strong>적합</strong></p><ul><li><span class=\"tg\">옆머리 뜸</span> — 다운펌의 본래 목적</li><li><span class=\"tg\">역삼각형</span> — 옆보다 그 위가 더 뜰 가능성이 높아 거의 필수. 확실하게 눌러준다</li><li><span class=\"tg\">큰 두상</span> — 전체 다운펌으로 무조건 차분하게</li><li><span class=\"tg\">콘헤드</span> — 정수리를 눌러준다. 안 누르면 길어 보인다</li><li><span class=\"tg\">숱 많음</span> · <span class=\"tg\">굵은 모발</span> 머리를 크게 만들기 좋은 구성이다. 눌러줘서 차분하게 해주는 것이 좋다.</li></ul><p><strong>비적합</strong></p><h3>시술 후 관리</h3><ul><li>다운펌은 풀리지 않는다. 풀렸다면 잘못 누른 것이다. 시간이 지나 뜨는 건 새로 자란 뿌리가 뜨는 것이다</li><li>그래서 뿌리가 자라면 다시 한다. 뿌리가 자랄수록 효과가 눈에 띄게 준다</li><li>머리 감을때, 수건으로 닦을 때, 머리 말릴때 다 위에서 아래 방향으로 해준다. 옆으로도 괜찮으나 위로 꺾는건 피해야한다.</li></ul>"}, {"id": "3e5a453d2b2981388dfacbef18f6eec0", "n": "앞머리펌(컬)", "p": {"검수": "검수 완료", "분류": "펌", "비적합": ["반곱슬", "강곱슬", "앞머리가 앞으로 쏟아짐"], "손상도": "낮음", "시술 시간": "15~40분 (목적별)", "유지 기간": "1.5~3개월", "재방문 기간": "2개월 전후", "적합": ["앞머리에 가마 있음"], "시술명": "앞머리펌(컬)"}, "r": {"쓰는 스타일": ["3d9a453d2b298179892fe94794324a6a", "3d9a453d2b29817195d6f35744c8c8d0", "3d9a453d2b29816da0aff35e0393c2f7"]}, "h": "<h3>뭘 해결하는 시술인가</h3><ul><li>앞머리에 <strong>롯드를 말아</strong> 컬을 넣는 부분 펌</li><li>앞머리를 안쪽으로 말아 얼굴을 감싸는 <strong>C컬</strong>을 만든다. 리프컷 계열에 쓴다</li><li>앞머리에만 하니 시간·비용·손상이 모두 작다. 펌을 처음 해보는 사람이 시작하기 좋다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><p><strong>적합</strong> — <span class=\"tg\">앞머리에 가마 있음</span></p><p>앞머리에 가마가 있으면 내리는 스타일을 하기 어렵다. 넘기는 머리를 하는게 맞는데 만약 직모라면 컬을 넣어 넘겨주기 좋다.</p><p><strong>비적합</strong> — <span class=\"tg\">반곱슬</span> · <span class=\"tg\">강곱슬</span> · 앞머리가 앞으로 쏟아짐</p><p>반곱슬은 이미 휘어져 있다 굳이 컬을 더 넣으면 머리가 오히려 뻗칠 뿐이다.</p><p>강곱슬은 매직으로 펴야지 컬을 넣을것이 아니다 컬을 넣으면 오히려 지저분하게 부스스 해진다.</p><p>앞머리가 앞으로 쏟아지는 머리는 컬을 넣으면 머리가 이마에 붙으면서 컬이 들어간다. 그래서 되게 없어보일 수 있다.</p><h3>시술 후 관리</h3><ul><li>펌이 자리 잡는 데 <strong>일주일</strong> 정도 걸린다. 그동안 샴푸는 최소로, 모자는 피한다</li><li>뜨거운 바람은 컬을 늘어지게 한다</li></ul>"}, {"id": "3e5a453d2b29806b9811e9ce804373ab", "n": "앞머리펌(모류교정)", "p": {"검수": "검수 완료", "분류": "펌", "비적합": ["앞머리에 가마 있음"], "손상도": "보통", "시술 시간": "20분", "유지 기간": "2~3주", "재방문 기간": "1달", "적합": ["앞머리 모류 오른쪽", "앞머리가 앞으로 쏟아짐", "굵은 모발", "직모"], "시술명": "앞머리펌(모류교정)"}, "r": {"쓰는 스타일": ["3d9a453d2b29813595e2cdacd100c75f", "3d9a453d2b298179892fe94794324a6a", "3d9a453d2b2981779c34c585fe4f6fc6", "3d9a453d2b29811f85b7e06a7efc9b30", "3d9a453d2b29817bb873ec64bfde21e7", "3d9a453d2b29812f9255d09fdce26f23", "3d9a453d2b2981f98da5dabb4369df5d", "3d9a453d2b29817195d6f35744c8c8d0", "3d9a453d2b29816da0aff35e0393c2f7"]}, "h": "<h3>뭘 해결하는 시술인가</h3><ul><li><strong>펌제로 앞머리 모류를 교정</strong>하는 시술. 앞머리가 자라는 방향 때문에 원하는 쪽으로 안 넘어가거나 앞으로 쏟아질 때 한다</li><li>모류는 뒤나 옆은 기장으로 덮이지만 앞머리는 그대로 드러난다. 그래서 앞머리가 문제다</li><li>다만 <strong>오래가는 방법은 아니다.</strong> 그래서 크게 추천하진 않는다. 모류를 이용한 헤어스타일을 추천하는 게 제일 현명하다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><p><strong>적합</strong></p><ul><li><span class=\"tg\">앞머리가 앞으로 쏟아짐</span> — 넘기는 스타일이면 처음부터 뒤로 넘기며 말리거나, 펌제로 좀 넘겨주는 게 좋다</li><li><span class=\"tg\">앞머리 모류 오른쪽</span> — 한쪽을 향한다면 높은 확률로 오른쪽이다 눌러서 반대 방향으로 향하게 해준다.</li><li><span class=\"tg\">굵은 모발</span> · <span class=\"tg\">직모</span>  - 굵거나 직모면 드라이할때 머리가 말을 잘 안듣기 때문에 펌제로 방향을 틀어주는 것이 좋다</li></ul><p><strong>비적합</strong></p><ul><li><span class=\"tg\">앞머리에 가마 있음</span> — 억지로 가마를 가려가며 모류를 고정해봐야 1~2주 지나면 관리가 힘들어진다. 가마는 이용하는것이 더 좋다.</li></ul><h3>시술 후 관리</h3><ul><li>오래가지 않는다. 주기적으로 다시 해야 유지된다</li><li>드라이할 때 원하는 방향으로 먼저 넘기며 말린다.</li></ul>"}, {"id": "3e5a453d2b29800bb541cc73573fe355", "n": "앞머리펌(매직)", "p": {"검수": "검수 완료", "분류": "펌", "비적합": ["직모", "손상모"], "손상도": "보통", "시술 시간": "30~40분", "유지 기간": "2~3달", "재방문 기간": "2~3달", "적합": ["강곱슬"], "시술명": "앞머리펌(매직)"}, "r": {"쓰는 스타일": ["3d9a453d2b2981fa9f97f0e831edbd7b", "3d9a453d2b29812f9255d09fdce26f23", "3d9a453d2b29811f85b7e06a7efc9b30", "3d7a453d2b2981af9728ee0ab8d6c934", "3d9a453d2b2981c79bbde3132f2f3b92"]}, "h": "<h3>뭘 해결하는 시술인가</h3><ul><li><strong>앞머리만 매직</strong>하는 부분 시술. 곱슬 앞머리를 곧게 편다</li><li>앞머리가 곱슬이면 짧아지고. 커트 모양도 안 나온다</li><li>매직 중 가장 부담이 적다. 남자의 핵심인 앞머리를 해결해주는 매직이다.</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><p><strong>적합</strong> — <span class=\"tg\">강곱슬</span></p><ul><li>곱슬이 강하면 매직이 답이다. 곱슬을 살려서 컬감있게 하기엔 무리가 있다.</li></ul><p><strong>비적합</strong> — <span class=\"tg\">직모</span> — 펼 곱슬이 없다. 돈낭비</p><h3>시술 후 관리</h3><ul><li>일주일 정도는 자리 잡는 시간이다. 묶거나 집게로 고정하면 자국이 남는다.</li><li>매직 자체가 머리를 많이 상하게 하는 편이다. 앞머리가 상하지않게 과한 열을 주는 드라이는 피한다.</li></ul>"}, {"id": "3e5a453d2b2981d0879ff1b388e7e034", "n": "아이롱펌", "p": {"검수": "검수 완료", "분류": "펌", "비적합": ["손상모"], "손상도": "높음", "시술 시간": "2~3시간", "유지 기간": "3~6개월", "재방문 기간": "4~6개월", "적합": ["강곱슬"], "시술명": "아이롱펌"}, "r": {"쓰는 스타일": ["3d7a453d2b2981af9728ee0ab8d6c934", "3d9a453d2b29813595e2cdacd100c75f", "3d9a453d2b29816da0aff35e0393c2f7", "3d9a453d2b2981c6bc74e69273772aae"]}, "h": "<h3>뭘 해결하는 시술인가</h3><ul><li>약으로 결합을 끊은 뒤 <strong>기계로 열처리해서</strong> 모양을 잡는 열펌.</li><li>일반펌은 롯드에 말아서 모양을 잡고, 열펌은 기계로 열처리해서 잡는다. 둘을 가르는 건 이 차이다</li><li>굵고 뻣뻣한 직모도 컬이 확실히 들어가고 오래 간다. 대신 손상이 크고 오래 걸린다</li><li>방향·볼륨이 중요한 스타일에 주로 쓴다 — 가르마. 시스루댄디</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><p><strong>적합</strong></p><ul><li><span class=\"tg\">강곱슬</span> — 곱슬기 때문에 일반 롯드로 말면 부스스하고 컬이 예쁘게 안나온다. 아이롱펌으로 결을 정리하며 윤기나게 하면서 컬을 넣는게 좋다.</li></ul><p><strong>비적합</strong></p><ul><li>탈색모 - 탈색모는 연화를 보면 안된다.</li></ul><p><strong>비적합까진 아니고 조절</strong></p><ul><li><span class=\"tg\">가는 모발</span> — 열에 쉽게 상한다. 낮은 온도로 짧게</li><li>손상모 — 열이 더해지면 끊어질 수 있다. 가장 위험한 조합</li></ul><h3>시술 후 관리</h3><ul><li>트리트먼트를 안 하면 끝이 부스스해질 수 있다.</li><li>고데기 같은 열 도구를 더 쓰는 건 자제한다 — 손상이 쌓인다</li><li>펌이 자리 잡는 데 일주일 정도 걸린다. 그동안 샴푸는 최소로한다.</li></ul>"}, {"id": "3e5a453d2b2981f6a6b6cad366013e36", "n": "일반펌", "p": {"검수": "검수 완료", "분류": "펌", "비적합": ["둥근 얼굴", "탈모 초기"], "손상도": "보통", "시술 시간": "1시간 30분~2시간 20분", "유지 기간": "2~4개월", "재방문 기간": "3개월 전후", "적합": ["직모", "각진 얼굴"], "시술명": "일반펌"}, "r": {"쓰는 스타일": ["3d9a453d2b2981c7adf0ee976743c673", "3d9a453d2b29813595e2cdacd100c75f", "3d9a453d2b298157abfbeed0777c0aa7", "3d9a453d2b2981779c34c585fe4f6fc6", "3d9a453d2b298169b11ac764045624de", "3d9a453d2b2981cda817e9986ec12b79"]}, "h": "<h3>뭘 해결하는 시술인가</h3><ul><li><strong>롯드에 말아서</strong> 컬을 만드는 펌. 콜드펌이라고도 한다. 기계로 열처리하는 열펌과는 모양 잡는 방식이 다르다</li><li>커트만으로는 못 만드는 <strong>흐름</strong>을 만든다. 컬이 있으면 손질이 쉬워진다</li><li>같은 일반펌이라도 목적이 갈린다 — <strong>컬</strong>(쉐도우펌 · 히피펌) / <strong>방향</strong>(가르마펌 · 애즈펌)</li><li>볼륨감을 살리는 데 펌만한 게 없다. 다만 숱 많고 굵은 모발과 얇고 숱이 적은 모발의 결과물이 좀 다르다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><p><strong>적합</strong></p><ul><li><span class=\"tg\">직모</span> — 보통 컬을 넣어주는 게 좋다</li><li><span class=\"tg\">각진 얼굴</span> — 각진 선을 줄이고 컬로 둥그런 느낌을 더한다</li></ul><p><strong>비적합</strong></p><ul><li><span class=\"tg\">둥근 얼굴</span> — 둥근 느낌을 줄이고 선을 살려야 한다</li><li><span class=\"tg\">탈모 초기</span> — 약한 모발이라 펌을 해도 부스스하게 나온다</li></ul><p><strong>비적합까진 아니고 조절</strong></p><ul><li><span class=\"tg\">숱 많음</span> — 컬로 부피가 커진다. 커트로 먼저 덜고, 옆은 다운펌 병행</li><li>손질을 못 하는 손님 — 펌을 해도 손질을 아예 안 해도 되는 건 아니다. 손질이 어려우면 안 하는 것도 방법이다</li></ul><h3>시술 후 관리</h3><ul><li>펌이 자리 잡는 데 <strong>일주일</strong> 정도 걸린다. 그전에는 샴푸할 때마다 컬이 조금씩 풀린다고 생각하면 된다. 샴푸는 최소 횟수로</li><li>일주일 동안 모자는 피한다. 머리가 펴진 채 오래 있으면 컬이 풀리고 눌린다. 묶거나 집게로 고정하면 자국이 남을 수 있다</li><li>뜨거운 바람은 컬을 늘어지게 한다. 찬 바람으로 말려준다.</li><li>펌 전용 제품을 꼭 따로 쓸 필요는 없다. 하지만 쓰면 좋다.</li><li>빗질하면 컬이 풀린다. 손으로 살살털며 말린다.</li></ul>"}, {"id": "3e5a453d2b2981428a7ed03d8e8083db", "n": "볼륨매직", "p": {"검수": "검수 완료", "분류": "펌", "비적합": ["반곱슬", "손상모"], "손상도": "높음", "시술 시간": "부분 30분~전체 3시간", "유지 기간": "편 부분은 영구 (자란 부분만 다시 곱슬)", "재방문 기간": "4~6개월", "적합": ["강곱슬"], "시술명": "볼륨매직"}, "r": {"쓰는 스타일": ["3d9a453d2b2981c79bbde3132f2f3b92", "3d9a453d2b29812f9255d09fdce26f23"]}, "h": "<h3>뭘 해결하는 시술인가</h3><ul><li>곱슬을 펴는 열펌. 약으로 결합을 끊고 매직기로 곧게 편 뒤 고정한다</li><li>볼륨매직은 뿌리는 살짝 컬을 넣어주고 끝으로 갈수록 컬이 적게 들어간다. 남자는 그렇게 해야 전체적으로 일정한 볼륨감이 형성된다.</li><li>자라난 머리를 펴는 것이지, 머리가 펴져서 자라게 하는 게 아니다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><p><strong>적합</strong></p><ul><li><span class=\"tg\">강곱슬</span> — 매직을 한다면 볼륨매직을 추천한다. 매직으로 다 펴버리면 뿌리와 이질감이 들어 이상하다.</li></ul><p><strong>비적합</strong></p><ul><li><span class=\"tg\">반곱슬</span> — 전체 매직은 과하다. 부분 매직이나 다운펌으로 충분하다</li><li><span class=\"tg\">가는 모발</span> - 거의 처진다. 볼륨을 살린다는 개념이 불가능하다고 보면 된다.</li></ul><p><strong>비적합까진 아니고 조절</strong></p><ul><li>손상모·탈색모 — 고온 시술이라 끊어질 위험이 가장 크다</li></ul><h3>시술 후 관리</h3><ul><li>편 부분은 그대로 간다. 남자는 풀리기 전에 자르는 경우가 많고, 풀려도 원래보다 덜 곱슬거린다</li><li>일주일 정도는 자리 잡는 시간이다. 묶거나 집게로 고정하면 자국이 남는다.</li><li>매직 자체가 머리를 많이 상하게 하는 편이다. 볼륨매직도 마찬가지다</li></ul>"}, {"id": "3e5a453d2b2981b58504d7b1fc30480b", "n": "새치커버", "p": {"검수": "검수 완료", "분류": "그 외", "손상도": "보통", "시술 시간": "20~60분 (범위별)", "유지 기간": "3~5주", "재방문 기간": "4주 전후", "적합": ["새치"], "시술명": "새치커버"}, "r": {"쓰는 스타일": ["3d9a453d2b29813595e2cdacd100c75f", "3d9a453d2b2981fa9f97f0e831edbd7b"]}, "h": "<h3>뭘 해결하는 시술인가</h3><ul><li>흰머리를 주변 머리색에 맞춰 가리는 염색. 탈색 없이 색을 입힌다</li><li>흰머리는 색이 없어 염색약이 잘 안 먹는다. 그래서 전용 약을 쓴다</li><li>완전히 새까맣게 하면 오히려 부자연스럽고 뿌리 자란 티가 크게 난다. 자연스러운 갈색으로 대부분만 덮는 게 요즘 방식이다</li><li>짧은 옆머리나 뒷머리처럼 잘 보이는 곳만 부분으로도 한다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><p><strong>적합</strong></p><ul><li><span class=\"tg\">새치</span></li></ul><p><strong>비적합</strong> — 없음</p><ul><li>새치가 많은 분들은 의외로 숱이 대부분 많은 편이다. 탈모를 걱정해서 무리하면서까지 염색을 안 할 필요는 없다</li></ul><p><strong>조건</strong></p><ul><li>두피가 예민하거나 염색 알레르기 이력이 있으면 먼저 확인</li><li>염색할 때마다 두피가 아프고 염증이 생긴다면 탈모까지 갈 수 있다</li></ul><h3>시술 후 관리</h3><ul><li>한 달쯤 되면 뿌리가 보인다. 그때 <strong>리터치</strong>(자란 뿌리만)하면 시간도 짧고 손상도 적다</li><li>색 빠짐을 늦추려면 미지근한 물, 순한 샴푸. <strong>컬러 샴푸</strong> 권장</li><li>시술 후 하루 이틀은 샴푸 자제</li><li>햇빛에 색이 변색될 수 있다.</li></ul>"}, {"id": "3e5a453d2b298171b563db13b2911d9e", "n": "탈색·디자인컬러", "p": {"검수": "초안", "분류": "그 외", "비적합": ["가는 모발", "손상모"], "손상도": "높음", "시술 시간": "2~4시간 (횟수별)", "유지 기간": "색 2~6주 (색상별)", "재방문 기간": "4~6주 (리터치)", "시술명": "탈색·디자인컬러"}, "r": {"쓰는 스타일": ["3d9a453d2b29817195d6f35744c8c8d0", "3d9a453d2b2981c79bbde3132f2f3b92", "3d9a453d2b298157abfbeed0777c0aa7", "3d9a453d2b2981c7adf0ee976743c673", "3d9a453d2b29813595e2cdacd100c75f", "3d9a453d2b298169b11ac764045624de", "3d9a453d2b2981f98da5dabb4369df5d", "3d9a453d2b2981159f91eea784e4305a", "3d9a453d2b2981c68d23ef30596346bd", "3d9a453d2b29817bb873ec64bfde21e7", "3d9a453d2b29811f85b7e06a7efc9b30", "3d7a453d2b2981af9728ee0ab8d6c934", "3d9a453d2b29816da0aff35e0393c2f7", "3d9a453d2b29813f9f3bfa02ea155e67", "3d9a453d2b29812f9255d09fdce26f23", "3d9a453d2b2981fa9f97f0e831edbd7b", "3d9a453d2b2981779c34c585fe4f6fc6", "3d9a453d2b298179892fe94794324a6a", "3d9a453d2b2981c6bc74e69273772aae", "3d9a453d2b2981eaacbbef7918b92bc4", "3d9a453d2b2981d1bb21f9d7f6da805b", "3d9a453d2b2981cda817e9986ec12b79"]}, "h": "<h3>뭘 해결하는 시술인가</h3><ul><li>머리색을 빼서 밝기를 올리는 게 탈색, 그 위에 원하는 색을 입히는 게 디자인컬러다. 새치커버가 어둡게 덮는 거라면 탈색은 밝기를 여는 작업이라 정반대다</li><li>밝기는 <strong>레벨</strong>로 말한다. 1(검정)~12(백금). 동양인 자연모는 보통 3~4</li><li>목표가 밝을수록 여러 번 빼야 한다</li><li><strong>모든 시술 중 손상이 가장 크고</strong> 관리 부담도 크다. 시술 전에 반드시 알린다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><p><strong>적합</strong> — 없음</p><p><strong>비적합</strong></p><p><strong>비적합까진 아니고 조건</strong></p><ul><li>손상모 — 보류. 억지로 하면 끊어진다</li><li>가는 모발 - 가는 모발은 타기 쉽다 조심해서 하는게 좋다.</li><li><span class=\"tg\">강곱슬</span> — 탈색 후 컬이 늘어지거나 부스스해진다</li><li>두피 예민 — 탈색약은 자극이 매우 크다</li><li>검은 염색이 남아 있는 머리 — 잘 안 빠지고 얼룩진다</li></ul><h3>시술 후 관리</h3><ul><li>트리트먼트는 필수. 안 하면 2~3주 만에 부스스해진다</li><li>에센스를 늘 쓴다.</li><li>색 유지엔 <strong>컬러 샴푸</strong></li><li>뿌리가 자라면 <strong>리터치.</strong> 반복 탈색은 손상이 쌓이니 자란 부분만</li><li>시술 후 이틀은 샴푸 금지</li></ul>"}, {"id": "3e5a453d2b29815aaa25de269962a848", "n": "두피·모발관리", "p": {"검수": "검수 완료", "분류": "그 외", "손상도": "낮음", "시술 시간": "20~90분 (종류별)", "유지 기간": "1~2주", "재방문 기간": "3~4주 (두피 스케일링)", "적합": ["탈모 초기", "손상모"], "시술명": "두피·모발관리"}, "r": {"쓰는 스타일": ["3d9a453d2b29816da0aff35e0393c2f7", "3d9a453d2b29817195d6f35744c8c8d0", "3d9a453d2b298157abfbeed0777c0aa7", "3d9a453d2b2981c7adf0ee976743c673", "3d9a453d2b29813595e2cdacd100c75f", "3d9a453d2b298169b11ac764045624de", "3d9a453d2b2981c79bbde3132f2f3b92", "3d9a453d2b2981f98da5dabb4369df5d", "3d9a453d2b2981159f91eea784e4305a", "3d9a453d2b2981c68d23ef30596346bd", "3d9a453d2b29817bb873ec64bfde21e7", "3d9a453d2b29811f85b7e06a7efc9b30", "3d9a453d2b29813f9f3bfa02ea155e67", "3d7a453d2b2981af9728ee0ab8d6c934", "3d9a453d2b29812f9255d09fdce26f23", "3d9a453d2b2981fa9f97f0e831edbd7b", "3d9a453d2b2981779c34c585fe4f6fc6", "3d9a453d2b298179892fe94794324a6a", "3d9a453d2b2981c6bc74e69273772aae", "3d9a453d2b2981eaacbbef7918b92bc4", "3d9a453d2b2981d1bb21f9d7f6da805b", "3d9a453d2b2981cda817e9986ec12b79"]}, "h": "<h3>뭘 해결하는 시술인가</h3><ul><li>머리 모양이 아니라 <strong>두피 환경과 모발 손상</strong>을 다룬다. 커트·펌·염색이 디자인이라면 이쪽은 바탕이다</li><li>두피 관리 — <strong>두피 스케일링</strong>(각질·피지 제거) · <strong>앰플</strong>(두피 영양) · <strong>헤드스파</strong>(마사지 + 스팀)</li><li>모발 관리 — 트리트먼트, 클리닉. 손상을 보충한다</li><li>남자에게 두피케어가 특히 필요한 이유 — 피지가 많고, 탈모가 많고, 왁스·포마드 잔여물이 두피에 쌓인다</li><li><strong>탈모 치료는 미용실 영역이 아니다.</strong> 두피 환경을 좋게 하는 데까지다.</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><p><strong>적합</strong></p><ul><li><span class=\"tg\">탈모 초기</span> — 두피 환경 관리. 진행 중이면 피부과를 같이 권한다</li></ul><p><strong>비적합</strong> — 없음. 할수록 좋음</p><p><strong>그 외 효과가 큰 경우</strong></p><ul><li>두피가 기름지거나 각질이 많은 사람 · 왁스·포마드를 매일 쓰는 사람</li><li>펌·염색·탈색을 반복한 사람 (모발 관리, 두피 관리)</li></ul><p><strong>보류</strong></p><ul><li>두피에 상처·염증 → 시술하지 말고 병원 안내. <strong>지루성 두피염</strong>이 의심되면 피부과</li></ul><h3>시술 후 관리 — 집에서</h3><ul><li>매일 한 번 감는다. 하루 두세 번은 오히려 건조해진다</li><li><strong>말리는 건 필수.</strong> 두피가 젖어 있으면 세균이 잘 번식한다. 온도는 찬바람</li><li>물은 미지근하게. 찬물은 세정력이 조금 떨어진다</li><li>왁스 바르고 안 감고 자면 모공을 막을 수 있다. 왁스·포마드 쓴 날은 <strong>이중 세척</strong></li><li>모자를 오래 쓰면 땀이 차고 습해지는데 통풍이 안 된다. 다만 햇빛 강한 날은 쓰는 게 낫다</li></ul>"}, {"id": "3e5a453d2b298105bf24f26c05ec1a1e", "n": "헤어라인정리", "p": {"검수": "검수 완료", "분류": "그 외", "손상도": "낮음", "시술 시간": "5~15분 (보통 커트에 포함)", "유지 기간": "2~4주 (직선 2주 / 자연 3~4주)", "재방문 기간": "2~3주", "시술명": "헤어라인정리"}, "r": {"쓰는 스타일": ["3d7a453d2b2981af9728ee0ab8d6c934", "3d9a453d2b2981f98da5dabb4369df5d", "3d9a453d2b2981c6bc74e69273772aae"]}, "h": "<h3>뭘 해결하는 시술인가</h3><ul><li>이마·구레나룻·목덜미의 <strong>헤어라인</strong>을 트리머와 면도기로 정리하는 마감 작업, 긴 머리라면 가위로 정리하는 작업</li><li>짧은 머리에서는 완성도의 절반이다. 잔털이 정리되면 얼굴 윤곽이 선명해지고 깔끔해 보인다</li><li>헤어라인은 긴 머리가 아니라면 깔끔해야 한다. <strong>선이 딱 보이는 것이 좋다</strong></li></ul><h3>맞는 사람 / 안 맞는 사람</h3><p><strong>적합 · 비적합</strong> — 없음. 변수보다 스타일 기장이 가른다</p><p><strong>효과가 큰 경우</strong> — 크롭컷 · 아이비리그 · 슬릭백처럼 짧은 커트, 잔털이 많은 사람</p><p>긴 머리라면 감싸질 머리를 빗으로 당겨와서 라인을 만들어주거나 기장을 맞춰준다.</p><h3>시술 후 관리</h3><ul><li>라인이 무너지는 속도가 가장 빠르다. 짧은 머리는 2~3주마다 라인만 정리해도 된다</li><li>집에서 라인을 직접 밀지 않는다. 잘못 밀면 되돌리는 데 몇 주 걸린다. 잔털 정도는 괜찮다</li><li>목덜미가 자랄 때 따가운 건 너무 바짝 밀어서다</li></ul>"}], "P": [{"id": "3f1a453d2b29810a9246efec4876fc83", "n": "워터 왁스", "p": {"고정력": "약", "광택": "있음", "구분": "스타일링 제품", "분류": "왁스", "비적합": ["굵은 모발"], "세척": "쉬움", "손질 난이도": "쉬움"}, "r": {"쓰는 드라이": ["3fba453d2b2981fa966df98761b94874"], "쓰는 스타일": ["3d9a453d2b29817195d6f35744c8c8d0", "3d9a453d2b298169b11ac764045624de", "3d9a453d2b2981c79bbde3132f2f3b92", "3d9a453d2b2981c6bc74e69273772aae", "3d9a453d2b2981fa9f97f0e831edbd7b", "3d9a453d2b298157abfbeed0777c0aa7", "3d9a453d2b2981f98da5dabb4369df5d", "3d9a453d2b29812f9255d09fdce26f23", "3d9a453d2b2981159f91eea784e4305a", "3d9a453d2b29817bb873ec64bfde21e7", "3d9a453d2b29811f85b7e06a7efc9b30", "3d9a453d2b29816da0aff35e0393c2f7", "3d9a453d2b2981c68d23ef30596346bd", "3d7a453d2b2981af9728ee0ab8d6c934", "3d9a453d2b2981c7adf0ee976743c673", "3d9a453d2b2981cda817e9986ec12b79"]}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>물 성분이 많아 가볍고 젖은 듯한 윤기가 나는 왁스</li><li>펌 컬이나 결을 촉촉하게 살릴 때 쓴다</li><li>일반 왁스보다 묽고 잘 펴진다. 물에 잘 씻긴다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>매트 왁스</strong>보다 광이 있고 가볍다. 고정력은 약하다</li><li><strong>포마드</strong>보다 가볍고 물에 잘 씻긴다</li><li><strong>젤</strong>처럼 딱딱하게 굳지 않는다</li><li><strong>컬크림</strong>도 컬을 살리지만 크림이라 더 촉촉하고 무겁다. 워터 왁스는 컬을 살리면서 모양도 조금 잡아준다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>펌한 머리, 젖은 느낌으로 웨이브 결을 살리고 싶은 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>굵고 뻣뻣한 모발은 힘이 모자라 모양이 안 잡힌다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>덜 마른 상태, 다 말린 상태 둘 다 쓸 수 있다<ul><li>덜 마른 상태: 바르고 손으로 움켜쥐듯 말리면 컬이 더 산다</li><li>다 말린 상태: 마무리로 결과 윤기만 더한다</li></ul></li><li>손바닥에 골고루 펴서 손가락으로 털며 골고루 발라준다.<ul><li>양은 처음엔 적게. 모자라면 조금씩 더한다</li></ul></li><li>컬이 있으면 끝을 손으로 쥐었다 놓으며 컬을 정리한다</li></ol><h3>주의</h3><ul><li>땀·습기에 약하다</li><li>많이 바르면 끈적인다</li><li>바른 날은 감고 잔다</li></ul>"}, {"id": "3f1a453d2b2981268b2ad0ff44c967f5", "n": "매트 왁스", "p": {"고정력": "중", "광택": "없음", "구분": "스타일링 제품", "분류": "왁스", "세척": "보통", "손질 난이도": "쉬움", "적합": ["숱 적음"]}, "r": {"쓰는 드라이": ["3fba453d2b29812cab4afb0f0ccc3931", "3fba453d2b2981e4b783cad65072b611", "3fba453d2b29810db150c9e78bcf3046", "3fba453d2b29819e9378d6ceab957732", "3fba453d2b29817e8972c87bfeecef61", "3fba453d2b2981f1ba0ec67332a03ccf"], "쓰는 스타일": ["3d7a453d2b2981af9728ee0ab8d6c934", "3d9a453d2b2981c68d23ef30596346bd", "3d9a453d2b29816da0aff35e0393c2f7", "3d9a453d2b29811f85b7e06a7efc9b30", "3d9a453d2b29817bb873ec64bfde21e7", "3d9a453d2b2981159f91eea784e4305a", "3d9a453d2b29812f9255d09fdce26f23", "3d9a453d2b2981f98da5dabb4369df5d", "3d9a453d2b2981779c34c585fe4f6fc6", "3d9a453d2b2981c79bbde3132f2f3b92", "3d9a453d2b298179892fe94794324a6a", "3d9a453d2b29813595e2cdacd100c75f", "3d9a453d2b2981d1bb21f9d7f6da805b", "3d9a453d2b29817195d6f35744c8c8d0", "3d9a453d2b2981fa9f97f0e831edbd7b", "3d9a453d2b2981c6bc74e69273772aae"]}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>광 없이 보송하게 마무리하는 왁스. 요즘 남자 머리의 기본 제품</li><li>질감을 살리면서 모양을 잡는다</li><li>바른 티가 덜 나서 \"안 바른 것 같은데 모양은 잡힌\" 머리가 된다</li><li>마른 머리에 손으로 바르는 제품이다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>하드 왁스</strong>보다 고정력은 약하지만 훨씬 자연스럽다</li><li><strong>워터 왁스</strong>는 젖은 듯한 윤기, 매트 왁스는 보송한 질감</li><li><strong>포마드</strong>는 광을 내며 넘기는 제품, 매트 왁스는 광 없이 질감을 내는 제품</li><li><strong>무스</strong>는 젖은 머리에 발라 드라이로 볼륨을 만든다. 매트 왁스는 다 말린 뒤 마무리로 쓴다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>대부분 무난하다.</li><li>처음 왁스를 써보는 사람이 시작하기 좋다</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>강한 직모를 세워야 하면 고정력이 모자랄 수 있다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>완전히 말린 머리에 쓴다<ul><li>드라이로 방향과 볼륨을 먼저 잡아두면 왁스는 마무리만 하면 된다</li></ul></li><li>손바닥에 얇게 펴서 손가락으로 골고루 발라준다.<ul><li>양은 처음엔 새끼손톱만큼. 모자라면 조금씩 더한다</li><li>손바닥에 하얀 덩어리가 안 보일 때까지 펴야 한 곳에 안 뭉친다</li></ul></li><li>앞부터 바르고 옆머리 바르고 뒷머리는 손에 남은 걸로 마지막에 바른다</li><li>손가락으로 원하는 방향을 잡는다</li><li>마무리로 손가락 끝으로 집어 끝을 비틀면 질감이 산다</li><li>오래 유지해야 하면 스프레이로 마무리한다</li></ol><h3>주의</h3><ul><li>많이 바르면 떡져 보인다</li><li>바른 날은 감고 잔다</li><li>바른 뒤 자꾸 손으로 만지면 떡진다</li></ul>"}, {"id": "3f1a453d2b29813e96afdd83d89b2950", "n": "하드 왁스", "p": {"고정력": "강", "광택": "약간", "구분": "스타일링 제품", "분류": "왁스", "비적합": ["가는 모발", "숱 적음"], "세척": "보통", "손질 난이도": "어려움", "적합": ["굵은 모발", "직모"]}, "r": {"쓰는 드라이": ["3fba453d2b29812cab4afb0f0ccc3931", "3fba453d2b29810db150c9e78bcf3046", "3fba453d2b29817e8972c87bfeecef61"], "쓰는 스타일": ["3d9a453d2b2981c6bc74e69273772aae", "3d9a453d2b29817195d6f35744c8c8d0", "3d9a453d2b2981fa9f97f0e831edbd7b", "3d9a453d2b2981c79bbde3132f2f3b92", "3d9a453d2b2981f98da5dabb4369df5d", "3d9a453d2b2981c68d23ef30596346bd", "3d7a453d2b2981af9728ee0ab8d6c934", "3d9a453d2b29811f85b7e06a7efc9b30", "3d9a453d2b29817bb873ec64bfde21e7", "3d9a453d2b29816da0aff35e0393c2f7", "3d9a453d2b29812f9255d09fdce26f23", "3d9a453d2b2981159f91eea784e4305a"]}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>고정력이 가장 강한 왁스. 머리를 세우거나 모양을 오래 붙잡아둘 때 쓴다</li><li>바르면 약간 윤기가 돈다</li><li>단단한 덩어리라서 손바닥 열로 녹여서 쓴다. 덜 녹이면 한곳에 뭉쳐서 붙는다</li><li>왁스는 <strong>마른 머리에 손으로</strong> 모양을 만드는 제품이다. 바른 뒤에도 손
