으로 다시 만질 수 있다</li><li>종류<ul><li>일반 하드 왁스: 약간 윤기, 강한 고정</li><li>하드 매트 왁스: 광 없이 강한 고정. 요즘은 이쪽을 더 많이 쓴다</li></ul></li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>매트 왁스</strong>보다 단단하고 오래 간다. 대신 무겁고 덜 자연스럽다</li><li><strong>포마드</strong>보다 광이 적다.</li><li><strong>젤</strong>처럼 딱딱하게 굳지 않아서 바른 뒤에도 손으로 다시 만질 수 있다</li><li><strong>스프레이</strong>는 바르는 게 아니라 뿌려서 굳히는 마무리용이다. 하드 왁스로 모양을 잡고 스프레이로 고정하면 하루 종일 간다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>굵고 힘 있는 직모라 머리가 말을 안 듣는 사람에게 적합</li><li>짧게 세우는 머리, 옆머리가 떠서 눌러야 하는 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>가는 모발은 떡져보이거나 처질 수 있다.</li><li>숱이 적으면 머리끼리 뭉쳐서 사이로 두피가 보인다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>머리를 완전히 말린다<ul><li>젖은 머리에 바르면 잘 안 퍼지고 고정력이 떨어진다</li></ul></li><li>손끝으로 덜어 손바닥에서 충분히 녹여 골고루 펴 바른뒤 손가락으로 골고루 발라준다.<ul><li>양은 처음엔 새끼손톱만큼. 적게 시작해서 모자라면 더한다. 많아서 떡지면 되돌리기 힘들다.</li></ul></li><li>앞머리부터 바르고 옆,뒤머리는 손에 남은 걸로 마지막에 바른다<ul><li>앞머리에 처음부터 너무 많이 묻으면 앞머리가 무거워져서 처진다</li></ul></li><li>손가락으로 원하는 방향으로 세우거나 넘기고, 끝을 손끝으로 집어 정리한다</li><li>오래 유지해야 하면 스프레이로 마무리한다</li></ol><h3>주의</h3><ul><li>두피에 직접 문지르지 않는다</li><li>바른 날은 꼭 감고 잔다. 한 번에 안 빠지면 두 번 감는다</li><li>손에 남은 왁스는 물로만 씻으면 잘 안 빠진다. 비누로 씻는다</li><li>바른 뒤 자꾸 손으로 만지면 기름이 묻어 떡진다</li></ul>"}, {"id": "3f1a453d2b298142a158e3793eb948a3", "n": "포마드", "p": {"고정력": "중", "광택": "있음", "구분": "스타일링 제품", "분류": "포마드", "비적합": ["가는 모발", "숱 적음"], "세척": "보통", "손질 난이도": "어려움", "적합": ["굵은 모발"]}, "r": {"쓰는 드라이": ["3fba453d2b2981e4b783cad65072b611", "3fba453d2b29817e8972c87bfeecef61"], "쓰는 스타일": ["3d9a453d2b2981159f91eea784e4305a", "3d9a453d2b29812f9255d09fdce26f23", "3d9a453d2b29816da0aff35e0393c2f7", "3d9a453d2b29817bb873ec64bfde21e7", "3d9a453d2b29811f85b7e06a7efc9b30", "3d7a453d2b2981af9728ee0ab8d6c934", "3d9a453d2b2981f98da5dabb4369df5d", "3d9a453d2b2981c79bbde3132f2f3b92", "3d9a453d2b2981fa9f97f0e831edbd7b", "3d9a453d2b29817195d6f35744c8c8d0", "3d9a453d2b2981c6bc74e69273772aae"]}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>광을 내면서 머리를 넘기는 제품. 슬릭백처럼 정돈된머리나, 젖은 느낌의 스타일링을 할 때 사용한다.</li><li>머리를 빗으로 깔끔하게 빗어 넘기는 클래식한 머리에 많이썼었다.</li><li>종류<ul><li>수성 포마드: 물에 잘 씻기고 고정력이 높다. 마르면 조금 단단해진다</li><li>유성 포마드: 오래 부드럽고 광이 오래 간다. 기름 성분이라 잘 안 씻긴다</li></ul></li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>왁스</strong>보다 광이 강하다.</li><li><strong>젤</strong>은 마르면 굳지만 포마드는 부드러워서 다시 빗을 수 있다</li><li><strong>헤어 밤</strong>보다 고정력과 광이 강하다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>굵은 모발에 좋다. 무게와 힘이 넘김을 버틴다</li><li>젖은 느낌을 연출할 때 쓰기 좋다.</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>가는 모발은 떡져보이기 좋다.</li><li>숱이 적으면 머리가 뭉치면서 사이로 두피가 보인다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>드라이로 넘길 방향을 먼저 잡아둔다<ul><li>수성은 살짝 덜 마른 머리에 발라도 된다</li></ul></li><li>손바닥에서 완전히 녹인 뒤 손가락으로 골고루 발라준다.<ul><li>양은 처음엔 적게. 모자라면 조금씩 더한다</li></ul></li><li>앞머리와 옆선을 손으로 한 번 더 정리한다</li></ol><ul><li>처음이면 물에 잘 씻기는 수성부터</li></ul><h3>주의</h3><ul><li>머리를 잘 감아준다.</li><li>유성은 한 번에 잘 안 빠진다. 두 번 감는다</li><li>많이 바르면 기름져 보인다</li></ul>"}, {"id": "3f1a453d2b298118aac3f546a8ca69a4", "n": "액상 스프레이", "p": {"고정력": "강", "광택": "약간", "구분": "스타일링 제품", "분류": "스프레이", "비적합": ["가는 모발", "숱 적음"], "세척": "보통", "손질 난이도": "쉬움", "적합": ["굵은 모발"]}, "r": {"쓰는 드라이": ["3fba453d2b29812cab4afb0f0ccc3931", "3fba453d2b29813fb464cd9bdfca25b2", "3fba453d2b2981d29818f4b51060fa43"], "쓰는 스타일": ["3d9a453d2b2981c6bc74e69273772aae", "3d9a453d2b29817195d6f35744c8c8d0", "3d9a453d2b2981fa9f97f0e831edbd7b", "3d9a453d2b2981c79bbde3132f2f3b92", "3d7a453d2b2981af9728ee0ab8d6c934", "3d9a453d2b2981f98da5dabb4369df5d", "3d9a453d2b29811f85b7e06a7efc9b30", "3d9a453d2b29816da0aff35e0393c2f7", "3d9a453d2b29817bb873ec64bfde21e7", "3d9a453d2b29812f9255d09fdce26f23", "3d9a453d2b2981c68d23ef30596346bd", "3d9a453d2b2981779c34c585fe4f6fc6", "3d9a453d2b2981159f91eea784e4305a", "3d9a453d2b298179892fe94794324a6a", "3d9a453d2b298169b11ac764045624de", "3d9a453d2b29813595e2cdacd100c75f", "3d9a453d2b2981c7adf0ee976743c673", "3d9a453d2b298157abfbeed0777c0aa7", "3d9a453d2b2981d1bb21f9d7f6da805b", "3d9a453d2b2981cda817e9986ec12b79", "3d9a453d2b2981eaacbbef7918b92bc4"]}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>펌프식으로 뿌리는 고정 스프레이. 촉촉하게 뿌려지고 마르면서 굳는다</li><li>가스 없이 액체가 그대로 나와서 뿌린 곳이 젖는다. 이걸 드라이로 말리면 그 모양대로 굳는다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>가스 스프레이</strong>보다 입자가 굵고 한곳에 몰린다. 원하는 부분만 강하게 고정할 때 좋다</li><li><strong>왁스</strong>는 손으로 모양을 만드는 제품, 액상 스프레이는 만든 모양을 굳히는 제품</li><li>드라이를 완료하고 모양을 고정할 때 쓴다.</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>앞머리 뿌리, 옆머리처럼 특정 부위를 확실히 고정하고 싶은 사람</li><li>머리를 플라스틱처럼 완전히 고정시키고 싶은 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>가는 모발·숱이 적으면 무게 때문에 처지고 머리끼리 뭉친다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>드라이로 모양을 먼저 잡는다</li><li>고정할 부위에 가까이 뿌리고 드라이로 말리며 모양을 잡는다<ul><li>앞머리 뿌리를 세우려면 뿌리를 들고 안쪽에 뿌린 뒤 드라이로 말린다</li></ul></li><li>마무리용이면 손으로 모양을 잡고 뿌린 뒤 마를 때까지 건드리지 않는다</li></ol><h3>주의</h3><ul><li>많이 뿌리면 하얗게 굳고 딱딱해진다</li><li>뿌린 날은 감고 잔다</li><li>굳은 뒤 손으로 만지면 모양이 깨지고 끈적인다</li></ul>"}, {"id": "3f1a453d2b2981e984decca70a341880", "n": "가스 스프레이", "p": {"고정력": "중", "광택": "없음", "구분": "스타일링 제품", "분류": "스프레이", "비적합": ["탈모 초기"], "세척": "쉬움", "손질 난이도": "쉬움"}, "r": {"쓰는 드라이": ["3fba453d2b29812cab4afb0f0ccc3931", "3fba453d2b2981e4b783cad65072b611", "3fba453d2b29817e8972c87bfeecef61", "3fba453d2b29816683f8cb643de07d6e", "3fba453d2b2981678835fb43ad27f9c8", "3fba453d2b2981d29818f4b51060fa43", "3fba453d2b29819e9378d6ceab957732", "3fba453d2b2981f1ba0ec67332a03ccf"], "쓰는 스타일": ["3d9a453d2b2981eaacbbef7918b92bc4", "3d9a453d2b2981cda817e9986ec12b79", "3d9a453d2b2981d1bb21f9d7f6da805b", "3d9a453d2b298157abfbeed0777c0aa7", "3d9a453d2b2981c7adf0ee976743c673", "3d9a453d2b29813595e2cdacd100c75f", "3d9a453d2b2981c6bc74e69273772aae", "3d9a453d2b2981fa9f97f0e831edbd7b", "3d9a453d2b29817195d6f35744c8c8d0", "3d9a453d2b298179892fe94794324a6a", "3d9a453d2b298169b11ac764045624de", "3d9a453d2b2981c79bbde3132f2f3b92", "3d9a453d2b2981f98da5dabb4369df5d", "3d9a453d2b29812f9255d09fdce26f23", "3d9a453d2b2981159f91eea784e4305a", "3d9a453d2b29816da0aff35e0393c2f7", "3d9a453d2b2981779c34c585fe4f6fc6", "3d9a453d2b29811f85b7e06a7efc9b30", "3d9a453d2b29817bb873ec64bfde21e7", "3d7a453d2b2981af9728ee0ab8d6c934"]}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>가스로 아주 곱고 넓게 뿌려지는 스프레이</li><li>마무리 고정용과 질감용(<strong>텍스처 스프레이</strong>)이 있다. 손님들은 둘 다 「가스 스프레이」라고 부른다<ul><li>고정용: 다 만든 머리 전체를 가볍게 굳혀서 하루 종일 유지시킨다</li><li>질감용: 머리끼리 살짝 버석하게 붙게 만들어 볼륨과 질감을 낸다</li></ul></li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>액상 스프레이</strong>보다 입자가 곱고 넓게 퍼져서 전체를 가볍게 고정한다</li><li>텍스처 스프레이는 고정보다 질감과 볼륨용이다. 머리끼리 살짝 버석하게 붙어서 볼륨이 산다</li><li><strong>왁스</strong>로 모양을 만들고 가스 스프레이로 마무리하는 게 기본 순서다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>대부분 무난하다</li><li>왁스 모양이 오후만 되면 무너지는 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>탈모가 시작된 사람. 두피에 닿으면 안 좋아서 두피를 최대한 피해 뿌려야 한다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>드라이와 왁스로 모양을 다 만든다</li><li>머리에서 한 뼘 이상 떨어져서 짧게 끊어 뿌린다<ul><li>한곳에 오래 뿌리지 말고 전체를 훑듯이 뿌린다</li></ul></li><li>마를 때까지 몇 초 건드리지 않는다</li></ol><ul><li>질감용은 다 말린 머리에 뿌리고 손으로 털어준다</li></ul><h3>주의</h3><ul><li>가까이 뿌리면 젖고 뭉친다</li><li>얼굴·눈은 피한다. 가스라서 불 가까이에서 쓰지 않는다</li><li>두피에 너무 뿌리면 탈모가 빨리 올 수 있다. 두피는 최대한 피해서 뿌려준다.</li><li>뿌린 날은 감고 잔다</li></ul>"}, {"id": "3f1a453d2b2981da84d1d5a08a0ed0f6", "n": "컬크림", "p": {"고정력": "약", "광택": "약간", "구분": "스타일링 제품", "분류": "컬크림", "세척": "쉬움", "손질 난이도": "쉬움", "적합": ["반곱슬"]}, "r": {"쓰는 드라이": ["3fba453d2b2981fa966df98761b94874"], "쓰는 스타일": ["3d9a453d2b298157abfbeed0777c0aa7", "3d9a453d2b29813595e2cdacd100c75f", "3d9a453d2b2981c7adf0ee976743c673", "3d9a453d2b298169b11ac764045624de", "3d9a453d2b2981779c34c585fe4f6fc6", "3d9a453d2b298179892fe94794324a6a"]}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>펌 컬이나 곱슬을 살려주는 크림. 컬을 촉촉하게 정돈하고 부스스함을 잡는다</li><li>펌한 머리는 그냥 말리면 컬이 풀리거나 부스스해진다. 컬크림을 바르고 말리면 컬이 한 덩어리씩 뭉쳐서 또렷해진다</li><li>모양을 세우는 힘은 거의 없다. 있는 컬을 살리는 제품이다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>무스</strong>는 가볍게 볼륨, 컬크림은 무겁게 정돈과 윤기</li><li><strong>왁스</strong>처럼 모양을 붙잡는 힘은 약하다</li><li><strong>워터 왁스</strong>도 컬을 살리지만 컬크림이 더 촉촉하고 부스스함을 더 잘 잡는다</li><li><strong>에센스</strong>는 결만 정리하고 컬을 살리진 않는다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>펌한 사람, 반곱슬·곱슬</li><li>펌하고 집에서 컬이 안 나온다는 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>직모에 펌을 안 했으면 쓸 이유가 없다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>머리를 감고 수건으로 물기를 닦는다<ul><li>비비지 말고 꾹꾹 눌러 닦아야 컬이 안 풀린다</li></ul></li><li>두피만 말린 덜 마른 머리에 바른다<ul><li>머리카락이 촉촉하게 젖어 있을 때 발라야 컬에 골고루 먹는다</li></ul></li><li>손바닥에 펴서 손으로 머리 끝을 움켜쥐듯 바른다<ul><li>양은 새끼손톱 절반 만큼부터. 숱이 많으면 더한다</li></ul></li><li>손으로 움켜쥐듯 말리면 컬이 산다. 빗질하면 컬이 풀린다<ul><li>드라이기 바람은 약하고 찬 바람. 강하고 뜨거운 바람은 컬을 흩트린다</li></ul></li><li>다 마르면 손가락으로 컬을 살짝 나눠서 정리한다</li></ol><h3>주의</h3><ul><li>많이 바르면 무거워서 처진다</li><li>다 마른 뒤 손으로 자꾸 만지면 부스스해진다</li></ul>"}, {"id": "3f6a453d2b298109bb9feddcc14afc17", "n": "무스", "p": {"고정력": "약", "광택": "약간", "구분": "스타일링 제품", "분류": "컬크림", "세척": "쉬움", "손질 난이도": "보통", "적합": ["가는 모발", "숱 적음", "반곱슬"]}, "r": {"쓰는 드라이": ["3fba453d2b29812cab4afb0f0ccc3931", "3fba453d2b29816683f8cb643de07d6e", "3fba453d2b2981678835fb43ad27f9c8", "3fba453d2b2981fa966df98761b94874", "3fba453d2b29817e8972c87bfeecef61"]}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>통에서 짜면 <strong>거품</strong>으로 나오는 스타일링제. 젖은 머리에 발라서 말리면 머리카락 겉에 얇은 막이 생기고, 그 막이 머리를 가볍게 붙잡아준다</li><li>하는 일은 크게 두 가지다<ul><li><strong>볼륨</strong> — 뿌리에 바르고 들어올리며 말리면 뿌리가 서고, 머리가 풍성해 보인다</li><li><strong>컬 살리기</strong> — 펌이나 곱슬 머리에 바르고 움켜쥐듯 말리면 컬이 또렷해지고 부스스함이 줄어든다</li></ul></li><li>거품이라 양이 많아 보이지만 꺼지면 아주 적은 양이다. 머리 전체에 고르게 펴기 쉽다</li><li>종류 — 볼륨용 / 컬용 / 고정력 강한 하드 무스로 나뉜다. 남자는 볼륨용이나 컬용을 주로 쓴다</li><li>2000년대엔 남자 스타일링의 기본이었다. 그 뒤 왁스로 넘어가면서 지금은 펌 머리 관리용으로 주로 쓴다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>왁스</strong> — 다 말린 머리에 바르고 손으로 모양을 만든다. 무스는 <strong>젖은 머리에 바르고 드라이로 모양을 만든다.</strong> 쓰는 순서가 다르다</li><li><strong>컬크림</strong> — 둘 다 컬을 살리지만 컬크림은 무겁고 촉촉해서 컬을 차분하게 정돈한다. 무스는 가볍고 바삭해서 컬에 탄력과 볼륨을 준다</li><li><strong>젤</strong> — 젤은 젖은 듯 광이 나고 딱딱하게 굳는다. 무스는 덜 굳고 광도 약하다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>가는 모발, 숱이 적은 사람 — 왁스는 무게 때문에 머리가 눌리는데 무스는 가벼워서 볼륨이 산다</li><li>펌한 사람, 반곱슬 — 컬을 또렷하게 살린다</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>굵고 뻣뻣한 직모는 무스만으로는 모양이 안 잡힌다. 마무리로 왁스를 같이 쓴다</li><li>다 말린 머리에 바로 손질하고 싶은 사람. 드라이를 해야 효과가 난다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>감고 수건으로 물기를 닦는다. 물이 뚝뚝 떨어지지 않을 정도</li><li>통을 위아래로 흔든 뒤 손바닥에 짠다. 짧은 머리는 탁구공, 기장이 있으면 골프공보다 조금 크게</li><li>손바닥에 편 뒤 뿌리부터 끝까지 고루 바른다. 손가락으로 빗듯이 넣으면 고르게 들어간다</li><li>목적에 맞춰 말린다<ul><li><strong>볼륨</strong> — 뿌리를 손가락으로 들어올리며 뿌리 쪽에 바람을 준다</li><li><strong>컬</strong> — 손으로 아래에서 위로 움켜쥐듯 말린다. 빗질하지 않는다</li></ul></li><li>다 마르면 찬바람으로 한 번 고정한다</li><li>더 정리가 필요하면 손에 왁스를 아주 조금만 묻혀 겉면만 다듬는다</li></ol><h3>주의</h3><ul><li><strong>많이 쓰면 바삭하고 뻣뻣해진다.</strong> 처음엔 적게 쓰고 모자라면 더한다</li><li>알코올이 든 제품이 많아서 자주 쓰면 머리가 건조해질 수 있다</li><li>머리카락이 바삭하게 굳었으면 손으로 살살 비벼주면 부드러워진다</li><li>쓴 날은 감고 잔다</li></ul>"}, {"id": "3f1a453d2b298103a960f9250cf86318", "n": "헤어 젤", "p": {"고정력": "강", "광택": "있음", "구분": "스타일링 제품", "분류": "젤", "비적합": ["숱 적음", "가는 모발"], "세척": "보통", "손질 난이도": "보통", "적합": ["굵은 모발"]}, "r": {"쓰는 드라이": ["3fba453d2b29817e8972c87bfeecef61"], "쓰는 스타일": ["3d9a453d2b2981159f91eea784e4305a", "3d9a453d2b29816da0aff35e0393c2f7", "3d9a453d2b29817bb873ec64bfde21e7", "3d9a453d2b2981c6bc74e69273772aae", "3d9a453d2b29817195d6f35744c8c8d0", "3d9a453d2b2981f98da5dabb4369df5d"]}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>젖은 듯 광이 나고 마르면 딱딱하게 굳는 강한 고정제</li><li>투명한 젤 형태. 젖은 머리에 발라서 모양을 만들고, 마르면서 그 모양대로 굳는다</li><li>굳으면 하루 종일 안 무너진다. 대신 굳은 뒤에는 모양을 고칠 수 없다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>포마드</strong>는 마른 뒤에도 부드럽지만 젤은 굳는다</li><li><strong>왁스</strong>보다 다시 만지기 어렵다</li><li><strong>무스</strong>도 젖은 머리에 바르지만 가볍고 볼륨용이다. 젤은 무겁고 고정용이다</li><li>젖은 질감이 필요할 때 쓴다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>짧게 세우는 머리, 젖은 질감의 넘긴 머리</li><li>땀을 많이 흘리거나 하루 종일 모양이 유지돼야 하는 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>숱이 적거나 모발이 얇으면 머리가 뭉쳐서 두피가 보인다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>머리를 감고 수건으로 물기를 닦는다</li><li>젖은 머리나 덜 마른 머리에 바르고 원하는 모양으로 빗는다<ul><li>양은 처음엔 적게. 많이 바르면 굳은 뒤 딱딱하고 하얘진다</li></ul></li><li>굳기 전에 모양을 끝낸다<ul><li>빗으로 넘기면 깔끔한 넘김, 손가락으로 세우면 뾰족한 질감이 된다</li></ul></li><li>자연 방치로 말리거나 드라이기 차고 약한 바람으로 말린다</li></ol><h3>주의</h3><ul><li>굳은 뒤 만지면 하얀 가루가 생긴다</li><li>바른 날은 감고 잔다</li><li>매일 쓰면 머리가 건조해진다</li></ul>"}, {"id": "3f1a453d2b2981af9b4fc368b534b1bb", "n": "헤어토닉", "p": {"고정력": "약", "광택": "약간", "구분": "스타일링 제품", "분류": "토닉", "세척": "쉬움", "손질 난이도": "쉬움"}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded", "3fba453d2b29812cab4afb0f0ccc3931", "3fba453d2b2981e4b783cad65072b611", "3fba453d2b29817e8972c87bfeecef61", "3fba453d2b29816683f8cb643de07d6e", "3fba453d2b2981678835fb43ad27f9c8", "3fba453d2b29813fb464cd9bdfca25b2", "3fba453d2b2981d9b5a7e94383a1f192", "3fba453d2b2981d29818f4b51060fa43", "3fba453d2b29819e9378d6ceab957732", "3fba453d2b2981f1ba0ec67332a03ccf"], "쓰는 스타일": ["3d9a453d2b2981fa9f97f0e831edbd7b", "3d9a453d2b2981eaacbbef7918b92bc4", "3d9a453d2b2981d1bb21f9d7f6da805b", "3d9a453d2b2981cda817e9986ec12b79", "3d9a453d2b298157abfbeed0777c0aa7", "3d9a453d2b2981c7adf0ee976743c673", "3d9a453d2b29813595e2cdacd100c75f", "3d9a453d2b298169b11ac764045624de", "3d9a453d2b2981c6bc74e69273772aae", "3d9a453d2b29817195d6f35744c8c8d0", "3d9a453d2b298179892fe94794324a6a", "3d9a453d2b2981c79bbde3132f2f3b92", "3d9a453d2b2981f98da5dabb4369df5d", "3d9a453d2b29812f9255d09fdce26f23", "3d9a453d2b2981159f91eea784e4305a", "3d9a453d2b2981779c34c585fe4f6fc6", "3d9a453d2b29816da0aff35e0393c2f7", "3d9a453d2b29817bb873ec64bfde21e7", "3d9a453d2b29811f85b7e06a7efc9b30", "3d7a453d2b2981af9728ee0ab8d6c934"]}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>드라이 전에 바르는 제품. 열로부터 머리를 보호하고, 드라이로 모양을 잡기 쉽게 기초를 깔아준다</li><li>물처럼 묽은 액체나 미스트 형태가 많다</li><li>바른다고 모양이 잡히진 않는다. 드라이로 만든 모양이 더 잘 잡히고 오래 가게 도와준다</li><li>젖은 상태에서 바르고 그대로 마르게 냅두면 젤 바른듯 마르기도 한다. 하지만 손으로 조금만 만지면 굳은게 풀린다.</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>두피토닉</strong>은 두피에 뿌리는 관리 제품이다. 이름만 비슷하고 쓰는 곳이 다르다</li><li><strong>에센스</strong>는 마무리 결 정리, 헤어토닉은 드라이 전 준비</li><li><strong>무스</strong>도 드라이 전에 바르지만 볼륨과 고정이 있다. 헤어토닉은 고정 없이 준비만 한다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>매일 드라이하는 사람</li><li>드라이해도 금방 모양이 풀리는 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>특별히 없다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>머리를 감고 수건으로 물기를 닦는다</li><li>머리 전체에 뿌리거나 손에 덜어 바른다<ul><li>뿌리 쪽 방향을 잡을 부분은 손가락으로 한 번 더 문질러 먹인다</li></ul></li><li>바로 드라이한다</li><li>다 말린 뒤 왁스 같은 마무리 제품을 쓴다</li></ol><h3>주의</h3><ul><li>두피보다 머리카락에 바른다</li><li>너무 많이 바르면 마른 뒤 뻣뻣해질 수 있다</li></ul>"}, {"id": "3f1a453d2b29813cab36fa8be6ec6d95", "n": "에센스", "p": {"광택": "약간", "구분": "스타일링 제품", "분류": "에센스", "세척": "쉬움", "손질 난이도": "쉬움", "적합": ["손상모"]}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded"], "쓰는 스타일": ["3d9a453d2b2981c6bc74e69273772aae", "3d9a453d2b2981fa9f97f0e831edbd7b", "3d9a453d2b29817195d6f35744c8c8d0", "3d9a453d2b2981eaacbbef7918b92bc4", "3d9a453d2b2981d1bb21f9d7f6da805b", "3d9a453d2b2981cda817e9986ec12b79", "3d9a453d2b298157abfbeed0777c0aa7", "3d9a453d2b2981f98da5dabb4369df5d", "3d9a453d2b29816da0aff35e0393c2f7", "3d9a453d2b29817bb873ec64bfde21e7", "3d9a453d2b2981c7adf0ee976743c673", "3d9a453d2b298169b11ac764045624de", "3d9a453d2b29813595e2cdacd100c75f", "3d9a453d2b298179892fe94794324a6a", "3d9a453d2b2981c79bbde3132f2f3b92", "3d9a453d2b29812f9255d09fdce26f23", "3d9a453d2b2981159f91eea784e4305a", "3d9a453d2b2981779c34c585fe4f6fc6", "3d9a453d2b29811f85b7e06a7efc9b30", "3d7a453d2b2981af9728ee0ab8d6c934"]}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>결을 정리하고 부스스함을 잡는 오일·로션류. 윤기를 더한다</li><li>감고 나서 바르고 헹구지 않는다</li><li>종류<ul><li>로션·크림 에센스: 촉촉하고 가볍다. 남자 짧은 머리에 무난하다</li><li>오일 에센스: 윤기가 더 강하다. 많이 바르면 기름져 보인다</li><li>미스트 에센스: 뿌리는 형태. 가장 가볍다</li></ul></li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>트리트먼트</strong>는 감을 때 쓰고 헹궈내지만, 에센스는 바르고 그대로 둔다</li><li><strong>헤어 오일</strong>보다 가볍다</li><li><strong>왁스</strong>처럼 모양을 잡진 않는다</li><li><strong>노워시 트리트먼트</strong>와 거의 같은 역할이다. 노워시는 영양에, 에센스는 결 정리와 윤기에 더 초점이 있다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>펌·염색으로 상한 머리, 끝이 부스스한 사람</li><li>드라이하면 머리가 푸석해지는 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>특별히 없다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>감고 수건으로 물기를 닦는다</li><li>손바닥에 한두 번 펌프 덜어 펴고, 끝 위주로 조금 바른다<ul><li>짧은 머리는 겉면 위주로 쓸어준다</li></ul></li><li>그대로 드라이한다<ul><li>드라이 열로부터 머리를 보호하는 역할도 한다</li></ul></li><li>마무리할 때 손에 남은 만큼만 겉면에 쓸어도 된다</li></ol><h3>주의</h3><ul><li>뿌리에 바르면 떡진다</li><li>많이 바르면 기름져 보인다</li></ul>"}, {"id": "3f1a453d2b29816f9e35e77056dba514", "n": "헤어 오일", "p": {"광택": "있음", "구분": "스타일링 제품", "분류": "에센스", "비적합": ["가는 모발", "직모"], "세척": "쉬움", "손질 난이도": "쉬움", "적합": ["강곱슬", "손상모"]}, "r": {"쓰는 스타일": ["3d9a453d2b2981c6bc74e69273772aae", "3d9a453d2b2981fa9f97f0e831edbd7b", "3d9a453d2b29817195d6f35744c8c8d0", "3d9a453d2b2981eaacbbef7918b92bc4", "3d9a453d2b2981d1bb21f9d7f6da805b", "3d9a453d2b2981cda817e9986ec12b79", "3d9a453d2b298157abfbeed0777c0aa7", "3d9a453d2b2981c7adf0ee976743c673", "3d9a453d2b298169b11ac764045624de", "3d9a453d2b29813595e2cdacd100c75f", "3d9a453d2b298179892fe94794324a6a", "3d9a453d2b2981c79bbde3132f2f3b92", "3d9a453d2b29812f9255d09fdce26f23", "3d9a453d2b2981159f91eea784e4305a", "3d9a453d2b2981779c34c585fe4f6fc6", "3d9a453d2b29811f85b7e06a7efc9b30", "3d7a453d2b2981af9728ee0ab8d6c934"]}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>오일 성분으로 윤기와 보습을 준다</li><li>머리카락 겉을 오일이 덮어서 수분이 덜 날아가고, 부스스한 결이 눌린다</li><li>감고 나서 바르고 헹구지 않는다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>에센스</strong>보다 무겁고 윤기가 강하다</li><li><strong>트리트먼트</strong>처럼 헹궈내지 않는다</li><li><strong>헤어 밤</strong>은 결 정리와 약간의 모양, 헤어 오일은 모양 없이 윤기와 보습만</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>곱슬이 강하거나 부스스한 머리, 끝이 상한 머리</li><li>머리가 어느 정도 길어서 끝이 건조한 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>가는 모발은 떡진다</li><li>직모는 금방 기름져 보이고 처진다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>감고 수건으로 물기를 닦는다</li><li>한두 방울을 손바닥에 펴서 끝 위주로 바른다<ul><li>짧은 머리는 한 방울이면 충분하다</li></ul></li><li>그대로 드라이한다</li><li>다 마른 뒤 부스스한 곳만 손에 남은 걸로 살짝 쓸어줘도 된다</li></ol><h3>주의</h3><ul><li>뿌리에는 바르지 않는다. 많이 바르면 기름져 보인다</li><li>바르고 왁스를 쓰면 왁스가 잘 안 잡힐 수 있다</li></ul>"}, {"id": "3f1a453d2b29811e95c7c17e9352e7b7", "n": "헤어 밤", "p": {"고정력": "약", "광택": "약간", "구분": "스타일링 제품", "분류": "밤·크림", "비적합": ["가는 모발", "직모"], "세척": "쉬움", "손질 난이도": "쉬움"}, "r": {"쓰는 스타일": ["3d9a453d2b2981c6bc74e69273772aae", "3d9a453d2b2981fa9f97f0e831edbd7b", "3d9a453d2b29817195d6f35744c8c8d0", "3d9a453d2b2981eaacbbef7918b92bc4", "3d9a453d2b2981d1bb21f9d7f6da805b", "3d9a453d2b2981cda817e9986ec12b79", "3d9a453d2b298157abfbeed0777c0aa7", "3d9a453d2b29816da0aff35e0393c2f7", "3d9a453d2b29817bb873ec64bfde21e7", "3d9a453d2b2981c68d23ef30596346bd", "3d9a453d2b2981c7adf0ee976743c673", "3d9a453d2b298169b11ac764045624de", "3d9a453d2b29813595e2cdacd100c75f", "3d9a453d2b298179892fe94794324a6a", "3d9a453d2b2981c79bbde3132f2f3b92", "3d9a453d2b29812f9255d09fdce26f23", "3d9a453d2b2981159f91eea784e4305a", "3d9a453d2b2981779c34c585fe4f6fc6", "3d9a453d2b29811f85b7e06a7efc9b30", "3d7a453d2b2981af9728ee0ab8d6c934"]}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>왁스보다 부드러운 고체 제품. 가볍게 결을 정리하고 촉촉함을 준다</li><li>손바닥 열에 금방 녹아서 바르기 쉽다</li><li>모양을 세우기보다 내린 머리를 정돈하고 잔머리·부스스함을 눌러준다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>왁스</strong>보다 고정력이 약하고 자연스럽다</li><li><strong>에센스</strong>보다는 모양을 조금 잡아준다</li><li><strong>포마드</strong>보다 광과 고정력이 약하다</li><li><strong>헤어 오일</strong>은 윤기만, 헤어 밤은 윤기와 약한 결 정리까지</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>내리는 머리, 결 정리만 원하는 사람</li><li>왁스 바른 티 나는 게 싫은 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>가는 모발은 무거워서 처지고 떡진다</li><li>직모는 모양이 안 잡히고 눌리기만 한다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>다 말린 머리, 또는 살짝 덜 마른 머리에 쓴다</li><li>조금 덜어 손바닥에서 녹인 뒤 겉면을 쓸어준다<ul><li>양은 처음엔 새끼손톱만큼</li></ul></li><li>손가락으로 결 방향대로 정리한다</li></ol><h3>주의</h3><ul><li>많이 바르면 기름져 보인다</li><li>바른 날은 감고 잔다</li></ul>"}, {"id": "3f1a453d2b2981559e09c33b27e4bd26", "n": "두피토닉", "p": {"구분": "관리 제품", "분류": "토닉", "적합": ["탈모 초기"]}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>감고 난 뒤 두피에 뿌리는 진정·청량 제품</li><li>물처럼 묽은 액체라 뿌리고 헹구지 않는다. 두피 열감과 가려움을 가라앉히고 두피를 개운하게 한다</li><li>탈모 증상 완화 기능성 표시를 받은 제품도 있다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>헤어토닉</strong>은 드라이 전 머리카락에 바르는 스타일링 제품이다. 이름만 비슷하다</li><li><strong>두피 앰플</strong>보다 가볍고 매일 쓰는 용도</li><li><strong>두피샴푸</strong>는 씻어내는 제품, 두피토닉은 씻은 뒤 남겨두는 제품</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>두피에 열감·가려움이 있는 사람, 탈모 초기</li><li>여름에 두피에 땀이 많은 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>두피에 상처가 있는 사람</li></ul></li></ul><h3>쓰는 법</h3><ol><li>머리를 감고 수건으로 물기를 닦는다</li><li>말리기 전이나 후에 두피에 뿌리고 손가락으로 톡톡 두드린다<ul><li>머리카락이 아니라 두피에 닿게 가르마를 나눠가며 뿌린다</li></ul></li><li>손가락 끝 살로 두피를 부드럽게 눌러주며 흡수시킨다</li><li>두피까지 말린다</li></ol><ul><li>매일 쓴다. 꾸준히 써야 차이가 있다</li></ul><h3>주의</h3><ul><li>두피에 상처가 있으면 따가울 수 있다</li><li>눈에 들어가지 않게 이마 쪽은 조심한다</li></ul>"}, {"id": "3f1a453d2b298118ba5ad783c940d385", "n": "컬러샴푸", "p": {"구분": "관리 제품", "분류": "샴푸"}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>색소가 든 샴푸. 감을 때마다 같은 색을 조금씩 입혀서 염색한 색을 유지한다</li><li>빨강·갈색 등 염색한 색에 맞춰 고른다</li><li>염색약처럼 머리 속까지 물들이는 게 아니라 겉에 색을 조금씩 얹는 거라, 쓰다 멈추면 다시 빠진다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>색 유지 샴푸</strong>는 색소 없이 덜 빠지게만 한다. 컬러샴푸는 색을 더 입힌다</li><li><strong>보색샴푸</strong>는 반대 색으로 원치 않는 색을 누른다. 컬러샴푸는 같은 색을 더한다</li><li><strong>염색샴푸</strong>와 다르다. 염색샴푸는 새치를 감으면서 서서히 물들이는 제품이고, 컬러샴푸는 이미 한 염색 색을 유지하는 제품이다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>빨강·갈색 같은 색으로 염색한 사람</li><li>다음 염색까지 색을 유지하고 싶은 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>염색을 안 한 머리는 쓸 이유가 없다</li><li>염색한 색과 다른 색 제품을 쓰면 색이 섞여 탁해진다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>일반 샴푸로 한 번 감아 왁스와 기름을 먼저 씻는다</li><li>컬러샴푸로 거품을 내서 머리카락 전체에 고르게 바른다</li><li>거품을 내고 몇 분 두었다가 헹군다<ul><li>처음엔 짧게 두고, 색이 모자라면 시간을 조금씩 늘린다</li></ul></li><li>트리트먼트로 마무리한다</li></ol><h3>주의</h3><ul><li>너무 오래 두면 색이 진하게 물들 수 있다</li><li>매일 쓰기보다 일반 샴푸와 번갈아 쓴다</li><li>손·수건에 색이 묻을 수 있다. 바로 씻는다</li></ul>"}, {"id": "3f1a453d2b298152a72ad0e71a71f283", "n": "두피샴푸", "p": {"구분": "관리 제품", "분류": "샴푸", "적합": ["탈모 초기"]}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>두피의 피지·각질 세정에 초점을 맞춘 샴푸. 시원한 느낌이 나는 제품이 많다</li><li>두피에 피지와 왁스 찌꺼기가 쌓이면 냄새·가려움·뾰루지가 생기고 머리가 빨리 떡진다. 두피샴푸는 이걸 씻어내는 데 집중한다</li><li>멘톨 같은 쿨링 성분이 들어간 제품이 많아서 감으면 화하다. 시원하다고 더 잘 씻기는 건 아니다</li></ul><h3>비슷한 제품과 차이</h3><ul><li>일반 샴푸보다 세정력이 강한 편</li><li><strong>모발샴푸</strong>와 반대로 머리카락 보호보다 두피 쪽이다</li><li><strong>탈모샴푸</strong>는 탈모 증상 완화 기능성 표시를 받은 제품이고, 두피샴푸는 그냥 두피 세정용이다</li><li><strong>딥클렌징 샴푸</strong>는 더 강하게 한 번 싹 씻어내는 용도, 두피샴푸는 매일 쓰는 용도</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>두피가 기름지거나 냄새·가려움이 있는 사람, 왁스를 매일 쓰는 사람</li><li>오후만 되면 머리가 떡지는 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>건조한 두피는 매일 쓰면 당길 수 있다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>미지근한 물로 두피까지 충분히 적신다<ul><li>물로만 1분 헹궈도 먼지와 왁스가 꽤 빠진다</li></ul></li><li>샴푸를 머리에서 거품을 낸 뒤 두피에 올린다</li><li>두피에 거품을 올리고 1~2분 문지른 뒤 헹군다<ul><li>손톱이 아니라 손가락 끝 살로 문지른다</li></ul></li><li>미끈거림이 없을 때까지 충분히 헹군다<ul><li>덜 헹구면 남은 샴푸가 가려움과 뾰루지를 만든다</li></ul></li><li>두피까지 바로 말린다</li></ol><h3>주의</h3><ul><li>머리카락 끝이 상했다면 모발 관리는 따로 한다</li><li>뜨거운 물은 두피를 더 기름지게 하고 건조하게 만든다. 미지근한 물로 감는다</li></ul>"}, {"id": "3f1a453d2b29818ebc3ce06475edb6a6", "n": "모발샴푸", "p": {"구분": "관리 제품", "분류": "샴푸", "적합": ["손상모"]}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>머리카락의 손상·건조를 덜어주도록 만든 순한 샴푸. 보습 성분이 많다</li><li>펌·염색으로 상한 머리는 일반 샴푸로 감으면 더 뻣뻣하고 엉킨다. 모발샴푸는 세정을 순하게 하고 감은 뒤 결이 부드럽게 만든다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>두피샴푸</strong>와 반대로 두피보다 머리카락 쪽이다</li><li>일반 샴푸보다 순하다</li><li><strong>트리트먼트</strong>는 감은 뒤 영양을 넣는 제품이다. 모발샴푸는 씻는 단계에서 덜 상하게 하는 제품이라 같이 쓰면 좋다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>펌·염색·탈색을 반복한 머리</li><li>감고 나면 머리가 뻣뻣하고 빗질이 안 되는 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>기름진 두피는 세정력이 모자랄 수 있다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>미지근한 물로 충분히 적신다</li><li>거품을 내서 두피는 똑같이 문지르고, 머리카락은 거품으로 쓸어내리듯 감는다<ul><li>머리카락끼리 비비면 상한 머리가 더 상한다</li></ul></li><li>충분히 헹군다</li><li>트리트먼트나 린스로 마무리한다</li></ol><h3>주의</h3><ul><li>두피가 기름지면 두피샴푸와 번갈아 쓴다</li><li>왁스를 많이 쓴 날은 두 번 감는다</li></ul>"}, {"id": "3f1a453d2b298107a2c4d563c2a721a9", "n": "비듬샴푸", "p": {"구분": "관리 제품", "분류": "샴푸"}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>비듬과 가려움을 줄여주는 성분이 든 샴푸</li><li>비듬은 두피 각질이 떨어져 나오는 것이다. 두피 곰팡이균이 많아지면 비듬이 심해지는데, 비듬샴푸는 이걸 줄이는 성분이 들어 있다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>두피샴푸</strong>는 두피를 깨끗하게 씻는 데 초점, 비듬샴푸는 비듬 원인을 겨냥한다</li><li><strong>두피 스케일러</strong>는 쌓인 각질을 불려서 벗겨내는 제품이다. 비듬샴푸는 비듬이 생기는 걸 줄이는 제품이다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>비듬이 눈에 보이는 사람</li><li>어깨에 하얀 가루가 떨어지거나 두피가 계속 가려운 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>비듬이 없으면 굳이 쓸 필요 없다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>미지근한 물로 두피까지 충분히 적신다</li><li>두피에 거품을 올리고 잠시 두었다가 헹군다<ul><li>성분이 두피에 닿아 있어야 효과가 있다. 바로 헹구지 않는다</li></ul></li><li>충분히 헹구고 두피까지 바로 말린다<ul><li>두피가 젖은 채로 있으면 비듬이 더 심해진다</li></ul></li><li>좋아지면 일반 샴푸와 번갈아 쓴다</li></ol><h3>주의</h3><ul><li>써도 계속 심하면 지루성 두피염일 수 있다. 피부과로</li><li>손톱으로 긁지 않는다. 두피에 상처가 나면 더 심해진다</li></ul>"}, {"id": "3f1a453d2b2981989b3bd44148f66028", "n": "딥클렌징 샴푸", "p": {"구분": "관리 제품", "분류": "샴푸"}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>쌓인 제품과 피지를 한 번에 강하게 씻어내는 샴푸</li><li>왁스·포마드·스프레이를 매일 쓰면 평소 샴푸로는 다 안 빠지고 조금씩 쌓인다. 쌓이면 머리가 무겁고 빨리 떡지고, 펌·염색약도 잘 안 먹는다. 이걸 한 번에 벗겨내는 용도다</li></ul><h3>비슷한 제품과 차이</h3><ul><li>일반 샴푸·<strong>두피샴푸</strong>보다 세정력이 강하다</li><li>매일 쓰는 게 아니라 종종 쓴다.</li><li><strong>두피 스케일러</strong>는 감기 전에 따로 발라 두피 각질을 불리는 제품. 딥클렌징 샴푸는 감으면서 머리카락과 두피의 잔여물을 같이 씻는다</li><li><strong>약산성 샴푸</strong>와 반대쪽. 순함보다 세정력이다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>왁스·포마드·스프레이를 매일 쓰는 사람.</li><li>모발에 유분이 금방 쌓이는 사람.</li><li>펌·염색 전날 감으면 약이 잘 먹는다</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>두피가 예민하거나 건조한 사람</li></ul></li></ul><h3>쓰는 법</h3><ol><li>주 1~2회, 평소 샴푸 대신 쓴다</li><li>미지근한 물로 충분히 적신다</li><li>거품을 내서 두피와 머리카락 전체를 꼼꼼히 감는다</li><li>충분히 헹군다</li><li>트리트먼트나 린스로 마무리한다<ul><li>세정력이 강해서 감고 나면 머리가 뻣뻣할 수 있다</li></ul></li></ol><h3>주의</h3><ul><li>매일 쓰면 두피가 건조해지고 자극이 생긴다</li><li>염색한 머리는 색이 빨리 빠질 수 있다</li></ul>"}, {"id": "3f1a453d2b2981b8984dc98b8206623a", "n": "탈모샴푸", "p": {"구분": "관리 제품", "분류": "샴푸", "적합": ["탈모 초기"]}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>「탈모 증상 완화」 기능성 표시를 받은 샴푸</li><li>식약처에서 탈모 증상 완화 기능성을 인정받은 성분이 들어 있다. 포장에 「기능성 화장품」 표시가 있는지 보면 된다</li><li>‘빠지는 걸 늦추고 두피 환경을 정리하는 데’까지다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>두피샴푸</strong>는 그냥 두피 세정용, 탈모샴푸는 기능성 인정을 받은 제품</li><li>머리를 나게 하는 제품은 아니다. 증상 완화와 두피 환경까지다</li><li><strong>두피토닉·두피 앰플</strong>은 감고 나서 두피에 남겨두는 제품이다. 탈모샴푸와 같이 쓰면 좋다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>탈모가 신경 쓰이기 시작한 사람에게 적합.</li><li>감을 때 빠지는 머리가 늘었거나 정수리·이마 라인이 신경 쓰이는 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>특별히 없다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>미지근한 물로 두피까지 충분히 적신다</li><li>두피에 거품을 올리고 몇 분 두었다가 헹군다.<ul><li>너무 오래 방치하지 않는다 길어도 5분</li><li>손가락 끝 살로 두피를 부드럽게 문지른다</li></ul></li><li>충분히 헹구고 두피까지 바로 말린다</li><li>꾸준히 써야 한다. 한두 번 써서는 차이가 없다</li></ol><h3>주의</h3><ul><li>치료가 아니다. 진행 중이면 병원을 같이 간다</li></ul>"}, {"id": "3f1a453d2b2981c080e9efaebe475502", "n": "약산성 샴푸", "p": {"구분": "관리 제품", "분류": "샴푸"}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>두피와 비슷한 약산성으로 만든 순한 샴푸</li><li>두피와 머리카락은 원래 약산성이다. 일반 샴푸는 알칼리 쪽이라 감고 나면 두피가 당기고 머리카락 겉이 들뜰 수 있다. 약산성 샴푸는 이게 덜하다</li><li>거품이 적게 나는 제품이 많다. 거품이 적다고 덜 씻기는 건 아니다</li></ul><h3>비슷한 제품과 차이</h3><ul><li>일반 샴푸보다 자극이 적고, 세정력은 약한 편</li><li><strong>딥클렌징 샴푸</strong>와 반대쪽</li><li><strong>모발샴푸</strong>는 머리카락 보호, 약산성 샴푸는 두피와 머리카락 둘 다 순하게</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>두피가 예민하거나 건조한 사람에게 적합</li><li>펌·염색한 머리를 오래 유지하고 싶은 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>왁스·포마드를 매일 많이 쓰는 사람은 덜 씻긴다</li></ul></li></ul><h3>쓰는 법</h3><ul><li>일반 샴푸와 같다<ol><li>미지근한 물로 충분히 적신다</li><li>거품을 내서 두피를 손가락 끝 살로 문지른다</li><li>충분히 헹군다</li></ol></li></ul><h3>주의</h3><ul><li>왁스·포마드를 많이 쓰면 덜 씻긴다. 그런 날은 두 번 감는다</li></ul>"}, {"id": "3f1a453d2b2981f5ad4dc09524dd30f5", "n": "드라이 샴푸", "p": {"구분": "관리 제품", "분류": "샴푸"}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>물 없이 뿌려서 기름기를 빨아들이는 스프레이·가루</li><li>말이 샴푸지 세정력은 없다.</li><li>고운 가루가 뿌리 쪽 기름을 흡수해서 떡진 머리가 잠깐 보송해진다</li></ul><h3>비슷한 제품과 차이</h3><ul><li>샴푸를 대신하지 못한다. 기름을 가리는 것이지 씻는 게 아니다</li><li>가루가 머리끼리 살짝 붙어서 볼륨도 조금 산다</li><li><strong>가스 스프레이(텍스처)</strong>도 볼륨을 주지만 기름을 빨아들이진 않는다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>급하게 나가야 할 때</li><li>운동 후나 밤샘 뒤처럼 감을 시간이 없을 때</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>감는 대신 매일 쓰려는 사람</li></ul></li></ul><h3>쓰는 법</h3><ol><li>머리에서 한 뼘 정도 떨어져서 떡진 뿌리에 뿌린다<ul><li>가르마를 나눠가며 뿌리 쪽에만</li></ul></li><li>1~2분 기다려 기름을 빨아들이게 둔다</li><li>손가락으로 뿌리를 문지른 뒤 털어낸다<ul><li>덜 털면 하얀 가루가 남는다</li></ul></li><li>필요하면 드라이로 방향을 다시 잡는다</li></ol><h3>주의</h3><ul><li>두피에 쌓이니 그날 꼭 감는다</li><li>검은 머리에 많이 뿌리면 하얗게 티 난다</li></ul>"}, {"id": "3f8a453d2b2981b6a079c0b07111a922", "n": "색 유지 샴푸", "p": {"구분": "관리 제품", "분류": "샴푸"}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>염색한 색이 덜 빠지게 순하게 만든 샴푸. 색소는 들어 있지 않다</li><li>염색한 색은 감을 때마다 조금씩 빠진다. 세정력이 강할수록 더 빨리 빠진다. 색 유지 샴푸는 세정을 순하게 해서 빠지는 속도를 늦춘다</li><li>「컬러 케어 샴푸」라고도 쓴다</li></ul><h3>비슷한 제품과 차이</h3><ul><li>일반 샴푸는 세정력 때문에 색을 빼낼 수 있다. 색 유지 샴푸는 색을 지키는 쪽으로 만든다</li><li><strong>보색샴푸·컬러샴푸</strong>는 색소가 들어 있어서 색을 누르거나 더한다. 색 유지 샴푸는 색소 없이 덜 빠지게만 한다</li><li><strong>모발샴푸</strong>도 순하지만 색 유지가 목적은 아니다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>염색한 사람. 색이 금방 빠져서 고민인 사람</li><li>애쉬·블루블랙처럼 금방 빠지는 색을 한 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>염색을 안 한 머리는 쓸 이유가 없다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>미지근한 물로 충분히 적신다<ul><li>뜨거운 물은 색을 더 빼낸다</li></ul></li><li>거품을 내서 두피는 손가락 끝 살로 문지르고, 머리카락은 거품으로 쓸어내리듯 감는다</li><li>충분히 헹군다</li><li>트리트먼트로 마무리한다</li></ol><h3>주의</h3><ul><li><strong>딥클렌징 샴푸</strong>와 같이 쓰면 색이 빨리 빠진다</li></ul>"}, {"id": "3f8a453d2b2981c5a538f03c91fe2b63", "n": "보색샴푸", "p": {"구분": "관리 제품", "분류": "샴푸"}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>보라·파랑 색소가 든 샴푸. 탈색 머리의 누런 기운을 잡는다</li><li>탈색하면 시간이 지나면서 노란·주황 기운이 올라온다. 색은 반대 색을 섞으면 눌린다. 노랑의 반대가 보라, 주황의 반대가 파랑이다<ul><li>보라샴푸: 노란 기운을 누른다</li><li>파랑샴푸: 주황 기운을 누른다</li></ul></li><li>「보라샴푸」라고도 부른다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>색 유지 샴푸</strong>는 색소 없이 덜 빠지게만 한다. 보색샴푸는 색소로 원치 않는 색을 누른다</li><li><strong>컬러샴푸</strong>는 같은 색을 더 입힌다. 보색샴푸는 반대 색으로 누른다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>탈색한 사람. 애쉬·화이트·실버처럼 노란 기운이 빠져야 하는 색</li><li>탈색 후 머리가 누렇게 뜬 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>탈색 안 한 어두운 머리는 효과가 거의 없다</li><li>빨강·주황 계열로 염색한 머리는 색이 탁해진다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>일반 샴푸로 한 번 감아 왁스와 기름을 먼저 씻는다</li><li>보색샴푸로 거품을 내서 머리카락 전체에 고르게 바른다</li><li>거품을 내고 몇 분 두었다가 헹군다<ul><li>처음엔 짧게 두고, 노란 기운이 남으면 시간을 조금씩 늘린다</li></ul></li><li>트리트먼트로 마무리한다</li></ol><h3>주의</h3><ul><li>너무 오래 두면 색이 물들 수 있다. 밝은 탈색모는 보라빛이 돈다</li><li>매일 쓰기보다 일반 샴푸와 번갈아 쓴다</li><li>손에 색이 묻을 수 있다. 바로 씻는다</li></ul>"}, {"id": "3f8a453d2b298152b567d20ce668a496", "n": "염색샴푸", "p": {"구분": "관리 제품", "분류": "샴푸", "적합": ["새치"]}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>감으면서 새치를 서서히 물들이는 샴푸. 검정·갈색이 많다</li><li>염색 성분이 들어 있어서 감을 때마다 새치에 색이 조금씩 올라간다. 한 번에 물드는 게 아니라 여러 번 감아야 어두워진다</li><li>미용실 가기 전까지 새치를 덜 보이게 버티는 용도다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>새치커버</strong>(미용실 시술)는 한 번에 고르게 덮는다. 염색샴푸는 집에서 여러 번에 걸쳐 옅게 물든다</li><li><strong>컬러샴푸</strong>는 이미 염색한 색을 유지하는 제품이다. 염색샴푸는 새치를 물들이는 제품이다</li><li>쓰다 멈추면 새로 나는 새치는 다시 하얗게 올라온다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>새치가 조금씩 보이기 시작한 사람</li><li>미용실 새치커버 사이에 티 나는 게 신경 쓰이는 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>탈색했거나 밝은 색으로 염색한 사람. 색이 어둡게 덮인다</li><li>염색약에 피부가 예민한 사람</li></ul></li></ul><h3>쓰는 법</h3><ol><li>처음 쓸 땐 팔 안쪽에 조금 발라 하루 지켜본다<ul><li>염색 성분이라 피부가 붓거나 가려우면 쓰지 않는다</li></ul></li><li>미지근한 물로 충분히 적신다</li><li>거품을 내서 새치가 있는 곳 위주로 머리카락 전체에 고르게 바른다</li><li>제품에 적힌 시간만큼 두었다가 헹군다<ul><li>충분히 헹궈야 두피에 색이 안 남는다</li></ul></li><li>원하는 만큼 어두워질 때까지 매일 또는 이틀에 한 번 쓴다</li></ol><h3>주의</h3><ul><li>손·손톱·욕실·수건에 색이 물들 수 있다. 장갑을 끼거나 바로 씻는다</li><li>이마·귀 주변 피부에 묻으면 바로 닦는다</li><li>피부가 붓거나 가려우면 바로 그만 쓴다</li></ul>"}, {"id": "3f1a453d2b29810293ddf3d82390ab1c", "n": "컨디셔너", "p": {"구분": "관리 제품", "분류": "트리트먼트·린스"}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>감은 뒤 머리카락을 코팅하고 보습해서 엉킴과 건조함을 줄인다</li><li>샴푸로 들뜬 머리카락 겉을 매끈하게 덮고 수분이 덜 날아가게 한다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>린스</strong>와 하는 일은 사실상 같다. 컨디셔너라는 이름이 붙은 제품이 보습 성분이 조금 더 많은 경우가 많다</li><li><strong>트리트먼트</strong>보다 가볍고 바로 헹군다</li><li><strong>노워시 트리트먼트</strong>는 헹구지 않고 남겨두는 제품. 컨디셔너는 헹군다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>기장이 있거나 건조한 머리</li><li>펌·염색 뒤 머리가 푸석한 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>짧은 머리는 꼭 쓸 필요는 없다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>샴푸로 감고 헹군다</li><li>물기를 손으로 가볍게 짠다</li><li>샴푸 뒤 끝 위주로 바르고 1분 안쪽으로 두었다 헹군다<ul><li>손가락으로 빗듯이 쓸어서 퍼지게 한다</li></ul></li><li>미끈거림이 조금 남을 정도로 헹군다</li></ol><h3>주의</h3><ul><li>두피에 바르지 않는다. 덜 헹구면 떡진다</li></ul>"}, {"id": "3f1a453d2b29810abc16f79ef37d43ec", "n": "린스", "p": {"구분": "관리 제품", "분류": "트리트먼트·린스"}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>감은 뒤 머리카락 겉면을 코팅해서 엉킴을 줄이고 부드럽게 만든다</li><li>샴푸로 감으면 머리카락 겉이 들떠서 뻣뻣하고 엉킨다. 린스는 들뜬 겉을 매끈하게 덮어서 빗질이 잘 되게 한다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>컨디셔너</strong>와 하는 일은 사실상 같다. 린스는 예전부터 쓰던 말이고 컨디셔너는 영어식 이름이다. 요즘은 보습 성분을 더 넣은 제품에 컨디셔너라는 이름을 많이 붙인다</li><li><strong>트리트먼트</strong>보다 가볍고 바로 헹군다</li><li>트리트먼트는 속을 채우고, 린스는 겉을 덮는다. 둘 다 쓰면 트리트먼트 먼저</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>기장이 있어 엉키는 머리</li><li>감고 나면 머리가 뻣뻣한 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>짧은 머리는 꼭 쓸 필요는 없다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>샴푸로 감고 헹군다</li><li>물기를 손으로 가볍게 짠다</li><li>샴푸 뒤 끝 위주로 바르고 바로 헹군다<ul><li>손가락으로 빗듯이 쓸어서 퍼지게 한다</li></ul></li><li>미끈거림이 조금 남을 정도로 헹군다</li></ol><h3>주의</h3><ul><li>두피에 바르지 않는다. 덜 헹구면 떡진다</li></ul>"}, {"id": "3f1a453d2b2981d4a806cc8903c4b96c", "n": "트리트먼트", "p": {"구분": "관리 제품", "분류": "트리트먼트·린스", "적합": ["손상모"]}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>감은 뒤 바르고 몇 분 두었다 헹궈서, 상한 머리카락 속을 채워주는 제품</li><li>펌·염색을 하면 머리카락 속 단백질과 수분이 빠져서 푸석하고 엉킨다. 트리트먼트는 빠진 걸 채워서 결이 부드럽게 만든다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>린스·컨디셔너</strong>는 겉면을 코팅하고 바로 헹군다. 트리트먼트는 시간을 두고 속까지 채운다</li><li><strong>헤어팩</strong>은 트리트먼트보다 진한 집중 관리용</li><li><strong>노워시 트리트먼트</strong>는 헹구지 않는다</li><li>샴푸 → 트리트먼트 → (린스) 순서로 쓴다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>펌·염색·탈색한 머리. 열펌·매직 뒤에는 특히 필요하다 — 안 하면 끝이 부스스해진다</li><li>짧은 머리도 펌·염색했으면 쓰는 게 좋다</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>특별히 없다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>샴푸로 감고 헹군다</li><li>머리를 감고 물기를 손으로 털어낸 뒤 끝 위주로 바른다<ul><li>물기가 많으면 트리트먼트가 물에 흘러내린다</li><li>양은 짧은 머리 기준 10원 동전 정도</li></ul></li><li>손가락으로 빗듯이 쓸어서 고르게 퍼지게 한다</li><li>몇 분 두었다 헹군다<ul><li>미끈거림이 조금 남을 정도로 헹군다</li></ul></li></ol><h3>주의</h3><ul><li>두피에 바르면 떡지고 트러블이 날 수 있다</li><li>오래 둔다고 더 좋아지지 않는다. 제품에 적힌 시간만큼 둔다</li></ul>"}, {"id": "3f1a453d2b298110a904f1d755968873", "n": "헤어팩", "p": {"구분": "관리 제품", "분류": "트리트먼트·린스", "적합": ["손상모"]}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>트리트먼트보다 진한 집중 손상 관리 제품. 가끔 쓴다</li><li>통에 든 진한 크림 형태가 많다. 영양 성분이 많아서 오래 두면 상한 머리에 더 깊이 들어간다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>트리트먼트</strong>는 자주, 헤어팩은 주 1~2회 더 길게</li><li><strong>노워시 트리트먼트</strong>는 매일 남겨두는 가벼운 관리, 헤어팩은 가끔 헹궈내는 집중 관리</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>펌·염색·탈색으로 많이 상한 머리에게 잘 맞는다.</li><li>트리트먼트를 써도 끝이 계속 푸석한 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>많이 상하지 않은 머리는 트리트먼트로 충분하다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>샴푸로 감고 물기를 손으로 짠다</li><li>끝 위주로 바른다. 두피에는 바르지 않는다</li><li>바르고 몇 분에서 십여 분 둔다. 수건이나 캡으로 따뜻하게 감싸면 더 잘 스민다<ul><li>샤워할 때 머리먼저 감고 머리에 바른뒤 다른 부위를 씻어주는 시간만으로도 충분하다.</li></ul></li><li>충분히 헹군다</li></ol><h3>주의</h3><ul><li>매일 쓰면 머리가 무거워질 수 있다.</li><li>덜 헹구면 떡진다</li></ul>"}, {"id": "3f1a453d2b2981ccb783f6b3f118b128", "n": "노워시 트리트먼트", "p": {"구분": "관리 제품", "분류": "트리트먼트·린스", "적합": ["손상모"]}, "r": {"쓰는 드라이": ["3fba453d2b2981ffa33bd5b44f02fded"]}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>바르고 헹구지 않는 트리트먼트. 크림형·미스트형이 있다<ul><li>크림형: 보습이 진하다. 많이 상한 머리에</li><li>미스트형: 가볍다. 뿌리기만 하면 돼서 편하다</li></ul></li><li>머리카락에 남아서 하루 종일 보습하고, 드라이 열로부터 머리를 보호한다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>트리트먼트</strong>는 헹군다 이건 안헹군다.</li><li><strong>에센스</strong>와 비슷하지만 결 정리보다 보습·손상 관리 쪽</li><li><strong>헤어 미스트</strong>는 마른 머리에 수시로 뿌리는 가벼운 제품, 노워시는 감은 뒤 한 번 제대로 바르는 제품</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>상한 머리, 매일 드라이하는 사람에게 적합.</li><li>모발이 많이 건조하신 분</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>특별히 없다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>머리를 감고 수건으로 물기를 닦는다</li><li>감고 물기를 닦은 뒤 끝 위주로 바르고 그대로 말린다. 말리고 바르면 골고루 바르기도 힘들고 떡져 보일 수 있다.<ul><li>크림형은 손바닥에 펴서 손가락으로 빗듯이 바른다</li><li>미스트형은 한 뼘 떨어져서 머리카락에 고르게 뿌린다</li></ul></li><li>그대로 드라이한다</li></ol><h3>주의</h3><ul><li>많이 바르면 떡진다</li><li>뿌리 쪽에는 바르지 않는다</li></ul>"}, {"id": "3f1a453d2b298171835cc03eb9ac815e", "n": "두피 앰플", "p": {"구분": "관리 제품", "분류": "두피 케어", "적합": ["탈모 초기"]}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>두피에 넣는 고농축 영양 제품</li><li>작은 병에 스포이드나 노즐이 달린 경우가 많다. 몇 방울씩 두피에 직접 떨어뜨려 쓴다</li><li>헹구지 않고 두피에 남겨둔다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>두피토닉</strong>보다 진하고 집중 관리용</li><li><strong>탈모샴푸</strong>는 감으면서 씻어내는 제품, 두피 앰플은 감은 뒤 남겨두는 제품. 같이 쓰면 좋다</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>탈모가 신경 쓰이는 사람, 두피가 건조한 사람에게 적합</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>특별히 없다</li></ul></li></ul><h3>쓰는 법</h3><ol><li>머리를 감고 두피까지 말린다</li><li>감고 말린 두피에 떨어뜨리고 손가락으로 마사지한다<ul><li>정수리·이마 라인처럼 신경 쓰이는 곳에 가르마를 나눠가며 떨어뜨린다</li><li>손가락 끝 살로 1~2분 눌러주듯 마사지한다</li></ul></li><li>그대로 둔다. 헹구지 않는다</li></ol><ul><li>꾸준히 써야 한다. 한두 번으로는 차이가 없다</li></ul><h3>주의</h3><ul><li>머리를 나게 하는 약이 아니다</li><li>두피에 상처가 있으면 따가울 수 있다</li></ul>"}, {"id": "3f1a453d2b2981cc80efdcd24b6a7ed3", "n": "두피 스케일러", "p": {"구분": "관리 제품", "분류": "두피 케어"}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>감기 전에 두피에 발라 각질·피지·제품 잔여물을 불려서 빼내는 제품</li><li>젤이나 묽은 액체 형태. 두피에 바르고 몇 분 두면 굳은 각질과 피지가 불어서 샴푸할 때 잘 빠진다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>딥클렌징 샴푸</strong>는 감으면서, 스케일러는 감기 전에 따로 바른다</li><li>미용실 <strong>두피 스케일링</strong>의 집에서 하는 버전</li><li><strong>비듬샴푸</strong>는 비듬이 생기는 걸 줄이는 제품, 스케일러는 이미 쌓인 각질을 빼는 제품</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>왁스를 매일 쓰는 사람, 두피 각질이 많은 사람, 먼지가 많은 곳에서 일하시는 분.</li><li>두피에서 냄새가 나거나 감아도 개운하지 않은 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>두피에 상처가 있는 사람</li></ul></li></ul><h3>쓰는 법</h3><ol><li>마른 두피에 가르마를 나눠가며 바른다<ul><li>노즐을 두피에 대고 가르마 선을 따라 짠다</li></ul></li><li>손가락 끝 살로 두피를 부드럽게 문질러 퍼지게 한다</li><li>몇 분 둔다</li><li>샴푸한다<ul><li>미끈거림이 없을 때까지 충분히 헹군다</li></ul></li></ol><h3>주의</h3><ul><li>주 1회 정도. 두피에 상처가 있으면 쓰지 않는다</li><li>손톱으로 긁지 않는다</li></ul>"}, {"id": "3f1a453d2b2981baa24bdc3ce69bef70", "n": "헤어 미스트", "p": {"구분": "관리 제품", "분류": "기타"}, "r": {}, "h": "<h3>뭘 하는 제품인가</h3><ul><li>마른 머리에 수시로 뿌려 수분·향·정전기를 정리하는 제품</li><li>물처럼 가벼운 미스트라 언제든 뿌릴 수 있다. 머리 냄새를 가리는 향 위주 제품도 많다</li></ul><h3>비슷한 제품과 차이</h3><ul><li><strong>노워시 트리트먼트</strong>보다 가볍고 아무 때나 쓴다</li><li>고정 <strong>스프레이</strong>가 아니다. 모양은 안 잡힌다</li><li><strong>두피토닉</strong>은 두피에 뿌리는 제품, 헤어 미스트는 머리카락에 뿌리는 제품</li></ul><h3>맞는 사람 / 안 맞는 사람</h3><ul><li><strong>맞는 사람</strong><ul><li>억세고 건조하고 정전기가 많은 머리,</li><li>겨울에 머리가 붕 뜨고 정전기가 나는 사람</li></ul></li><li><strong>안 맞는 사람</strong><ul><li>얇은 모발에 뿌리면 머리가 죽을 수 있다.</li></ul></li></ul><h3>쓰는 법</h3><ol><li>멀리서 뿌리고 손으로 쓸어준다<ul><li>한 뼘 이상 떨어져서 머리카락 겉면에 고르게</li></ul></li><li>부스스한 곳은 손바닥으로 눌러 결을 정리한다</li></ol><ul><li>외출 전이나 낮에 머리가 건조할 때 수시로 쓴다</li></ul><h3>주의</h3><ul><li>향이 강한 제품은 두피에 직접 뿌리지 않는다</li><li>많이 뿌리면 머리가 젖어서 모양이 무너진다</li></ul>"}], "Y": [{"id": "3fba453d2b2981ffa33bd5b44f02fded", "n": "1. 기본 말리기", "p": {"구분": "기본", "손질 난이도": "쉬움", "순서": 1}, "r": {"쓰는 스타일": ["3d9a453d2b2981c6bc74e69273772aae", "3d9a453d2b2981fa9f97f0e831edbd7b", "3d9a453d2b29817195d6f35744c8c8d0", "3d9a453d2b2981eaacbbef7918b92bc4", "3d9a453d2b2981d1bb21f9d7f6da805b", "3d9a453d2b2981cda817e9986ec12b79", "3d9a453d2b298157abfbeed0777c0aa7", "3d9a453d2b29812f9255d09fdce26f23", "3d9a453d2b2981f98da5dabb4369df5d", "3d9a453d2b2981c79bbde3132f2f3b92", "3d9a453d2b298179892fe94794324a6a", "3d9a453d2b298169b11ac764045624de", "3d9a453d2b29813595e2cdacd100c75f", "3d9a453d2b2981c7adf0ee976743c673", "3d9a453d2b29816da0aff35e0393c2f7", "3d9a453d2b29817bb873ec64bfde21e7", "3d9a453d2b2981c68d23ef30596346bd", "3d9a453d2b29813f9f3bfa02ea155e67", "3d9a453d2b2981159f91eea784e4305a", "3d9a453d2b2981779c34c585fe4f6fc6", "3d9a453d2b29811f85b7e06a7efc9b30", "3d7a453d2b2981af9728ee0ab8d6c934"], "쓰는 제품": ["3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b29813cab36fa8be6ec6d95", "3f1a453d2b2981ccb783f6b3f118b128"]}, "h": "<h3>언제 쓰나</h3><ul><li>모든 드라이의 시작. 2번부터는 전부 이 위에 얹는다</li><li>원리<ul><li>머리는 마르는 순간의 모양으로 굳는다. 젖어 있을 때 방향을 잡고, 마르면서 그 방향대로 고정된다(젖었을 때 모자를 쓰고 기다려봐라, 그렇게 머리가 마르면 그 머린 다시 감을 때 까지 유지될것이다.)</li><li>뜨거운 바람으로 모양을 만들고, 식으면서 고정된다.(찬바람도 가능)</li><li>바람은 뿌리에서 끝 방향으로 보낸다. 끝에서 뿌리 쪽으로 쏘면 겉이 들떠서 부스스해진다</li></ul></li></ul><h3>쓰는 제품</h3><ul><li><strong>헤어토닉</strong> — 드라이 전 기초</li><li>상한 머리는 <strong>에센스</strong>나 <strong>노워시 트리트먼트</strong>를 끝에 조금</li></ul><h3>순서</h3><ol><li>수건으로 비비지 말고 꾹꾹 눌러 물기를 뺀다(비비면 모발이 손상된다. 하지만 남자는 모발이 짧기 때문에 귀찮으면 비벼도 된다.)</li><li>두피부터 말린다<ul><li>뿌리 방향이 여기서 정해진다. 끝만 말리면 뿌리가 눌린 채로 굳는다</li><li>앞머리가 먼저 보이는 쪽이라 중요하다. 방향을 잡을 거면 앞머리부터 손댄다. 나머지는 숱 많은 뒤통수·옆부터 말린다</li></ul></li><li>드라이기는 머리에서 한 뼘 정도 떨어뜨리고 계속 움직인다<ul><li>노즐(드라이기 앞에 끼우는 납작한 입구)을 끼우면 바람이 한 곳으로 모여 방향이 잘 잡힌다</li></ul></li><li>80~90% 마르면 원하는 방향을 잡는다 — 부위별로 2~10번</li><li>완전히 마른 뒤 제품을 바른다</li></ol><h3>자주 하는 실수</h3><ul><li>덜 말리고 왁스 바르기 — 금방 무너지고 떡진다. 젖은느낌 할 게 아니면 다 마르고 발라야한다.</li><li>안식힌다 — 모양이 금방 풀린다</li><li>드라이기를 머리에 붙이거나 한 곳에 오래 대기 — 머리가 상한다</li><li>자연 방치로 반쯤 말린 뒤 드라이하기 — 뿌리가 이미 눌린 방향으로 굳어서 되돌리기 어렵다.(물 다시 묻히면 된다.)</li><li>두피 덜 말리기. - 비듬이 생길 수 있다. 잘 말려줘야한다.</li></ul>"}, {"id": "3fba453d2b29812cab4afb0f0ccc3931", "n": "2. 앞머리 볼륨", "p": {"구분": "앞머리", "비적합": ["좁은 이마", "굵은 모발", "강곱슬"], "손질 난이도": "보통", "순서": 2, "적합": ["넓은 이마", "직모", "앞머리가 앞으로 쏟아짐"]}, "r": {"쓰는 스타일": ["3d7a453d2b2981af9728ee0ab8d6c934", "3d9a453d2b2981159f91eea784e4305a", "3d9a453d2b2981c68d23ef30596346bd", "3d9a453d2b29817bb873ec64bfde21e7", "3d9a453d2b29816da0aff35e0393c2f7", "3d9a453d2b2981f98da5dabb4369df5d", "3d9a453d2b2981fa9f97f0e831edbd7b", "3d9a453d2b29817195d6f35744c8c8d0"], "쓰는 제품": ["3f1a453d2b2981af9b4fc368b534b1bb", "3f6a453d2b298109bb9feddcc14afc17", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b29813e96afdd83d89b2950", "3f1a453d2b2981e984decca70a341880"]}, "h": "<h3>언제 쓰나</h3><ul><li>내리는 머리스타일에서 푹 꺼진 부분을 살려주는 드라이.</li><li>이마가 없어보이는 걸 방지하기위해 볼륨을 살려주는 드라이</li></ul><h3>쓰는 제품</h3><ul><li>드라이 전: <strong>헤어토닉</strong>, 가는 모발은 <strong>무스</strong></li><li>뿌리 고정: <strong>가스 스프레이</strong></li><li>마무리: <strong>매트 왁스</strong>· <strong>하드 왁스</strong>, 액상<strong> 스프레이</strong></li></ul><h3>순서</h3><ol><li>앞머리는 젖은 상태로 둔다. 이미 말랐으면 물을 뿌려 다시 적신다</li><li>헤어라인에서 1cm 정도는 내리고 그 윗머리를 뿌리를 푹 꺼지지 않고 살려주는 느낌으로 역방향(앞에서 뒤로)으로 말려준다.(주의할 점은 너무 한곳에 오래있으면 그대로 갈라질 수 있기 때문에 잘 돌려가며 자연스럽게 세워준다.)<ul><li>롤빗이나 여자들이 하고 다니는 헤어롤로 머리를 번쩍 위로 들어 머리를 말지말고 뿌리만 바람을 주는 방식도 괜찮다. 하지만 갈라지기 아주 좋은 방식이다 드라이를 잘 하면은 이 방법이 더 확실하다.</li></ul></li><li>왁스나 스프레이로 머리를 아래로 잡아 당기지 말고 살려가며 모양을 잡아주면 된다.</li></ol><h3>자주 하는 실수</h3><ul><li>앞머리가 다 마른 뒤에 세우려 하기 — 이미 굳어서 안 선다. 뿌리가 서지않고, 옆으로 퍼질 가능성이 높다.</li><li>뿌리에 왁스를 많이 바르기 — 많이 바른다고 능사가 아니다 떡져보일 수 있다.</li></ul>"}, {"id": "3fba453d2b2981f1ba0ec67332a03ccf", "n": "3. 앞머리 내리기", "p": {"구분": "앞머리", "손질 난이도": "보통", "순서": 3}, "r": {"쓰는 제품": ["3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b2981e984decca70a341880"]}, "h": "<h3>언제 쓰나</h3><ul><li>가르마를 타고 앞머리를 한쪽으로 비스듬히 내리는 머리 — 숏가일컷, 드롭컷, 필러스컷</li><li>앞머리를 일자로 다 내리는 머리와 다르다. 가르마 쪽 뿌리는 살짝 서고, 앞머리는 한쪽으로 흐르며 이마를 사선으로 덮는다</li></ul><h3>쓰는 제품</h3><ul><li>드라이 전: <strong>헤어토닉</strong></li><li>마무리: <strong>매트 왁스</strong> 아주 조금, 고정은 <strong>가스 스프레이</strong></li></ul><h3>순서</h3><ol><li>앞머리를 완전히 적시고 빗으로 가르마 위치를 나눈다<ul><li>원래 갈라지는 자리를 쓰면 제일 쉽다</li></ul></li><li>넘어가는 쪽 앞머리를 반대 방향으로 넘겨 뿌리부터 말린다(반대로 말리기)<ul><li>가르마 쪽 뿌리가 살짝 서야 앞머리가 납작하게 붙지 않는다</li></ul></li><li>반쯤 마르면 앞머리를 넘어가는 쪽으로 비스듬히 내려 빗고, 위에서 아래·바깥 방향으로 바람을 준다<ul><li>손가락을 이마와 앞머리 사이에 살짝 넣고 말린다. 이마에 딱 붙으면 떡져 보인다</li></ul></li><li>앞머리 끝은 손가락이나 롤빗으로 안쪽으로 둥글게(C자) 말며 말린다<ul><li>끝이 바깥으로 뻗으면 어색하다</li></ul></li><li>가르마 반대쪽 옆머리는 위에서 아래로 눌러 차분하게 둔다</li><li>찬바람으로 고정한다</li><li>왁스는 손에 아주 조금만 묻혀 앞머리 끝만 집어 결을 정리한다<ul><li>가닥이 나뉘면서 숱 사이로 이마가 살짝 보여야 답답하지 않다</li></ul></li></ol><h3>자주 하는 실수</h3><ul><li>앞머리를 일자로 다 내려 이마에 붙이기 — 답답하고 떡져 보인다</li><li>가르마 쪽 뿌리를 눌러 말리기 — 앞머리가 납작해지고 정수리까지 꺼져 보인다</li><li>끝이 바깥으로 뻗은 채 두기 — 앞머리 선이 어색해진다</li><li>앞머리에 왁스를 많이 바르기 — 뭉치고 갈라진다</li><li>이마 기름을 그대로 두기 — 오후에 앞머리가 갈라진다. 이마 기름을 닦는다</li></ul>"}, {"id": "3fba453d2b2981e4b783cad65072b611", "n": "4. 가르마", "p": {"구분": "넘기는 머리", "비적합": ["앞머리가 앞으로 쏟아짐", "넓은 이마"], "손질 난이도": "보통", "순서": 4, "적합": ["M자 이마", "앞머리에 가마 있음"]}, "r": {"쓰는 스타일": ["3d9a453d2b29817195d6f35744c8c8d0", "3d9a453d2b2981779c34c585fe4f6fc6", "3d9a453d2b29812f9255d09fdce26f23", "3d9a453d2b29813595e2cdacd100c75f", "3d9a453d2b2981eaacbbef7918b92bc4"], "쓰는 제품": ["3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b298142a158e3793eb948a3", "3f1a453d2b2981e984decca70a341880"]}, "h": "<h3>언제 쓰나</h3><ul><li>앞머리를 가운데쯤에서 갈라 양옆으로 넘기는 머리. 가르마펌·애즈펌처럼 앞머리가 양쪽으로 흘러내리고 그 사이로 이마가 살짝 보이는 머리</li><li>한쪽으로만 넘기는 머리와 다르다. 앞머리가 좌우 두 갈래로 나뉜다</li></ul><h3>쓰는 제품</h3><ul><li>드라이 전: <strong>헤어토닉</strong></li><li>마무리: <strong>매트 왁스</strong>나 하드 왁스, 가스(액상)<strong> 스프레이</strong></li></ul><h3>순서</h3><ol><li>앞머리를 완전히 적시고 빗으로 가르마 위치를 나눈다<ul><li>원래 갈라지는 자리 근처에서 고르면 덜 싸운다. 5:5나 6:4가 많다</li></ul></li><li>앞머리를 앞으로 내려 빗은 채 뿌리를 먼저 말린다<ul><li>뿌리가 이마 쪽으로 살짝 서야 양옆으로 넘겼을 때 가르마 자리가 납작하게 갈라지지 않는다</li></ul></li><li>반쯤 마르면 가르마를 기준으로 한쪽씩 옆·뒤 방향으로 쓸어 넘기며 말린다<ul><li>손가락이나 롤빗으로 앞머리를 감싸 바깥쪽으로 둥글게(C자) 흘러가게 말린다. 끝이 얼굴 바깥으로 빠져야 한다</li></ul></li><li>가르마 선 바로 옆 뿌리는 손가락으로 살짝 들어 올린 채 바람을 준다<ul><li>가르마 자리에 볼륨이 있어야 두피가 덜 보인다</li></ul></li><li>거울 보며 좌우 높이와 흐름을 맞춘다</li><li>찬바람으로 고정한다</li><li>펌 앞머리면 끝을 손으로 말아 쥐어 컬을 정리한다</li></ol><h3>자주 하는 실수</h3><ul><li>가르마 선을 납작하게 눌러 말리기 — 가르마가 갈라져 두피가 보이고 정수리까지 꺼져 보인다</li><li>앞머리를 옆으로 눌러서만 말리기 — 볼륨 없이 이마에 붙어 처진다</li><li>좌우 높이가 다르게 말리기 — 한쪽만 떠서 어색하다</li><li>앞머리에 왁스를 많이 바르기 — 무거워서 가운데로 쏟아진다</li></ul>"}, {"id": "3fba453d2b29817e8972c87bfeecef61", "n": "5. 올백", "p": {"구분": "넘기는 머리", "손질 난이도": "보통", "순서": 5}, "r": {"쓰는 제품": ["3f1a453d2b2981af9b4fc368b534b1bb", "3f6a453d2b298109bb9feddcc14afc17", "3f1a453d2b298142a158e3793eb948a3", "3f1a453d2b298103a960f9250cf86318", "3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b29813e96afdd83d89b2950", "3f1a453d2b2981e984decca70a341880"]}, "h": "<h3>언제 쓰나</h3><ul><li>앞머리 전체를 뒤로 넘기는 머리 — 슬릭백, 아이비리그, 리젠트<ul><li>슬릭백: 붙여서 광 있게 넘긴다</li><li>아이비리그: 앞머리를 짧게 살짝 세워 옆·뒤로 넘긴다</li><li>리젠트: 앞머리를 높게 세워 볼륨을 크게 만들고 뒤로 넘긴다</li></ul></li></ul><h3>쓰는 제품</h3><ul><li>드라이 전: <strong>헤어토닉</strong>, 볼륨이 필요하면 <strong>무스</strong></li><li>마무리<ul><li>슬릭백: <strong>포마드</strong>, 젖은 질감은 <strong>헤어 젤</strong></li><li>아이비리그·리젠트: <strong>매트 왁스</strong>·<strong>하드 왁스</strong></li></ul></li><li>고정: <strong>가스 스프레이</strong></li></ul><h3>순서</h3><ol><li>젖은 머리 전체를 빗으로 뒤로 빗는다</li><li>앞머리는 앞으로 끌어당긴 채 뿌리를 먼저 말린다(반대로 말리기)</li><li>앞머리를 뒤로 넘기며 뿌리를 들어 말린다. 스타일마다 높이가 다르다<ul><li>슬릭백: 이마 위가 살짝만 뜰 정도</li><li>아이비리그: 손가락 한두 마디 높이로 세워 옆·뒤로 흘린다</li><li>리젠트: 롤빗으로 앞머리를 크게 말아 올려 높게 세운다. 높이와 앞쪽 곡선이 이 머리의 핵심이다</li></ul></li><li>윗머리는 빗을 뿌리에 대고 뒤로 빗으면서, 빗 바로 뒤를 따라 바람을 준다</li><li>옆머리는 뒤쪽 아래로 비스듬히 빗으며 눌러 말린다<ul><li>옆이 뜨면 머리가 둥글게 부풀어 커 보인다</li></ul></li><li>정수리·뒤는 결 따라 아래로 말린다</li><li>찬바람으로 고정하고 제품을 바른다<ul><li>수성 포마드는 살짝 덜 마른 상태에 발라도 된다</li><li>리젠트는 앞머리 높이가 무너지지 않게 뿌리 안쪽부터 바르고 가스 스프레이로 마무리한다</li></ul></li></ol><h3>자주 하는 실수</h3><ul><li>이마 쪽까지 완전히 붙이기 — 떡진 느낌이 난다</li><li>옆을 안 누르기 — 머리가 둥글게 부푼다</li><li>빗질 없이 손으로만 넘기기 — 결이 흩어진다</li><li>앞머리가 다 마른 뒤 세우려 하기 — 리젠트·아이비리그 높이가 안 나온다</li></ul>"}, {"id": "3fba453d2b29816683f8cb643de07d6e", "n": "6. 정수리·윗머리 볼륨", "p": {"구분": "윗머리·뒷머리", "손질 난이도": "보통", "순서": 6, "적합": ["정수리 납작", "숱 적음"]}, "r": {"쓰는 제품": ["3f6a453d2b298109bb9feddcc14afc17", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b2981e984decca70a341880"]}, "h": "<h3>언제 쓰나</h3><ul><li>정수리가 납작하거나, 윗머리 볼륨이 필요한 머리, 숱이 적어 정수리가 꺼져 보이는 사람</li></ul><h3>쓰는 제품</h3><ul><li>드라이 전: <strong>무스</strong>, <strong>헤어토닉</strong></li><li>마무리: 질감용 <strong>가스 스프레이</strong>(텍스처 스프레이)</li></ul><h3>순서</h3><ol><li>고개를 숙이고 머리를 앞으로 떨어뜨린 채 뿌리부터 말린다<ul><li>뿌리가 두피 반대쪽으로 선 채 마른다</li></ul></li><li>70~80% 마르면 고개를 든다</li><li>정수리 머리를 손가락으로 집어 위로 들어 올린 채 뿌리에 열을 3초 정도 주고, 5초 정도 식힌 뒤 손을 뺀다<ul><li>구역을 옮겨가며 반복한다</li></ul></li><li>가르마가 있으면 가르마 반대 방향으로 넘겨 말렸다가 원래 방향으로 돌린다</li><li>윗머리 전체는 손가락을 갈퀴처럼 넣어 앞에서 뒤로 빗으며 뿌리에 바람을 준다</li><li>찬바람으로 고정한다</li><li>질감용 가스 스프레이를 뿌리에 뿌리고 손으로 털어준다</li></ol><h3>자주 하는 실수</h3><ul><li>젖은 정수리를 위에서 아래로 말리기 — 납작하게 붙는다</li><li>무스·왁스를 뿌리에 많이 바르기 — 무게로 꺼진다</li><li>정수리를 다 말린 뒤 세우려 하기 — 이미 굳어서 안 선다</li><li>정수리 가마 주변이 서거나 갈라지면 → 10-4</li></ul>"}, {"id": "3fba453d2b2981678835fb43ad27f9c8", "n": "7. 뒷머리 볼륨", "p": {"구분": "윗머리·뒷머리", "손질 난이도": "보통", "순서": 7, "적합": ["뒤통수 납작"]}, "r": {"쓰는 제품": ["3f6a453d2b298109bb9feddcc14afc17", "3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b2981e984decca70a341880"]}, "h": "<h3>언제 쓰나</h3><ul><li>뒤통수가 납작해서 옆에서 봤을 때 뒤가 꺼져 보이는 사람</li></ul><h3>쓰는 제품</h3><ul><li>드라이 전: <strong>무스</strong>, <strong>헤어토닉</strong></li><li>마무리: <strong>가스 스프레이</strong></li></ul><h3>순서</h3><ol><li>백탑(뒤통수 볼록한 위쪽) 머리를 손으로 들어 올리거나 아래에서 위로 거꾸로 쓸어 올리며 뿌리에 바람을 준다<ul><li>고개를 숙여 아래에서 위로 말려도 된다</li></ul></li><li>반쯤 마르면 결 방향대로 내린다</li><li>손바닥으로 뒤통수를 둥글게 감싸 모양을 잡은 채 찬바람을 준다</li><li>백·네이프(목덜미 쪽)는 위에서 아래로 눌러 말린다<ul><li>목덜미가 뜨면 뒤가 처져 보인다</li></ul></li></ol><h3>자주 하는 실수</h3><ul><li>앞만 말리고 뒤는 대충 — 뒤가 눌린 채 굳는다</li><li>거울로 안 보여서 확인을 안 하기 — 손거울로 옆·뒤를 확인한다</li></ul>"}, {"id": "3fba453d2b29810db150c9e78bcf3046", "n": "8. 옆머리 누르기", "p": {"구분": "옆머리", "손질 난이도": "쉬움", "순서": 8, "적합": ["옆머리 뜸", "큰 두상", "얼굴 큼"]}, "r": {"쓰는 제품": ["3f1a453d2b2981268b2ad0ff44c967f5", "3f1a453d2b29813e96afdd83d89b2950"]}, "h": "<h3>언제 쓰나</h3><ul><li>옆머리가 뜨는 사람. 옆이 뜨면 얼굴과 두상이 커 보인다</li></ul><h3>쓰는 제품</h3><ul><li>없이도 된다</li><li>마무리: <strong>매트 왁스</strong> 조금, 굵은 모발은 <strong>하드 왁스</strong></li></ul><h3>순서</h3><ol><li>옆머리 뿌리가 젖어 있을 때 시작한다<ul><li>마른 뒤에는 안 눌린다. 말랐으면 물로 다시 적신다</li></ul></li><li>빗을 옆머리에 대고 뒤쪽 아래 방향으로 빗으며, 빗 바로 뒤를 따라 위에서 아래로 바람을 준다<ul><li>빗 등(빗살 반대쪽)을 두피에 붙여 누르며 지나가면 더 잘 붙는다</li></ul></li><li>완전히 마를 때까지 누른다</li><li>손바닥으로 옆머리를 덮어 누른 채 찬바람을 준다</li><li>관자놀이 쪽 뜨는 부분은 왁스를 손바닥에 얇게 펴서 눌러준다</li></ol><ul><li>매일 아침 이렇게 해도 뜨면 다운펌을 한다</li></ul><h3>자주 하는 실수</h3><ul><li>옆머리를 아래에서 위로 말리기 — 더 뜬다</li><li>다 마른 뒤 누르기 — 안 눌린다</li><li>옆머리에 왁스를 바르고 위로 문지르기 — 뜬다</li></ul>"}, {"id": "3fba453d2b2981fa966df98761b94874", "n": "9. 펌 머리 말리기", "p": {"구분": "펌", "손질 난이도": "보통", "순서": 9, "적합": ["반곱슬", "강곱슬"]}, "r": {"쓰는 제품": ["3f1a453d2b2981da84d1d5a08a0ed0f6", "3f6a453d2b298109bb9feddcc14afc17", "3f1a453d2b29810a9246efec4876fc83"]}, "h": "<h3>언제 쓰나</h3><ul><li>컬이 있는 펌 머리, 곱슬</li></ul><h3>쓰는 제품</h3><ul><li><strong>컬크림</strong>, <strong>무스</strong>, <strong>워터 왁스</strong></li></ul><h3>순서</h3><ol><li>수건으로 비비지 말고 꾹꾹 눌러 짠다<ul><li>비비면 컬이 풀리고 부스스해진다</li></ul></li><li>두피는 손가락으로 털며 먼저 말린다<ul><li>뿌리에 습기가 남으면 오후에 꺼진다</li></ul></li><li>덜 마른 머리에 컬크림이나 무스를 움켜쥐듯 바른다</li><li>손바닥으로 머리 끝을 아래에서 위로 움켜쥐었다 놓기를 반복하며 약한 바람으로 말린다<ul><li>디퓨저(드라이기 앞에 끼우는 넓은 깔때기 모양)가 있으면 손 대신 디퓨저에 컬을 얹어 말린다. 바람이 퍼져서 컬이 안 흩어진다</li></ul></li><li>80% 정도 마르면 손을 떼고 찬바람이나 자연 방치로 마저 말린다</li><li>다 마르면 손가락으로 컬을 살짝 나눠 정리한다</li></ol><h3>자주 하는 실수</h3><ul><li>빗질하기 — 컬이 풀린다</li><li>센 바람·뜨거운 바람을 끝에 바로 대기 — 부스스해진다</li><li>다 마른 뒤 손으로 자꾸 만지기 — 부스스해진다</li><li>두피를 안 말리고 끝만 말리기 — 뿌리가 눌려 펌이 꺼져 보인다</li></ul>"}, {"id": "3fba453d2b29811fb995dc4c8a0e9b02", "n": "10. 모류 잡기 — 공통", "p": {"구분": "모류", "순서": 10}, "r": {}, "h": "<h3>언제 쓰나</h3><ul><li>모류 때문에 머리가 서거나 갈라지는 사람. 10-1~10-4 전부에 걸린다</li><li>모류는 머리가 자라는 방향이다. <strong>젖었을 때만 바뀐다.</strong> 조금이라도 마른 뿌리는 안 움직인다</li></ul><h3>쓰는 제품</h3><ul><li>항목마다 다르다. 10-1~10-4</li></ul><h3>순서</h3><ul><li>바람은 약하게. 센 바람은 모류를 더 흩트린다</li><li>이길 수 없는 모류는 따라가는 스타일로 고른다</li><li>매일 드라이로도 안 잡히면 앞머리펌(모류교정)을 한다</li></ul><h3>자주 하는 실수</h3><ul><li>반쯤 마른 상태에서 모류를 바꾸려 하기 — 안 바뀐다</li></ul>"}, {"id": "3fba453d2b29813fb464cd9bdfca25b2", "n": "10-1. 앞머리에 가마 있음", "p": {"구분": "모류", "손질 난이도": "보통", "순서": 10.1, "적합": ["앞머리에 가마 있음"]}, "r": {"쓰는 제품": ["3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b298118aac3f546a8ca69a4"]}, "h": "<h3>언제 쓰나</h3><ul><li>앞머리 쪽에 가마가 있어서 그 자리 머리가 서거나 한 곳이 계속 갈라지는 사람</li></ul><h3>쓰는 제품</h3><ul><li><strong>헤어토닉</strong>, 고정은 <strong>액상 스프레이</strong></li></ul><h3>순서</h3><ol><li>앞머리를 완전히 적신다</li><li>빗 등을 두피에 붙여 누른 채 앞머리를 한쪽으로 빗고, 빗 바로 뒤를 따라 약한 바람으로 말린다</li><li>반대쪽으로도 똑같이 한다. 좌우를 번갈아 X자로 여러 번 반복한다<ul><li>가마 자리 뿌리가 한쪽으로 고집부리던 게 풀린다</li></ul></li><li>원하는 방향으로 내리거나 넘긴 뒤 손바닥으로 눌러 끝까지 말린다</li><li>찬바람으로 고정하고, 서는 자리는 액상 스프레이로 잡는다</li></ol><h3>자주 하는 실수</h3><ul><li>센 바람 쓰기</li><li>가마 방향과 정반대로 억지로 넘기기 — 오후에 다시 선다</li></ul>"}, {"id": "3fba453d2b2981d9b5a7e94383a1f192", "n": "10-2. 앞머리 모류 오른쪽", "p": {"구분": "모류", "손질 난이도": "보통", "순서": 10.2, "적합": ["앞머리 모류 오른쪽"]}, "r": {"쓰는 제품": ["3f1a453d2b2981af9b4fc368b534b1bb"]}, "h": "<h3>언제 쓰나</h3><ul><li>앞머리가 오른쪽으로 쏠려 자라는 사람</li></ul><h3>쓰는 제품</h3><ul><li><strong>헤어토닉</strong></li></ul><h3>순서</h3><ol><li>앞머리를 완전히 적신다</li><li>왼쪽으로 넘겨 뿌리부터 말린다(반대로 말리기)</li><li>반쯤 마르면 원하는 방향으로 돌린다<ul><li>내리는 앞머리: 좌우 X자로 말린 뒤 앞으로 내린다 → 3번</li><li>넘기는 머리: 오른쪽으로 넘기면 모류를 그대로 이용해서 제일 쉽다. 가르마는 왼쪽에 탄다</li></ul></li><li>찬바람으로 고정한다</li></ol><h3>자주 하는 실수</h3><ul><li>쏠린 채로 위에서 눌러 말리기 — 한쪽만 뜨고 한쪽은 갈라진다</li></ul>"}, {"id": "3fba453d2b2981d29818f4b51060fa43", "n": "10-3. 앞머리가 앞으로 쏟아짐", "p": {"구분": "모류", "손질 난이도": "어려움", "순서": 10.3, "적합": ["앞머리가 앞으로 쏟아짐"]}, "r": {"쓰는 제품": ["3f1a453d2b2981af9b4fc368b534b1bb", "3f1a453d2b298118aac3f546a8ca69a4", "3f1a453d2b2981e984decca70a341880"]}, "h": "<h3>언제 쓰나</h3><ul><li>앞머리가 이마 쪽으로 자라서 올려도 자꾸 내려오는 사람</li><li>내리는 머리엔 오히려 유리하다. 그대로 앞으로 빗어 말리면 된다 → 3번</li></ul><h3>쓰는 제품</h3><ul><li><strong>헤어토닉</strong>, <strong>액상 스프레이</strong>, 마무리 <strong>가스 스프레이</strong></li></ul><h3>순서</h3><ul><li><strong>올리는 경우</strong></li></ul><ol><li>앞머리를 완전히 적신다</li><li>빗으로 앞머리를 뒤로 빗어 넘기고, 빗을 뿌리에 댄 채 앞쪽에서 뒤쪽으로 바람을 준다</li><li>뿌리를 손가락으로 들어 뒤로 당긴 채 열을 주고, 찬바람으로 다 식을 때까지 놓지 않는다</li><li>뿌리 안쪽에 액상 스프레이를 뿌리고 다시 드라이로 말린다</li><li>가스 스프레이로 마무리한다</li></ol><h3>자주 하는 실수</h3><ul><li>앞머리가 마른 뒤 올리기 — 바로 내려온다</li><li>끝만 올리고 뿌리는 그대로 — 무게로 쏟아진다</li></ul>"}, {"id": "3fba453d2b29819e9378d6ceab957732", "n": "10-4. 쌍가마", "p": {"구분": "모류", "손질 난이도": "보통", "순서": 10.4, "적합": ["쌍가마"]}, "r": {"쓰는 제품": ["3f1a45 {id:'fore',q:'이마와 헤어라인은 어떤가요?',opts:[['M자 이마','M자로 파였다',''],['넓은 이마','이마가 넓다',''],['좁은 이마','이마가 좁다',''],['','특별한 건 없다 / 모르겠다','']]},
{id:'head',q:'두상에서 신경 쓰이는 곳이 있나요?',multi:true,opts:[['정수리 납작','정수리가 납작하다','위에서 볼 때 눌려 보인다'],['뒤통수 납작','뒤통수가 납작하다','옆에서 볼 때 절벽'],['옆머리 뜸','옆머리가 뜬다','자고 일어나면 날개처럼 벌어진다'],['큰 두상','머리가 큰 편이다',''],['콘헤드','정수리가 뾰족하게 솟았다','옆에서 볼 때 위로 길다'],['얼굴 큼','얼굴이 큰 편이다','']]},
{id:'curl',q:'곱슬기는 어떤가요?',opts:[['직모','직모','곱슬기가 거의 없다'],['반곱슬','반곱슬','습하면 뜨고 부스스하다'],['강곱슬','곱슬이 강하다','컬이 뚜렷하다'],['','잘 모르겠다','']]},
{id:'thick',q:'모발 두께는 어떤가요?',opts:[['가는 모발','가늘다','힘이 없고 잘 눌린다'],['','보통',''],['굵은 모발','굵다','한 올이 굵고 억세다'],['','잘 모르겠다','']]},
{id:'dens',q:'숱은 어떤가요?',opts:[['숱 많음','많다','옆이 부풀고 잘 뻗친다'],['','보통',''],['숱 적음','적다','두피가 비쳐 보인다'],['탈모 초기','빠지는 게 신경 쓰인다','정수리나 이마 라인이 휑해졌다']]},
{id:'cow',q:'앞머리나 정수리 결이 이런가요?',multi:true,opts:[['앞머리에 가마 있음','앞머리 쪽에 가마가 있다','한 곳이 자꾸 갈라지거나 선다'],['앞머리 모류 오른쪽','앞머리가 오른쪽으로 쏠린다',''],['앞머리가 앞으로 쏟아짐','앞머리를 올려도 자꾸 내려온다',''],['쌍가마','가마가 두 개다','정수리 한 곳이 늘 선다']]},
{id:'etc',q:'추가로 해당되는 게 있나요?',multi:true,opts:[['새치','새치가 있다',''],['손상모','펌·염색으로 머리가 상했다','끝이 푸석하다']]},
{id:'care',q:'아침에 머리 손질, 얼마나 하실 건가요?',opts:[['어려움','매일 제대로 해도 된다','드라이·왁스 다 괜찮다'],['보통','5분 안쪽',''],['쉬움','거의 안 하고 싶다','말리기만 하고 싶다']]}
];
let step=0,ans={};
function score(x,tags){let s=0,hit=[],bad=[];(x.p['적합']||[]).forEach(t=>{if(tags.has(t)){s+=2;hit.push(t)}});(x.p['비적합']||[]).forEach(t=>{if(tags.has(t)){s-=3;bad.push(t)}});return{s,hit,bad}}
const LV={'쉬움':0,'보통':1,'어려움':2};
function quizHTML(){return '<div id="quiz"><div class="prog"><i id="prog"></i></div><div class="qn" id="qn"></div><div class="qt" id="qt"></div><div class="qhint" id="qhint"></div><div class="opts" id="opts"></div><div class="qnav"><button id="back" type="button">이전</button><button class="go" id="go" type="button">다음</button></div></div><div id="res" hidden></div>'}
function qrender(){
  const q=Q[step],cur=ans[q.id]||[],$=id=>document.getElementById(id);
  $('prog').style.width=(step/Q.length*100)+'%';$('qn').textContent='질문 '+(step+1)+' / '+Q.length;$('qt').textContent=q.q;
  $('qhint').textContent=q.multi?'해당되는 걸 모두 고르세요. 없으면 그냥 다음을 누르시면 됩니다.':'';$('qhint').hidden=!q.multi;
  $('opts').innerHTML=q.opts.map((o,i)=>'<button type="button" class="opt'+(cur.includes(i)?' sel':'')+'" data-i="'+i+'">'+(q.multi?'<b style="color:var(--ac);margin-right:7px">'+(cur.includes(i)?'✓':'+')+'</b>':'')+esc(o[1])+(o[2]?'<s>'+esc(o[2])+'</s>':'')+'</button>').join('');
  $('opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>qpick(q,+b.dataset.i));
  $('back').style.visibility=step?'visible':'hidden';$('go').textContent=step===Q.length-1?'결과 보기':'다음';
  $('go').disabled=!q.multi&&!(cur.length);
  $('go').onclick=qnext;$('back').onclick=()=>{if(step){step--;qrender()}};
}
function qpick(q,i){let cur=ans[q.id]||[];if(q.multi){cur=cur.includes(i)?cur.filter(x=>x!==i):cur.concat([i]);ans[q.id]=cur;qrender()}else{ans[q.id]=[i];qrender();setTimeout(qnext,180)}}
function qnext(){if(step<Q.length-1){step++;qrender();window.scrollTo({top:0,behavior:'smooth'})}else qshow()}
function qshow(){
  const tags=new Set();let care=2;
  Q.forEach(q=>(ans[q.id]||[]).forEach(i=>{const v=q.opts[i][0];if(q.id==='care')care=LV[v];else if(v)tags.add(v)}));
  const rank=(arr,f)=>arr.filter(f||(()=>true)).map(x=>({x,...score(x,tags)})).filter(r=>r.s>0).sort((a,b)=>b.s-a.s);
  const easy=x=>LV[x.p['손질 난이도']]==null||LV[x.p['손질 난이도']]<=care;
  const cuts=rank(S,x=>x.p['분류']==='커트'&&easy(x)),perms=rank(S,x=>x.p['분류']==='펌'&&easy(x)),tr=rank(T),dr=rank(Y,easy),pr=rank(P,x=>easy(x));
  const avoid=S.map(x=>({x,...score(x,tags)})).filter(r=>r.bad.length).sort((a,b)=>a.s-b.s).slice(0,6);
  const card=(r,lab,k)=>'<div class="pick"><div class="r">'+lab+'</div><div class="nm"><a href="#'+k+'_'+r.x.id+'">'+esc(r.x.n)+'</a></div><div class="sm">'+(r.hit.length?'맞는 이유: '+r.hit.map(esc).join(' · '):'')+(r.bad.length?' / 주의: '+r.bad.map(esc).join(' · '):'')+'</div></div>';
  let h='<h1>진단 결과</h1><p class="lead">고르신 항목 기준으로 정리했습니다. 커트와 시술은 같이 가는 조합입니다.</p>';
  if(!tags.size) h+='<p>고르신 항목이 없어 추천을 좁히기 어렵습니다. 대백과에서 스타일을 직접 둘러보세요.</p>';
  if(cuts.length) h+='<h2>커트</h2>'+cuts.slice(0,3).map((r,i)=>card(r,i?'다음 후보':'1순위','s')).join('');
  if(perms.length) h+='<h2>펌</h2>'+perms.slice(0,3).map((r,i)=>card(r,i?'다음 후보':'1순위','s')).join('');
  if(tr.length) h+='<h2>같이 하면 좋은 시술</h2>'+tr.slice(0,3).map((r,i)=>card(r,i?'다음 후보':'추천','t')).join('');
  if(dr.length) h+='<h2>집에서 이렇게 말리세요</h2>'+dr.slice(0,3).map(r=>card(r,'드라이','d')).join('');
  if(pr.length) h+='<h2>쓰면 좋은 제품</h2>'+pr.slice(0,4).map(r=>card(r,r.x.p['구분']||'제품','p')).join('');
  if(avoid.length) h+='<div class="avoid"><div class="t">피하는 게 좋습니다</div>'+avoid.map(r=>'<a href="#s_'+r.x.id+'">'+esc(r.x.n)+'</a>').join('')+'</div>';
  h+='<div style="margin-top:24px"><button class="opt" type="button" id="again" style="width:auto;display:inline-block">다시 진단하기</button></div>'+CTA;
  const res=document.getElementById('res');res.innerHTML=h;res.hidden=false;document.getElementById('quiz').hidden=true;
  const it=document.getElementById('intro');if(it)it.hidden=true;
  document.getElementById('again').onclick=()=>{step=0;ans={};route()};window.scrollTo({top:0,behavior:'smooth'});
}

/* ───── 화면들 ───── */
function home(){
  return '<div id="intro"><h1>내 얼굴형·모질에 맞는 남자 머리 찾기</h1><p class="lead">9개만 고르면 됩니다. 현장에서 실제로 쓰는 판단 기준 그대로, 스타일 '+S.length+'종 · 시술 '+T.length+'종 · 드라이 · 제품 중에서 골라 드립니다.</p></div>'+quizHTML()+
  '<h2>스타일별로 바로 보기</h2><div class="grid">'+S.map(x=>'<a class="cardl" href="#s_'+x.id+'"><span class="n">'+esc(x.n)+'</span><span class="d">'+esc([x.p['분류'],x.p['재방문 기간']&&('재방문 '+x.p['재방문 기간'])].filter(Boolean).join(' · '))+'</span></a>').join('')+'</div>'+
  '<p><a href="#styles">대백과 전체 보기 →</a></p>'+
  '<h2>미용실에서 말이 안 통한다면</h2><p>층, 숱, 단차, 테이퍼, 시스루… 미용실에서 쓰는 말을 모르면 원하는 걸 설명하기 어렵습니다. 자주 나오는 말 '+W.length+'개를 손님 입장에서 풀어 정리했습니다.</p><p><a href="#dict">미용언어 사전 보기 →</a></p>'+
  '<h2>누가 만들었나</h2><p><strong>화강</strong> · 꾸아트헤어 양재역점에서 <strong>남자 고객만</strong> 전담합니다. 양재역 4번출구 도보 3분.</p><p>상담할 때 같은 질문이 반복됩니다. "제 얼굴형에 뭐가 어울려요?" "옆머리가 자꾸 뜨는데요." 매번 설명하기엔 시간이 짧고, 검색해도 여자 머리 얘기이거나 광고뿐이라 현장에서 쓰는 판단 기준을 그대로 공개했습니다.</p>'+
  '<div class="meta"><div><b>매장</b>꾸아트헤어 양재역점</div><div><b>주소</b>서울 강남구 남부순환로 2615 극동스타클래스 2층</div><div><b>위치</b>양재역 4번출구 도보 3분</div><div><b>영업</b>화~토 10:00–20:30 · 일 10:00–19:30 · 월 14:00–20:30</div></div>'+CTA;
}
const TABS=[['styles','스타일'],['treat','시술'],['product','제품'],['dry','드라이']];
function tabs(on){return '<h1>남자머리 대백과</h1><div class="tabs">'+TABS.map(t=>'<a href="#'+t[0]+'"'+(t[0]===on?' class="on"':'')+'>'+t[1]+'</a>').join('')+'</div>'}
function list(on){
  let h=tabs(on);
  if(on==='styles'){h+='<p style="margin-top:14px">기장 짧은 순으로 정리했습니다.</p><div class="grid">'+S.map(x=>'<a class="cardl" href="#s_'+x.id+'"><span class="n">'+esc(x.n)+(reviewing(x)?' <span class="badge w">검수 중</span>':'')+'</span><span class="d">'+esc([x.p['분류'],x.p['기장'],x.p['손질 난이도']&&('손질 '+x.p['손질 난이도'])].filter(Boolean).join(' · '))+'</span></a>').join('')+'</div>'}
  if(on==='treat'){const g={};T.forEach(x=>(g[x.p['분류']||'기타']=g[x.p['분류']||'기타']||[]).push(x));Object.keys(g).forEach(k=>{h+='<h2>'+esc(k)+'</h2><div class="grid">'+g[k].map(x=>'<a class="cardl" href="#t_'+x.id+'"><span class="n">'+esc(x.n)+(reviewing(x)?' <span class="badge w">검수 중</span>':'')+'</span><span class="d">'+esc([x.p['손상도']&&('손상도 '+x.p['손상도']),x.p['유지 기간']].filter(Boolean).join(' · '))+'</span></a>').join('')+'</div>'})}
  if(on==='product'){['스타일링 제품','관리 제품'].forEach(k=>{h+='<h2>'+k+'</h2><div class="grid">'+P.filter(x=>x.p['구분']===k).map(x=>'<a class="cardl" href="#p_'+x.id+'"><span class="n">'+esc(x.n)+'</span><span class="d">'+esc([x.p['분류'],x.p['고정력']&&('고정력 '+x.p['고정력'])].filter(Boolean).join(' · '))+'</span></a>').join('')+'</div>'})}
  if(on==='dry'){h+='<p style="margin-top:14px">부위별로 나눴습니다. 1번 기본 말리기 위에 필요한 부위를 얹으면 됩니다.</p><div class="grid">'+Y.map(x=>'<a class="cardl" href="#d_'+x.id+'"><span class="n">'+esc(x.n)+'</span><span class="d">'+esc([x.p['구분'],x.p['손질 난이도']&&('손질 '+x.p['손질 난이도'])].filter(Boolean).join(' · '))+'</span></a>').join('')+'</div>'}
  return h;
}
const META={s:['분류','기장','계열','손질 난이도','재방문 기간'],t:['분류','시술 시간','유지 기간','재방문 기간','손상도'],p:['구분','분류','고정력','광택','세척','손질 난이도'],d:['구분','손질 난이도']};
const BACK={s:['styles','스타일'],t:['treat','시술'],p:['product','제품'],d:['dry','드라이']};
const RELN={'쓰는 시술':'같이 하는 시술','쓰는 제품':'쓰는 제품','쓰는 드라이':'드라이','쓰는 스타일':'이 스타일에 써요'};
function detail(k,id){
  const a=ALL[id];if(!a)return list('styles');const x=a.x;
  let h='<a class="back" href="#'+BACK[k][0]+'">← '+BACK[k][1]+' 목록</a><h1>'+esc(x.n)+(reviewing(x)?' <span class="badge w">검수 중</span>':'')+'</h1>';
  const m=META[k].filter(f=>x.p[f]).map(f=>'<div><b>'+f+'</b>'+esc(x.p[f])+'</div>').join('');if(m)h+='<div class="meta">'+m+'</div>';
  const ok=x.p['적합']||[],ng=x.p['비적합']||[];
  if(ok.length)h+='<div class="lbl">'+(k==='d'?'이런 분께 필요합니다':'잘 맞습니다')+'</div><div class="chips ok">'+ok.map(t=>'<span>'+esc(t)+'</span>').join('')+'</div>';
  if(ng.length)h+='<div class="lbl">피하는 게 좋습니다</div><div class="chips ng">'+ng.map(t=>'<span>'+esc(t)+'</span>').join('')+'</div>';
  h+='<div class="body">'+x.h+'</div>';
  Object.keys(x.r||{}).forEach(rk=>{const ids=(x.r[rk]||[]).filter(i=>ALL[i]);if(ids.length)h+='<h2 class="rel">'+esc(RELN[rk]||rk)+'</h2><div class="grid">'+ids.map(link).join('')+'</div>'});
  return h+CTA;
}
function dict(){
  return '<h1>미용언어 사전</h1><p class="lead">미용실에서 듣는 말을 손님 입장에서 풀었습니다.</p><label for="dsearch" class="lbl">찾기</label><input id="dsearch" type="search" placeholder="예: 단차, 숱, 다운펌" autocomplete="off"><div class="dcount" id="dcount"></div><div id="dlist"></div>';
}
function dictRender(qs){
  const q=(qs||'').trim();const f=W.filter(w=>!q||(w.w+w.al+w.sh+w.de).includes(q));
  document.getElementById('dcount').textContent=(q?'"'+q+'" 검색 결과 ':'전체 ')+f.length+'개';
  let h='',cat='';f.forEach(w=>{if(w.cat!==cat){cat=w.cat;h+='<div class="dcat">'+esc(cat)+'</div>'}h+='<div class="term"><span class="w">'+esc(w.w)+'</span>'+(w.al?'<span class="al">'+esc(w.al)+'</span>':'')+'<p class="sh">'+esc(w.sh)+'</p>'+(w.de?'<p class="sh">'+esc(w.de)+'</p>':'')+'</div>'});
  document.getElementById('dlist').innerHTML=h||'<p>찾는 말이 없습니다. 다른 표현으로 검색해 보세요.</p>';
}
function route(){
  const hs=(location.hash||'#home').slice(1);let nav='',h;
  const m=hs.match(/^([stpd])_([0-9a-f]+)$/);
  if(m){h=detail(m[1],m[2]);nav='book'}
  else if(TABS.some(t=>t[0]===hs)){h=list(hs);nav='book'}
  else if(hs==='dict'){h=dict();nav='dict'}
  else if(hs==='find'){h='<div id="intro"><h1>내 머리 찾기</h1><p class="lead">9개만 고르면 됩니다.</p></div>'+quizHTML();nav='find'}
  else h=home();
  app.innerHTML=h;
  document.querySelectorAll('.nav a[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===nav));
  if(document.getElementById('quiz')){step=0;ans={};qrender()}
  if(hs==='dict'){const s=document.getElementById('dsearch');s.oninput=()=>dictRender(s.value);dictRender('')}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);route();
</script>
